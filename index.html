function seiteStation(st){
  aufraeumen();
  const stt=status(st);
  if(stt==="zu"||stt==="morgen"){location.hash=home();return}
  if(st.spiel&&!spielplatzOffen()){toast("🔒 Der Spielplatz öffnet, wenn du heute deine Station geschafft hast.");location.hash=home();return}
  const frei=VS||!!st.spiel;   // frei: „Weiter“ geht immer (Vorschau und Spielplatz)
  if(!laufend||laufend.st!==st){
    const prog=meineStaende()[st.id]||{schritt:0,punkte:{},daten:{},start:Date.now(),aktiv:0};
    laufend={st,prog};
  }
  const {prog}=laufend;
  if(prog.fertig)return seiteErgebnis(st,prog);
  const i=Math.min(prog.schritt,st.schritte.length-1),sch=st.schritte[i];
  const geloest=i in prog.punkte;
  $("#app").innerHTML=`
  <div class="leiste noprint"><div class="wo">${pix(st.id,22)}<span>${esc(st.titel)}</span></div><span>Teil ${i+1} von ${st.schritte.length}</span>${st.spiel?`<span class="pts">Spielplatz, ohne Note</span>`:`<span class="pts">${summe(prog)} Punkte</span>`}</div>
  <div class="steps noprint springen">${st.schritte.map((_,k)=>{const darf=VS||k in prog.punkte||k<=(prog.weitester||0);
    return`<i class="${k in prog.punkte?"ok":k===i?"now":""}${darf?"":" zu"}"${darf?` data-sp="${k}" title="Zu Teil ${k+1}"`:""}></i>`}).join("")}</div>
  <h1>${esc(sch.titel)}</h1>
  ${sch.merke?`<div class="aha merke"><b>Merke</b> ${sch.merke}</div>`:""}
  <div id="body"></div>
  <div class="nav noprint">
    <button class="btn ghost pfeil" id="zur">${i===0?"Zum Lernpfad":"Zurück"}</button>
    <button class="btn pfeil" id="weiter">${i===st.schritte.length-1?"Fertig":"Weiter"}</button>
  </div>`;
  prog.weitester=Math.max(prog.weitester||0,i);
  kopfAktiv();
  prog.daten[i]=prog.daten[i]||{};
  const ctx={
    daten:prog.daten[i],
    geloest,
    speichern:()=>speichern(),
    /* Ein falscher Versuch kostet 2 Punkte, aber höchstens die Hälfte der Punkte dieses Teils */
    fehler(){prog.fehler=prog.fehler||{};prog.fehler[i]=(prog.fehler[i]||0)+1;speichern();
      /* Raten erkennen: zwei falsche Versuche innerhalb weniger Sekunden → kurze Lese-Pause statt weiterem Raten */
      const jetzt=Date.now();serie=jetzt-letzterFehler<7000?serie+1:1;letzterFehler=jetzt;
      if(serie>=2&&!frei){serie=0;lesePause(15)}},
    geschafft(p){if(!(i in prog.punkte)){const f=(prog.fehler||{})[i]||0;p=Math.max(Math.ceil(p/2),p-2*f);prog.punkte[i]=p;speichern(true);
        if(p>0)toast(`Geschafft, +${p} Punkte`);
        $(".pts").textContent=`${summe(prog)} Punkte`;
        $(".steps").children[i].className="ok"}
      ctx.geloest=true},
    pruefer:null,   // Teil setzt hier eine Prüf-Funktion (true = richtig); „Weiter“ ruft sie auf
    loesung:null,   // Teil setzt hier eine Funktion, die die Lösung zeigt (Lehrer-Vorschau)
    beimVerlassen:f=>aufraeumListe.push(f),
  };
  window._ctx=ctx;   // für automatische Tests
  sch.zeige($("#body"),ctx);
  if(VS&&ctx.loesung){$("#body").insertAdjacentHTML("beforebegin",`<button class="btn ghost noprint" id="loesung" style="margin:0 0 14px;min-height:40px;padding:6px 14px">Lösung zeigen (nur Vorschau)</button>`);
    $("#loesung").onclick=()=>{ctx.loesung();$("#loesung").remove()}}
  document.querySelectorAll("[data-sp]").forEach(x=>x.onclick=()=>{prog.schritt=+x.dataset.sp;speichern();seiteStation(st);scrollTo(0,0)});
  $("#zur").onclick=()=>{if(i===0){location.hash=home()}else{prog.schritt=i-1;speichern();seiteStation(st);scrollTo(0,0)}};
  const vor=()=>{if(i===st.schritte.length-1){
      if(st.spiel){delete staende[st.id];staendeLokal();laufend=null;toast("Gut gespielt.");location.hash=home();return}
      prog.fertig=Date.now();prog.erg={p:summe(prog),max:maxPunkte(st),z:zeichenAus(prozent(st,prog)),f:Object.values(prog.fehler||{}).reduce((a,b)=>a+b,0)};speichern(true);seiteErgebnis(st,prog)}
    else{prog.schritt=i+1;speichern();seiteStation(st)}
    scrollTo(0,0)};
  /* „Weiter“ prüft automatisch: richtig → kurz Erfolg zeigen, dann weiter; falsch → bleiben, Rückmeldung steht da */
  let sperre=false,pause=0,letzterFehler=0,serie=0,pauseTimer=null;
  function lesePause(sek){const w=$("#weiter");if(!w)return;pause=Date.now()+sek*1000;const text=w.textContent;w.disabled=true;
    const tick=()=>{const r=Math.ceil((pause-Date.now())/1000);if(r<=0||!w.isConnected){clearInterval(pauseTimer);if(w.isConnected){w.disabled=false;w.textContent=text}return}
      w.textContent=`Erst lesen (${r})`};
    tick();pauseTimer=setInterval(tick,500);aufraeumListe.push(()=>clearInterval(pauseTimer));
    toast("Nicht raten. Lies die Aufgabe noch einmal in Ruhe.")}
  $("#weiter").onclick=()=>{if(sperre)return;
    if(frei||i in prog.punkte)return vor();
    if(ctx.pruefer){if(ctx.pruefer()){sperre=true;setTimeout(vor,900)}return}
    toast("Löse zuerst diesen Teil.")};
}

}

  ${VS||z==="+"?"":`<p class="muted" style="margin-top:14px">Der Spielplatz öffnet nur mit einem +. Du kannst die Station noch einmal machen. Dann zählt dein neues Ergebnis.</p>`}`;

/* Notfall-Datei: alle Noten als Tabelle (öffnet in Excel) – auf Knopfdruck und einmal täglich automatisch */
function notfallCsv(){const d=lDaten;if(!d)return"";
  const tierVon=Object.fromEntries(d.kinder.map(k=>[k.id,k])),titel=Object.fromEntries(STATIONEN.map(s=>[s.id,s.titel]));
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const kopf=["Klasse","Name","Tier","Station","Stand","Note","Punkte","von","Fehlversuche","Minuten","Fertig am"];
  const z=[];const schon=new Set();
  (d.abschluesse||[]).forEach(a=>{schon.add(a.kind_id+"|"+a.station+"|"+new Date(a.fertig_am).getTime());
    z.push([a.klasse,namen[a.kind_id]||"",a.tier,titel[a.station]||a.station,tierVon[a.kind_id]?"fertig":"fertig (Kind gelöscht)",a.note,a.punkte,a.max,a.fehlversuche,a.minuten,new Date(a.fertig_am).toLocaleString("de-DE")])});
  d.kinder.forEach(k=>Object.entries(d.staende[k.id]||{}).forEach(([id,p])=>{const st=STATIONEN.find(s=>s.id===id);if(!st||st.spiel)return;
    if(p.fertig&&schon.has(k.id+"|"+id+"|"+p.fertig))return;
    z.push([k.klasse,namen[k.id]||"",k.tier,st.titel,p.fertig?"fertig":`Teil ${(p.schritt||0)+1} von ${st.schritte.length}`,zeichenAus(prozent(st,p)),summe(p),maxPunkte(st),Object.values(p.fehler||{}).reduce((a,b)=>a+b,0),Math.round((p.aktiv||0)/60000),p.fertig?new Date(p.fertig).toLocaleString("de-DE"):""])}));
  z.sort((a,b)=>String(a[0]+a[1]+a[2]).localeCompare(String(b[0]+b[1]+b[2]),"de"));
  return"\uFEFF"+[kopf,...z].map(r=>r.map(q).join(";")).join("\r\n")}
function notfallLaden(auto){const csv=notfallCsv();if(!csv)return;
  try{localStorage.setItem("if5-notfall",csv);localStorage.setItem("if5-notfall-zeit",new Date().toISOString())}catch(e){}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=`Informatik5-Noten-${new Date().toLocaleDateString("sv")}.csv`;a.click();URL.revokeObjectURL(a.href);
  lsSet("if5-notfall-tag",{tag:new Date().toDateString(),n:(lDaten.abschluesse||[]).length});
  toast(auto?"Notfall-Datei mit allen Noten wurde automatisch gespeichert.":"Notfall-Datei gespeichert.")}

}

    return`<tr><td class="t"><span class="e">${t.emoji}</span>${esc(t.name)}</td>
      <td><input type="text" class="vn" data-id="${k.id}" value="${esc(namen[k.id]||"")}" placeholder="Wer ist das?" list="dl-${esc(kl)}"></td><td>${status}</td>${zellen}
      <td><button class="link" data-a="mehr" data-id="${k.id}" aria-label="Mehr">⋯</button></td></tr>`};
  $("#lb").innerHTML=`
  <div class="tabs noprint">${KLASSEN.map(k=>`<button class="${k===kl?"an":""}" data-kl="${k}">${k} <span class="muted small">${d.kinder.filter(x=>x.klasse===k).length}</span></button>`).join("")}</div>
  <div class="block frei-box ${offen?"offen":""}">
    <div><h2 style="margin:0">${offen?`${kl} ist offen`:`${kl} ist zu`}</h2><p class="muted small" style="margin:2px 0 0">${esc(info)}</p></div>
    <div class="row">${hand?`<button class="btn ghost" id="plan">Wieder nach Stundenplan</button>`:""}<button class="btn" id="frei">${offen?"Jetzt schließen":`Jetzt öffnen (${FREIGABE_MIN} Min.)`}</button></div>
  </div>
  ${(()=>{const heute=new Date().toDateString(),zeilen=[];

/* ---------- Bausteine für Stationen ---------- */

/* Pixel-Raster: w×h Kästchen, Werte = Index in palette. Malen mit Maus, Finger oder Stift (auch Ziehen). */
function pixelRaster({w,h,werte,palette,malbar=false,farbe=()=>1,klein=false,onAenderung}){
  const el=document.createElement("div");el.className="px"+(malbar?" malbar":"")+(klein?" klein":"");
  el.style.gridTemplateColumns=`repeat(${w},1fr)`;el.style.aspectRatio=`${w}/${h}`;
  if(h<w)el.style.maxWidth=`${Math.round(340*Math.max(h/w,.5))*w/h}px`;
  const v=werte?werte.slice():Array(w*h).fill(0);
  const zellen=v.map((x,k)=>{const c=document.createElement("i");c.style.background=palette[x];c.dataset.k=k;el.append(c);return c});
  const setze=(k,x)=>{if(v[k]===x)return;v[k]=x;zellen[k].style.background=palette[x];zellen[k].classList.remove("falsch");onAenderung&&onAenderung(v)};
  if(malbar){let mal=null;
    const ziel=e=>{const t=document.elementFromPoint(e.clientX,e.clientY);return t&&t.parentNode===el?+t.dataset.k:null};
    el.addEventListener("pointerdown",e=>{const k=ziel(e);if(k==null)return;e.preventDefault();el.setPointerCapture(e.pointerId);
      const f=farbe();mal=v[k]===f?0:f;setze(k,mal)});
    el.addEventListener("pointermove",e=>{if(mal==null)return;const k=ziel(e);if(k!=null)setze(k,mal)});
    const ende=()=>{mal=null};el.addEventListener("pointerup",ende);el.addEventListener("pointercancel",ende);
  }
  return{el,werte:v,setzeAlle(a){a.forEach((x,k)=>setze(k,x))},markiere(falsch){zellen.forEach((c,k)=>c.classList.toggle("falsch",falsch.includes(k)))}};
}

/* Aha-Frage: kurze Frage mit 3 leichten Antworten. Nach der richtigen Antwort erklärt ein „Aha!“-Kasten den Sinn.
   frage("Titel","Frage?",["richtig","falsch"],"Erklärung",punkte,bildHTML)  – die erste Antwort ist die richtige, angezeigt wird gemischt.
   Für Klasse 5: kurze Frage, 2 Antworten mit Emoji, eine davon offensichtlich falsch. */
function frage(titel,text,antworten,aha,punkte=5,bild=""){return{titel,punkte,zeige(el,ctx){
  const reihe=ctx.daten.reihe||(ctx.daten.reihe=antworten.map((_,k)=>k).sort(()=>Math.random()-.5));ctx.speichern();
  el.innerHTML=`<p class="frage">${text}</p>${bild}<div class="antworten">${reihe.map(k=>`<button class="antwort" data-k="${k}">${esc(antworten[k])}</button>`).join("")}</div><div id="aha"></div>`;
  const zeigeAha=()=>{el.querySelector("#aha").innerHTML=`<div class="aha"><b>💡 Aha!</b> ${aha}</div>`;
    el.querySelectorAll(".antwort").forEach(b=>{b.disabled=true;if(b.dataset.k==="0")b.classList.add("richtig")})};
  ctx.pruefer=()=>{toast("Tippe zuerst auf eine Antwort.");return false};
  ctx.loesung=()=>{const b=el.querySelector('.antwort[data-k="0"]');b.classList.add("richtig");el.querySelector("#aha").innerHTML=`<div class="aha"><b>💡 Aha!</b> ${aha}</div>`};
  if(ctx.geloest)return zeigeAha();
  el.querySelectorAll(".antwort").forEach(b=>b.onclick=()=>{
    if(b.dataset.k==="0"){zeigeAha();ctx.geschafft(punkte)}
    else{ctx.fehler();b.classList.add("falsch");b.disabled=true;toast("Nicht ganz – versuch es noch mal!")}});
}}}

/* Farbauswahl für Pixel-Raster */
function farbLeiste(palette,nm,start=1,ohneWeiss=false,mitZahlen=true){
  const el=document.createElement("div");el.className="pal";let wahl=start;
  palette.forEach((f,k)=>{if(ohneWeiss&&k===0)return;const b=document.createElement("button");b.type="button";b.style.setProperty("--c",f);
    const rad=k===0;b.setAttribute("aria-label",rad?"Radierer":nm[k]);b.title=rad?"Radierer (macht weiß)":nm[k];
    b.innerHTML=rad?`<span class="rad">🧽</span>`:mitZahlen?`<span>${k}</span>`:"";b.className=(k===wahl?"an":"")+(rad?" radierer":"");
    b.onclick=()=>{wahl=k;el.querySelectorAll("button").forEach(x=>x.classList.remove("an"));b.classList.add("an")};el.append(b)});
  return{el,farbe:()=>wahl};
}

/* =====================================================================
   Gemeinsame Bausteine für alle Stationen.
   Jeder Baustein ist ein Teil (Schritt): {titel, punkte, merke, zeige(el, ctx)}.
   Er setzt ctx.pruefer (true = richtig, wird von „Weiter“ aufgerufen) und ctx.loesung (Lehrer-Vorschau).
   Rückmeldungen erscheinen im Kasten .mld unter der Aufgabe.
   ===================================================================== */
const mischen=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const mischenAnders=a=>{if(a.length<2)return a.slice();let b;do{b=mischen(a)}while(b.every((x,i)=>x===a[i]));return b};
const MLD=`<div class="mld"></div>`;
function meldung(el,ok,html){const m=el.querySelector(".mld");if(!m)return;m.className="mld msg "+(ok===null?"info":ok?"ok":"no");m.innerHTML=html;m.scrollIntoView({block:"nearest",behavior:"smooth"})}
function schonGeloest(el){meldung(el,true,"Schon gelöst. Tippe auf „Weiter“.")}
/* Einheitliche Bewertung: leer → Hinweis ohne Abzug; Fehler → 2 Punkte Abzug (nur einmal pro gleichem Stand); ab 2. Versuch Fehler markieren */
function bewerte(ctx,el,{leer,leerText,fehler,stand,punkte,okText,markiere}){
  if(leer){meldung(el,false,leerText||"Mach zuerst die Aufgabe, dann tippe auf „Weiter“.");return false}
  if(!fehler){meldung(el,true,okText||"Richtig!");ctx.geschafft(punkte);return true}
  const d=ctx.daten;
  if(stand!==d.letzterFehler){ctx.fehler();d.letzterFehler=stand;d.versuche=(d.versuche||0)+1;ctx.speichern()}
  let t=fehler===1?"Fast! Noch <b>1 Fehler</b>.":`Noch <b>${fehler} Fehler</b>.`;
  if(stand===d.letzterFehler&&d.versuche&&markiere&&d.versuche>=2){markiere();t+=" Die falschen sind jetzt <b style='color:var(--bad)'>rot</b> markiert."}
  else t+=" Schau noch mal genau hin.";
  meldung(el,false,t);return false;
}
const kopfText=t=>t?`<div class="regel">${t}</div>`:"";

/* ---------- Sortieren: Karten in Kästen verteilen (antippen oder ziehen) ----------
   sortieren({titel,punkte,merke,text,toepfe:[["id","Name","🙂"]],karten:[["Text","🙂","zielId"]],warum:"Erklärung nach dem Lösen"}) */
function sortieren({titel,punkte=10,merke,text,toepfe,karten,warum,breit}){return{titel,punkte,merke,zeige(el,ctx){
  const d=ctx.daten;d.wo=d.wo||{};if(!d.reihe){d.reihe=mischen(karten.map((_,i)=>i));ctx.speichern()}
  let wahl=null,falsch=new Set();
  const karte=i=>{const [t,ico]=karten[i];return`<button class="karte${wahl===i?" an":""}${falsch.has(i)?" falsch":""}" data-i="${i}" draggable="true">${ico?`<span class="kico">${ico}</span>`:""}<span>${t}</span></button>`};
  const zeichne=()=>{
    const frei=d.reihe.filter(i=>d.wo[i]==null);
    el.innerHTML=kopfText(text)+`
      <p class="eyebrow" style="margin-top:12px">${frei.length?`Tippe eine Karte an, dann den passenden Kasten · noch ${frei.length}`:"Alle verteilt! Tippe auf „Weiter“."}</p>
      <div class="sortier"><div class="karten">${frei.map(karte).join("")}</div>
      <div class="toepfe${breit?" breit":""}" style="--n:${toepfe.length}">${toepfe.map(([id,name,ico])=>`<div class="topf${wahl!=null?" bereit":""}" data-t="${id}"><div class="topf-kopf">${ico?`<span>${ico}</span>`:""}${name}</div><div class="topf-inhalt">${d.reihe.filter(i=>d.wo[i]===id).map(karte).join("")}</div></div>`).join("")}</div></div>${MLD}`;
    el.querySelectorAll(".karte").forEach(b=>{const i=+b.dataset.i;
      b.onclick=e=>{e.stopPropagation();if(d.wo[i]!=null){delete d.wo[i];falsch.delete(i);wahl=i;ctx.speichern()}else wahl=wahl===i?null:i;zeichne()};
      b.ondragstart=e=>{wahl=i;e.dataTransfer.setData("text/plain",String(i))}});
    el.querySelectorAll(".topf").forEach(t=>{
      const legen=()=>{if(wahl==null)return toast("Tippe zuerst oben eine Karte an.");d.wo[wahl]=t.dataset.t;falsch.delete(wahl);wahl=null;ctx.speichern();zeichne()};
      t.onclick=legen;t.ondragover=e=>e.preventDefault();t.ondrop=e=>{e.preventDefault();legen()}});
  };
  zeichne();
  ctx.pruefer=()=>{const fs=karten.map((k,i)=>i).filter(i=>d.wo[i]!==karten[i][2]);
    return bewerte(ctx,el,{leer:karten.some((k,i)=>d.wo[i]==null),leerText:"Verteile zuerst alle Karten.",fehler:fs.length,stand:JSON.stringify(d.wo),punkte,
      okText:`Richtig! Alles passt.${warum?`<div class="aha" style="margin-top:10px"><b>💡</b> ${warum}</div>`:""}`,markiere:()=>{falsch=new Set(fs);zeichne()}})};
  ctx.loesung=()=>{karten.forEach((k,i)=>d.wo[i]=k[2]);wahl=null;falsch.clear();zeichne()};
  if(ctx.geloest)schonGeloest(el);
}}}

/* ---------- Reihenfolge: Schritte in die richtige Reihenfolge bringen ----------
   reihenfolge({titel,punkte,merke,text,schritte:["erst","dann",…]})  (in richtiger Reihenfolge angeben) */
function reihenfolge({titel,punkte=10,merke,text,schritte}){return{titel,punkte,merke,zeige(el,ctx){
  const d=ctx.daten;if(!d.reihe){d.reihe=mischenAnders(schritte.map((_,i)=>i));ctx.speichern()}d.gew=d.gew||[];
  let falsch=new Set();
  const zeichne=()=>{
    const frei=d.reihe.filter(i=>!d.gew.includes(i));
    el.innerHTML=kopfText(text)+`
      <div class="paar" style="margin-top:12px"><div><p class="eyebrow">Tippe die Schritte der Reihe nach an</p><div class="karten spalte">${frei.map(i=>`<button class="karte" data-f="${i}">${schritte[i]}</button>`).join("")||`<p class="muted">Alle eingeordnet.</p>`}</div></div>

  };

/* ---------- Paare: Links und rechts verbinden ----------
   paare({titel,punkte,merke,text,paare:[["links","rechts"],…]}) */
const PAAR_FARBEN=["#4338CA","#E5383B","#2DA44E","#F08A24","#8E5BD6","#0EA5B7","#C2185B","#8B5A2B"];
function paare({titel,punkte=10,merke,text,paare:liste}){return{titel,punkte,merke,zeige(el,ctx){
  /* Häppchenweise: höchstens 3 bis 4 Paare auf einmal, dann die nächsten */
  const gruppen=[];for(let k=0;k<liste.length;k+=3)gruppen.push(liste.map((_,i)=>i).slice(k,k+3));
  if(gruppen.length>1&&gruppen[gruppen.length-1].length===1)gruppen[gruppen.length-2].push(...gruppen.pop());
  const d=ctx.daten;if(!d.reihe){d.reihe=mischenAnders(liste.map((_,i)=>i));ctx.speichern()}d.zu=d.zu||{};d.runde=Math.min(d.runde||0,gruppen.length-1);   // d.zu: rechtsIndex → linksIndex
  let wahl=null,falsch=new Set(),lob="";
  const zeichne=()=>{const g=gruppen[d.runde],rechts=d.reihe.filter(r=>g.includes(r));
    el.innerHTML=kopfText(text)+`<p class="eyebrow" style="margin-top:12px">${gruppen.length>1?`Runde ${d.runde+1} von ${gruppen.length}. `:""}Tippe links etwas an, dann rechts das Passende</p>
      <div class="paare"><div>${g.map((i,n)=>{const vergeben=Object.values(d.zu).includes(i);return`<button class="karte links${wahl===i?" an":""}" data-l="${i}" style="--pf:${PAAR_FARBEN[n%8]}"><span class="pnr${vergeben?" voll":""}">${n+1}</span>${liste[i][0]}</button>`}).join("")}</div>
      <div>${rechts.map(r=>{const l=d.zu[r],n=g.indexOf(l);return`<button class="karte rechts${falsch.has(r)?" falsch":""}" data-r="${r}" ${l!=null?`style="--pf:${PAAR_FARBEN[n%8]}"`:""}><span class="pnr${l!=null?" voll":""}">${l!=null?n+1:"?"}</span>${liste[r][1]}</button>`}).join("")}</div></div>${MLD}`;
    if(lob){meldung(el,true,lob);lob=""}
    el.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{const i=+b.dataset.l;wahl=wahl===i?null:i;zeichne()});
    el.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const r=+b.dataset.r;
      if(wahl==null){if(d.zu[r]!=null){delete d.zu[r];ctx.speichern();zeichne()}else toast("Tippe zuerst links etwas an.");return}
      for(const k in d.zu)if(d.zu[k]===wahl)delete d.zu[k];
      d.zu[r]=wahl;wahl=null;falsch.delete(r);ctx.speichern();zeichne()});
  };
  zeichne();
  ctx.pruefer=()=>{const g=gruppen[d.runde],fs=g.filter(r=>d.zu[r]!==r),leer=g.some(r=>d.zu[r]==null),letzte=d.runde===gruppen.length-1;
    if(!leer&&!fs.length&&!letzte){d.runde++;d.letzterFehler=null;d.versuche=0;ctx.speichern();lob="Richtig. Jetzt die nächsten Paare.";zeichne();return false}
    return bewerte(ctx,el,{leer,leerText:"Verbinde zuerst alle Paare.",fehler:fs.length,stand:JSON.stringify(d.zu),punkte,
      okText:"Richtig. Alle Paare passen.",markiere:()=>{falsch=new Set(fs);zeichne()}})};
  ctx.loesung=()=>{gruppen[d.runde].forEach(i=>d.zu[i]=i);zeichne()};
  if(ctx.geloest)schonGeloest(el);
}}}

/* ---------- Entscheidung: Situationen, in denen das Kind entscheidet, was es tun würde ----------
   entscheidung({titel,punkte,merke,szenen:[{bild:"💬",text:"…",optionen:[["Antwort",true,"Rückmeldung"],…]}]}) */
function entscheidung({titel,punkte=10,merke,text,szenen,frage:frage0}){return{titel,punkte,merke,zeige(el,ctx){
  const d=ctx.daten;d.s=d.s||0;d.ok=d.ok||{};if(!d.reihen){d.reihen=szenen.map(s=>mischen(s.optionen.map((_,i)=>i)));ctx.speichern()}
  let weg=new Set();
  const zeichne=()=>{
    if(d.s>=szenen.length){el.innerHTML=kopfText(text)+`<div class="msg ok">Alle Situationen geschafft! Tippe auf „Weiter“.</div>`;return}
    const sz=szenen[d.s],gut=d.ok[d.s]!=null;
    el.innerHTML=kopfText(text)+`<p class="eyebrow" style="margin-top:12px">Situation ${d.s+1} von ${szenen.length}</p>
      <div class="szene"><span class="sz-bild">${sz.bild||"💭"}</span><div class="sz-text">${sz.text}</div></div>
      <p class="frage">${sz.frage||frage0||"Was machst du?"}</p>
      <div class="antworten">${d.reihen[d.s].map(i=>{const [t,r]=sz.optionen[i];return`<button class="antwort${gut&&r?" richtig":""}${weg.has(i)?" falsch":""}" data-o="${i}" ${gut||weg.has(i)?"disabled":""}>${t}</button>`}).join("")}</div>${MLD}`;
    if(gut){const o=sz.optionen.find(o=>o[1]);meldung(el,true,`${o[2]||"Richtig!"} <br><b>Tippe auf „Weiter“.</b>`)}
    el.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const i=+b.dataset.o,o=sz.optionen[i];
      if(o[1]){d.ok[d.s]=i;ctx.speichern();zeichne()}
      else{weg.add(i);ctx.fehler();zeichne();meldung(el,false,`✗ ${o[2]||"Das ist keine gute Idee."} Versuch es noch mal.`)}});
  };
  zeichne();
  ctx.pruefer=()=>{
    if(d.s>=szenen.length){ctx.geschafft(punkte);return true}
    if(d.ok[d.s]==null){meldung(el,false,"Tippe zuerst auf eine Antwort.");return false}
    d.s++;weg=new Set();ctx.speichern();
    if(d.s>=szenen.length){ctx.geschafft(punkte);return true}
    zeichne();scrollTo({top:0,behavior:"smooth"});return false};
  ctx.loesung=()=>{if(d.s<szenen.length){d.ok[d.s]=szenen[d.s].optionen.findIndex(o=>o[1]);zeichne()}};
}}}

/* ---------- Tipp-Training: Zeilen abtippen, Tastatur zeigt den nächsten Buchstaben und den Finger ---------- */
const TAST_REIHEN=["1234567890ß","qwertzuiopü","asdfghjklöä","yxcvbnm,.-"];
const FINGER={};["1qay","2wsx","3edc","4rfv5tgb","6zhn7ujm","8ik,","9ol.","0pöäüß-"].forEach((g,f)=>[...g].forEach(c=>FINGER[c]=f));
const FINGER_NAME=["kleiner Finger links","Ringfinger links","Mittelfinger links","Zeigefinger links","Zeigefinger rechts","Mittelfinger rechts","Ringfinger rechts","kleiner Finger rechts"];
function tastaturBild(naechst){
  const k=(naechst||"").toLowerCase(),gross=naechst&&naechst!==k;
  return`<div class="tastatur">${TAST_REIHEN.map((r,ri)=>`<div class="t-reihe" style="padding-left:${ri*14}px">${ri===3?`<span class="taste breit${gross?" naechst":""}">⇧</span>`:""}${[...r].map(c=>`<span class="taste f${FINGER[c]}${c===k?" naechst":""}${c==="f"||c==="j"?" huegel":""}">${c==="ß"?"ß":c.toUpperCase()}</span>`).join("")}</div>`).join("")}
    <div class="t-reihe"><span class="taste leer${naechst===" "?" naechst":""}">Leertaste</span></div></div>`;
}
function tippen({titel,punkte=15,merke,text,zeilen,zeigeTastatur=true,rennen}){return{titel,punkte,merke,zeige(el,ctx){
  const d=ctx.daten;d.z=d.z||0;d.p=d.p||0;d.f=d.f||0;
  const fertig=()=>d.z>=zeilen.length;
  const zeichne=(blitz)=>{
    if(fertig()){el.innerHTML=kopfText(text)+`<div class="msg ok">Alles abgetippt! Fehler: ${d.f}${d.zeit?` · Zeit: ${Math.round(d.zeit/1000)} Sek.`:""}. Tippe auf „Weiter“.</div>`;return}
    const z=zeilen[d.z],c=z[d.p];
    el.innerHTML=kopfText(text)+`<p class="eyebrow" style="margin-top:12px">Zeile ${d.z+1} von ${zeilen.length} · Fehler: ${d.f}${c&&FINGER[c.toLowerCase()]!=null?` · nimm den <b style="text-transform:none">${FINGER_NAME[FINGER[c.toLowerCase()]]}</b>`:""}</p>
      <div class="tippzeile${blitz?" blitz":""}">${[...z].map((x,i)=>`<span class="${i<d.p?"ok":i===d.p?"jetzt":""}">${x===" "?"␣":esc(x)}</span>`).join("")}</div>
      <p class="muted small">Einfach lostippen – die Seite hört zu. Kein Klick nötig.</p>
      ${zeigeTastatur?tastaturBild(c):""}${MLD}`;
  };
  const taste=e=>{
    if(fertig()||e.ctrlKey||e.altKey||e.metaKey||e.key.length!==1)return;
    if(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
    e.preventDefault();if(!d.start)d.start=Date.now();
    const z=zeilen[d.z];
    if(e.key===z[d.p]){d.p++;if(d.p>=z.length){d.z++;d.p=0;if(fertig()){d.zeit=Date.now()-d.start;
        const p=Math.max(Math.ceil(punkte/2),punkte-Math.floor(d.f/4));ctx.speichern();ctx.geschafft(p)}}zeichne()}
    else{d.f++;zeichne(true)}
    ctx.speichern();
  };
  document.addEventListener("keydown",taste);ctx.beimVerlassen(()=>document.removeEventListener("keydown",taste));
  zeichne();
  ctx.pruefer=()=>{if(fertig()){ctx.geschafft(Math.max(Math.ceil(punkte/2),punkte-Math.floor(d.f/4)));return true}meldung(el,false,"Tippe zuerst alle Zeilen ab.");return false};
  ctx.loesung=()=>{d.z=zeilen.length;d.zeit=d.zeit||1;zeichne()};
}}}

/* ---------- Touch-Parcours: Tippen, Doppeltippen, lange drücken, ziehen, wischen, zoomen ---------- */
const FINGER_AUF={tipp:{ico:"⭐",t:"<b>Tippe</b> einmal kurz auf den Stern ⭐"},

function touchParcours({titel,punkte=10,merke,text,aufgaben}){return{titel,punkte,merke,zeige(el,ctx){

      z.onpointermove=e=>{if(lauf&&Math.hypot(e.clientX-x0,e.clientY-y0)>14){lauf=false;clearTimeout(timer);z.classList.remove("drueckt");hinweis("Nicht schieben – lass den Finger <b>ganz ruhig</b> liegen.")}};

    if(a==="ziehen"){const korb=el.querySelector(".ziel");let ziehe=false;

    if(a==="wischen"){let x0=null,y0;
      z.onpointerdown=e=>{e.preventDefault();z.setPointerCapture(e.pointerId);x0=e.clientX;y0=e.clientY;z.style.transition="none"};
      z.onpointermove=e=>{if(x0==null)return;const dx=e.clientX-x0;z.style.transform=`translate(calc(-50% + ${dx}px),-50%) rotate(${dx/18}deg)`};
      z.onpointerup=z.onpointercancel=e=>{if(x0==null)return;const dx=e.clientX-x0,dy=e.clientY-y0;x0=null;z.style.transition="";
        if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)){z.style.transform=`translate(calc(-50% + ${dx>0?600:-600}px),-50%) rotate(${dx>0?30:-30}deg)`;setTimeout(gut,250)}
        else{z.style.transform="";hinweis("Wisch <b>weiter zur Seite</b> – mit Schwung nach links oder rechts!")}}}
    if(a==="zoom"){const finger=new Map();let d0=0;
      const abstand=()=>{const [p,q]=[...finger.values()];return Math.hypot(p.x-q.x,p.y-q.y)};
      ar.onpointerdown=e=>{e.preventDefault();finger.set(e.pointerId,{x:e.clientX,y:e.clientY});if(finger.size===2)d0=abstand()};

        if(finger.size===2&&d0>0){const f=Math.max(1,Math.min(3.2,abstand()/d0));z.style.transform=`translate(-50%,-50%) scale(${f})`;if(f>=2.2)gut()}};
      ar.onpointerup=ar.onpointercancel=e=>{const zwei=finger.size===2;finger.delete(e.pointerId);

  };
  zeichne();
  ctx.pruefer=()=>{if(d.n>=aufgaben.length){ctx.geschafft(punkte);return true}meldung(el,false,"Mach zuerst alle Aufgaben im Parcours.");return false};
  ctx.loesung=()=>{d.n=aufgaben.length;zeichne()};
}}}

/* ---------- Mal-Roboter: ein Programm Schritt für Schritt ausführen und das Ergebnis malen ----------
   malRoboter({titel,punkte,merke,text,w,h,programm:"R R M D M …"})  R/L/U/D = Schritt, M = Feld anmalen. Start oben links. */
const MALBEF={R:"➡️",L:"⬅️",U:"⬆️",D:"⬇️",M:"🖌️"};
/* Programm-Text: "R M D M" oder mit Wiederholung "3x(R M)" */
const malTeile=t=>{const out=[];const re=/(\d+)x\(([^)]*)\)|([RLUDM])/g;let m;while((m=re.exec(t))){if(m[3])out.push(m[3]);else out.push({w:+m[1],k:m[2].trim().split(/\s+/)})}return out};
const malFlach=t=>malTeile(t).flatMap(x=>typeof x==="string"?[x]:Array.from({length:x.w},()=>x.k).flat());
function malRoboter({titel,punkte=15,merke,text,w=6,h=6,programm}){return{titel,punkte,merke,zeige(el,ctx){
  const bef=malFlach(programm),soll=Array(w*h).fill(0);let x=0,y=0;
  bef.forEach(b=>{if(b==="R")x++;if(b==="L")x--;if(b==="U")y--;if(b==="D")y++;if(b==="M")soll[y*w+x]=1});
  const d=ctx.daten;
  const liste=malTeile(programm).map(t=>typeof t==="string"?`<li>${MALBEF[t]}</li>`:`<li class="loop"><span>🔁 ${t.w}×</span>${t.k.map(b=>MALBEF[b]).join("")}</li>`).join("");
  el.innerHTML=kopfText(text||"Du bist der Roboter! Er startet <b>oben links</b> 🤖. Führe das Programm Schritt für Schritt aus: ➡️⬅️⬆️⬇️ = ein Feld gehen, 🖌️ = das Feld anmalen, auf dem du gerade stehst.")+`
    <div class="paar" style="margin-top:12px"><div><p class="eyebrow">Programm</p><ol class="programm">${liste}</ol></div><div><p class="eyebrow">Dein Bild</p><div id="mr"></div></div></div>
    <div class="row" style="margin-top:12px"><button class="btn ghost" id="mrl">Alles löschen</button></div>${MLD}`;
  const r=pixelRaster({w,h,werte:d.bild,palette:["#FFFFFF","#1B1B1F"],malbar:true,onAenderung:v=>{d.bild=v.slice();ctx.speichern()}});
  r.el.classList.add("start-ol");el.querySelector("#mr").append(r.el);
  el.querySelector("#mrl").onclick=()=>{if(confirm("Wirklich alles löschen?"))r.setzeAlle(Array(w*h).fill(0))};
  ctx.pruefer=()=>{const fs=soll.map((v,k)=>r.werte[k]!==v?k:-1).filter(k=>k>=0);
    return bewerte(ctx,el,{leer:r.werte.every(v=>!v),leerText:"Mal zuerst, was der Roboter malt.",fehler:fs.length,stand:r.werte.join(""),punkte,okText:"Richtig. Du hast das Programm genau ausgeführt – wie ein Computer. 🤖",markiere:()=>r.markiere(fs)})};
  ctx.loesung=()=>r.setzeAlle(soll);
  if(ctx.geloest)schonGeloest(el);
}}}

/* ---------- Auswählen: alle passenden Karten antippen (Mehrfachauswahl) ----------
   auswaehlen({titel,punkte,merke,text,karten:[["Text/HTML",true,"warum"],…]}) */
function auswaehlen({titel,punkte=10,merke,text,karten,spalten}){return{titel,punkte,merke,zeige(el,ctx){
  const d=ctx.daten;d.an=d.an||[];if(!d.reihe){d.reihe=mischen(karten.map((_,i)=>i));ctx.speichern()}
  const n=karten.filter(k=>k[1]).length;let falsch=new Set();
  const zeichne=()=>{
    el.innerHTML=kopfText(text)+`<p class="eyebrow" style="margin-top:12px">Tippe alle passenden Karten an · ${n} sind richtig · ausgewählt: ${d.an.length}</p>
      <div class="wahlkarten"${spalten?` style="grid-template-columns:repeat(auto-fill,minmax(${spalten},1fr))"`:""}>${d.reihe.map(i=>`<button class="wkarte${d.an.includes(i)?" an":""}${falsch.has(i)?" falsch":""}" data-i="${i}">${karten[i][0]}</button>`).join("")}</div>${MLD}`;
    el.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,k=d.an.indexOf(i);if(k<0)d.an.push(i);else d.an.splice(k,1);falsch.clear();ctx.speichern();zeichne()});
  };
  zeichne();
  ctx.pruefer=()=>{const zuviel=d.an.filter(i=>!karten[i][1]),fehlt=karten.map((k,i)=>k[1]&&!d.an.includes(i)?i:-1).filter(i=>i>=0);
    const w=karten.filter(k=>k[1]&&k[2]);
    const r=bewerte(ctx,el,{leer:!d.an.length,leerText:"Tippe zuerst die passenden Karten an.",fehler:zuviel.length+fehlt.length,stand:d.an.slice().sort().join(),punkte,
      okText:`Richtig!${w.length?`<ul class="warum">${w.map(k=>`<li>${k[0]} – ${k[2]}</li>`).join("")}</ul>`:""}`,markiere:()=>{falsch=new Set(zuviel);zeichne()}});
    if(!r&&!zuviel.length&&fehlt.length)meldung(el,false,`Gut so weit! Es fehlen noch <b>${fehlt.length}</b>.`);
    return r};
  ctx.loesung=()=>{d.an=karten.map((k,i)=>k[1]?i:-1).filter(i=>i>=0);zeichne()};
  if(ctx.geloest)schonGeloest(el);
}}}

/* =====================================================================
   🤖 Robo-Labyrinth. Karte: # Wand, . Weg, S Start, Z Ziel ⭐, M Münze 🪙 (alle einsammeln)
   Programm-Text für Vorgabe/Lösung: "R R D 3x(R D) U"  (R rechts, L links, U hoch, D runter)
   ===================================================================== */
const RB={U:["↑",0,-1],D:["↓",0,1],L:["←",-1,0],R:["→",1,0]};
function roboParse(t){const out=[];const re=/(\d+)x\(([^)]*)\)|([UDLR])/g;let m;
  while((m=re.exec(t||""))){if(m[3])out.push({c:m[3]});else out.push({w:+m[1],k:m[2].trim().split(/\s+/).filter(Boolean).map(c=>({c}))})}return out}
const roboFlach=p=>p.flatMap(t=>t.w?Array.from({length:t.w},()=>t.k.map(x=>x.c)).flat():[t.c]);
const roboZahl=p=>p.reduce((a,t)=>a+(t.w?1+t.k.length:1),0);
function robo({titel,punkte=10,merke,text,karte,max,schleifen,vorgabe,loesung}){return{titel,punkte,merke,zeige(el,ctx){
  const H=karte.length,W=karte[0].length,feld=karte.map(r=>[...r]);
  let sx,sy;feld.forEach((r,y)=>r.forEach((c,x)=>{if(c==="S"){sx=x;sy=y}}));
  const muenzen=[];feld.forEach((r,y)=>r.forEach((c,x)=>{if(c==="M")muenzen.push(y*W+x)}));
  const d=ctx.daten;if(!d.prog){d.prog=roboParse(vorgabe);ctx.speichern()}
  let pos=[sx,sy],spur=[],gesammelt=new Set(),laeuft=null,crash=null,offen=d.offen??null;
  const simuliere=()=>{let x=sx,y=sy;const sp=[],ge=new Set();const fl=roboFlach(d.prog);
    for(let i=0;i<fl.length;i++){const [,dx,dy]=RB[fl[i]];const nx=x+dx,ny=y+dy;
      if(ny<0||ny>=H||nx<0||nx>=W||feld[ny][nx]==="#")return{ok:false,crash:[nx,ny],x,y,sp,ge,schritt:i};
      x=nx;y=ny;sp.push(y*W+x);if(feld[y][x]==="M")ge.add(y*W+x);
      if(feld[y][x]==="Z"&&ge.size===muenzen.length)return{ok:true,x,y,sp,ge,schritt:i}}
    return{ok:false,x,y,sp,ge,ende:true}};
  const zelle=(c,x,y)=>{const k=y*W+x,hier=pos[0]===x&&pos[1]===y;
    let inh=c==="#"?"":c==="Z"?"⭐":c==="M"&&!gesammelt.has(k)?"🪙":"";
    if(hier)inh=crash?"💥":"🤖";
    return`<span class="rz${c==="#"?" wand":""}${spur.includes(k)?" spur":""}${crash&&crash[0]===x&&crash[1]===y?" crash":""}">${inh}</span>`};
  const chips=()=>d.prog.map((t,i)=>t.w?`<span class="schleife${offen===i?" offen":""}"><span class="sk">🔁 <button data-wm="${i}">−</button><b>${t.w}×</b><button data-wp="${i}">+</button></span>${t.k.map((x,j)=>`<button class="bef" data-li="${i}" data-lj="${j}">${RB[x.c][0]}</button>`).join("")}${offen===i?`<button class="zu-btn" data-zu="${i}">✔ fertig</button>`:""}<button class="weg-btn" data-wl="${i}" title="Schleife löschen">✕</button></span>`
    :`<button class="bef" data-i="${i}" title="Löschen">${RB[t.c][0]}</button>`).join("");
  const zeichne=()=>{
    const n=roboZahl(d.prog);
    el.innerHTML=kopfText(text)+`<div class="robo">
      <div class="rfeld" style="grid-template-columns:repeat(${W},1fr)">${feld.map((r,y)=>r.map((c,x)=>zelle(c,x,y)).join("")).join("")}</div>
      <div class="rsteuer">
        <p class="eyebrow">Dein Programm · ${n} Befehle${max?` · höchstens ${max}`:""}${muenzen.length?` · sammle alle 🪙`:""}</p>
        <div class="rprog">${chips()||`<span class="muted">Noch leer – tippe unten auf die Pfeile.</span>`}</div>
        <div class="rknoepfe">${Object.entries(RB).map(([k,[i]])=>`<button class="btn ghost rk" data-add="${k}" ${laeuft?"disabled":""}>${i}</button>`).join("")}
          ${schleifen?`<button class="btn ghost rk breit" id="rloop" ${laeuft||offen!=null?"disabled":""}>Wiederhole …</button>`:""}</div>
        <div class="row"><button class="btn" id="rstart" ${laeuft?"disabled":""}>Start</button><button class="btn ghost" id="rleer" ${laeuft?"disabled":""}>Alles löschen</button></div>
        <p class="muted small">Tippe auf einen Befehl im Programm, um ihn zu löschen.</p>
      </div></div>${MLD}`;
    const neu=()=>{crash=null;pos=[sx,sy];spur=[];gesammelt=new Set();d.ok=false;ctx.speichern();zeichne()};
    el.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const c=b.dataset.add;if(offen!=null&&d.prog[offen])d.prog[offen].k.push({c});else d.prog.push({c});neu()});
    el.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{d.prog.splice(+b.dataset.i,1);if(offen!=null&&offen>=d.prog.length)offen=null;d.offen=offen;neu()});
    el.querySelectorAll("[data-li]").forEach(b=>b.onclick=()=>{d.prog[+b.dataset.li].k.splice(+b.dataset.lj,1);neu()});
    el.querySelectorAll("[data-wm]").forEach(b=>b.onclick=()=>{const t=d.prog[+b.dataset.wm];t.w=Math.max(2,t.w-1);neu()});
    el.querySelectorAll("[data-wp]").forEach(b=>b.onclick=()=>{const t=d.prog[+b.dataset.wp];t.w=Math.min(9,t.w+1);neu()});
    el.querySelectorAll("[data-wl]").forEach(b=>b.onclick=()=>{d.prog.splice(+b.dataset.wl,1);offen=null;d.offen=null;neu()});
    el.querySelectorAll("[data-zu]").forEach(b=>b.onclick=()=>{offen=null;d.offen=null;neu()});
    const lp=el.querySelector("#rloop");if(lp)lp.onclick=()=>{d.prog.push({w:2,k:[]});offen=d.prog.length-1;d.offen=offen;neu()};
    el.querySelector("#rleer").onclick=()=>{d.prog=[];offen=null;d.offen=null;neu()};
    el.querySelector("#rstart").onclick=()=>{if(!d.prog.length)return meldung(el,false,"Dein Programm ist noch leer. Tippe auf die Pfeile!");
      if(d.prog.some(t=>t.w&&!t.k.length))return meldung(el,false,"In deiner 🔁 Schleife steht noch nichts drin.");
      offen=null;d.offen=null;const r=simuliere(),fl=roboFlach(d.prog);let i=0;crash=null;pos=[sx,sy];spur=[];gesammelt=new Set();
      const bis=r.ok||r.ende?r.sp.length:r.schritt;
      laeuft=setInterval(()=>{
        if(i<bis){const k=r.sp[i];pos=[k%W,Math.floor(k/W)];spur.push(k);if(r.ge.has(k))gesammelt.add(k);i++;zeichne();return}
        clearInterval(laeuft);laeuft=null;
        if(!r.ok&&!r.ende){crash=r.crash;pos=[r.x,r.y];zeichne();d.fehlLauf=(d.fehlLauf||0)+1;if(d.fehlLauf%2===0)ctx.fehler();
          meldung(el,false,"💥 Bumm! Der Roboter ist gegen eine Wand gefahren. Finde den Fehler in deinem Programm und probier es noch mal.");return}
        zeichne();

          meldung(el,false,muenzen.length&&r.ge.size<muenzen.length&&feld[r.y][r.x]==="Z"?"Du bist am Ziel, aber es fehlen noch Münzen 🪙!":"Das Programm ist zu Ende, aber der Roboter ist noch nicht beim ⭐. Was fehlt noch?");return}

        d.ok=true;ctx.speichern();meldung(el,true,`⭐ Ziel erreicht! Super programmiert. Tippe auf „Weiter“.`)},300);

  };

  ctx.loesung=()=>{d.prog=roboParse(loesung);offen=null;d.offen=null;const r=simuliere();pos=[r.x,r.y];spur=r.sp;gesammelt=r.ge;d.ok=r.ok&&(!max||roboZahl(d.prog)<=max);if(!d.ok)console.warn("ROBO-LOESUNG FALSCH",titel);ctx.speichern();zeichne()};

/* =====================================================================
   🧠 KI-Zeichenerkennung: Das Kind malt, die „KI“ vergleicht mit gelernten Mustern und rät.
   ===================================================================== */
const KI_MUSTER={
  "❤️ Herz":["00000000","01100110","11111111","11111111","01111110","00111100","00011000","00000000"],
  "🏠 Haus":["00011000","00111100","01111110","11111111","01000010","01011010","01011010","01111110"],
  "🙂 Gesicht":["00111100","01000010","10100101","10000001","10100101","10011001","01000010","00111100"],
  "⬆️ Pfeil":["00011000","00111100","01111110","11111111","00011000","00011000","00011000","00011000"],
  "🌲 Baum":["00011000","00111100","01111110","00111100","01111110","11111111","00011000","00011000"],
  "➕ Plus":["00011000","00011000","00011000","11111111","11111111","00011000","00011000","00011000"],
};
function kiRaten(werte){
  /* Vergleich mit jedem gelernten Muster, auch um 1 Kästchen verschoben (Jaccard: gemeinsame / alle schwarzen Kästchen) */
  const t=Object.entries(KI_MUSTER).map(([n,m])=>{let best=0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){let schnitt=0,verein=0;
      for(let y=0;y<8;y++)for(let x=0;x<8;x++){const sx=x-dx,sy=y-dy;const v=sx>=0&&sx<8&&sy>=0&&sy<8?+m[sy][sx]:0,w=werte[y*8+x]?1:0;
        if(v&&w)schnitt++;if(v||w)verein++}
      if(verein)best=Math.max(best,schnitt/verein)}
    return[n,best]});
  return t.sort((a,b)=>b[1]-a[1])}
function kiZeichnen({titel,punkte=15,merke,text,ziel=3}){return{titel,punkte,merke,zeige(el,ctx){

      if(d.erkannt.length>=ziel){meldung(el,true,`🎉 Die KI hat ${ziel} verschiedene Bilder erkannt! Tippe auf „Weiter“.`);ctx.geschafft(punkte)}}
    el.querySelector("#ke").innerHTML=d.erkannt.map(n=>`<span class="chip good">${n}</span>`).join(" ")||`<span class="muted">noch nichts</span>`};

  ctx.loesung=()=>{d.erkannt=Object.keys(KI_MUSTER).slice(0,ziel);r.setzeAlle(KI_MUSTER["❤️ Herz"].join("").split("").map(Number))};
}}}

/* =====================================================================
   🔐 Passwort-Tester: Stärke, Knackzeit, Hacker-Wörterbuch. Das Passwort wird NIE gespeichert.
   ===================================================================== */
const OFT=["123456","1234567","12345678","123456789","passwort","password","hallo","hallo123","qwertz","qwerty","111111","000000","abc123","schatz","fussball","fußball","ficken","iloveyou","lol123","gaming","minecraft","fortnite","pokemon","master","hallo1","admin","geheim"];
function knackzeit(pw){if(!pw)return[0,"–"];if(OFT.includes(pw.toLowerCase()))return[0,"sofort! (steht in der Hacker-Liste)"];
  let n=0;if(/[a-zäöüß]/.test(pw))n+=30;if(/[A-ZÄÖÜ]/.test(pw))n+=29;if(/\d/.test(pw))n+=10;if(/[^a-zA-ZäöüÄÖÜß0-9]/.test(pw))n+=33;
  const sek=Math.pow(n,pw.length)/2e10;
  const t=sek<1?"unter 1 Sekunde":sek<60?Math.round(sek)+" Sekunden":sek<3600?Math.round(sek/60)+" Minuten":sek<86400?Math.round(sek/3600)+" Stunden":sek<3.15e7?Math.round(sek/86400)+" Tage":sek<3.15e10?Math.round(sek/3.15e7).toLocaleString("de-DE")+" Jahre":"über 1000 Jahre";
  return[sek,t]}
const PW_REGELN=[["Mindestens 10 Zeichen",p=>p.length>=10],["Großbuchstaben (A–Z)",p=>/[A-ZÄÖÜ]/.test(p)],["Kleinbuchstaben (a–z)",p=>/[a-zäöüß]/.test(p)],["Zahlen (0–9)",p=>/\d/.test(p)],["Sonderzeichen (! ? # …)",p=>/[^a-zA-ZäöüÄÖÜß0-9]/.test(p)],["Kein bekanntes Passwort",p=>p&&!OFT.includes(p.toLowerCase())]];
function passwortTester({titel,punkte=15,merke,text,regeln=6}){return{titel,punkte,merke,zeige(el,ctx){
  const d=ctx.daten;
  el.innerHTML=kopfText(text)+`<div class="msg no" style="margin:12px 0">⚠️ Tippe hier <b>nicht</b> dein echtes Passwort ein! Erfinde ein neues zum Üben.</div>
    <div class="eing pw"><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Passwort zum Testen"></div>
    <div class="pwmeter"><i></i></div><p class="pwzeit"></p><ul class="pwregeln"></ul>${MLD}`;
  const inp=el.querySelector("input"),mt=el.querySelector(".pwmeter i");
  const pruef=()=>{const p=inp.value,ok=PW_REGELN.map(([,f])=>f(p)),n=ok.filter(Boolean).length,[sek,t]=knackzeit(p);
    mt.style.width=Math.min(100,Math.round(n/6*100))+"%";mt.style.background=n>=6?"var(--good)":n>=4?"#F5C518":"var(--bad)";
    el.querySelector(".pwzeit").innerHTML=p?`🤖 Ein Hacker-Computer bräuchte zum Knacken: <b>${t}</b>`:"";
    el.querySelector(".pwregeln").innerHTML=PW_REGELN.map(([r],i)=>`<li class="${ok[i]?"ok":""}">${ok[i]?"✅":"⬜"} ${r}</li>`).join("");
    return n>=regeln};
  inp.oninput=pruef;pruef();
  ctx.pruefer=()=>{if(d.ok||pruef()){d.ok=true;ctx.speichern();meldung(el,true,"🛡️ Super! Dieses Passwort ist richtig stark.");ctx.geschafft(punkte);return true}
    meldung(el,false,"Dein Passwort erfüllt noch nicht alle Regeln. Schau in die Liste!");return false};
  ctx.loesung=()=>{inp.value="Mein!Hund7Bello";pruef()};
  if(ctx.geloest)schonGeloest(el);
}}}

/* =====================================================================
   🔢 Zahl raten (Binäre Suche): Der Computer denkt sich eine Zahl, das Kind rät, Hinweis größer/kleiner.
   ===================================================================== */
function zahlRaten({titel,punkte=15,merke,text,bis=100,max=7}){return{titel,punkte,merke,zeige(el,ctx){
  const d=ctx.daten;const neu=()=>{d.geheim=1+Math.floor(Math.random()*bis);d.tipps=[];d.lo=1;d.hi=bis;ctx.speichern()};
  if(!d.geheim)neu();d.runden=d.runden||0;
  const zeichne=()=>{const gef=d.tipps.includes(d.geheim);
    const pos=v=>((v-1)/(bis-1)*100).toFixed(2);
    el.innerHTML=kopfText(text)+`<div class="raten">
      <p class="eyebrow">Der Computer denkt sich eine Zahl von 1 bis ${bis} · Versuche: ${d.tipps.length}${d.best?` · dein Rekord: ${d.best}`:""}</p>
      <div class="zstrahl"><div class="zbereich" style="left:${pos(d.lo)}%;width:${Math.max(1,pos(d.hi)-pos(d.lo))}%"></div>
        ${d.tipps.map(t=>`<span class="ztipp${t===d.geheim?" ok":""}" style="left:${pos(t)}%">${t}</span>`).join("")}
        <span class="zende l">1</span><span class="zende r">${bis}</span></div>
      <p class="muted small">Grün = da kann die Zahl noch sein: <b>${d.lo} bis ${d.hi}</b></p>
      ${gef?`<div class="msg ${d.tipps.length<=max?"ok":"no"}">${d.tipps.length<=max?`🎉 Gefunden in <b>${d.tipps.length}</b> Versuchen! Super Strategie.`:`Gefunden! Aber mit ${d.tipps.length} Versuchen. Schaffst du es in höchstens <b>${max}</b>? Tipp: Rate immer genau die <b>Mitte</b> vom grünen Bereich.`}</div>
        <div class="row" style="margin-top:12px"><button class="btn ghost" id="nochmal">Neue Zahl</button></div>`
      :`<div class="row raten-ein"><input type="text" inputmode="numeric" autocomplete="off" placeholder="Deine Zahl" maxlength="3"><button class="btn" id="raten">Raten</button></div>`}
    </div>${MLD}`;
    if(gef){el.querySelector("#nochmal").onclick=()=>{neu();zeichne()};return}
    const inp=el.querySelector("input"),los=()=>{const v=parseInt(inp.value,10);
      if(!(v>=1&&v<=bis))return meldung(el,false,`Tippe eine Zahl von 1 bis ${bis}.`);
      d.tipps.push(v);if(v<d.geheim)d.lo=Math.max(d.lo,v+1);if(v>d.geheim)d.hi=Math.min(d.hi,v-1);
      if(v===d.geheim){d.lo=d.hi=v;d.runden++;if(!d.best||d.tipps.length<d.best)d.best=d.tipps.length;if(d.tipps.length<=max)d.ok=true}
      ctx.speichern();zeichne();
      if(v!==d.geheim){meldung(el,null,v<d.geheim?`⬆️ <b>${v}</b> ist zu klein. Die Zahl ist größer.`:`⬇️ <b>${v}</b> ist zu groß. Die Zahl ist kleiner.`);el.querySelector("input").focus()}
      else if(d.ok)ctx.geschafft(punkte)};
    el.querySelector("#raten").onclick=los;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();los()}};
    setTimeout(()=>inp.focus(),50);
  };
  zeichne();
  ctx.pruefer=()=>{if(d.ok){ctx.geschafft(punkte);return true}meldung(el,false,`Finde die Zahl in höchstens ${max} Versuchen.`);return false};
  ctx.loesung=()=>{d.tipps=[];let lo=1,hi=bis;while(true){const m=Math.floor((lo+hi)/2);d.tipps.push(m);if(m===d.geheim)break;if(m<d.geheim)lo=m+1;else hi=m-1}d.lo=d.hi=d.geheim;d.ok=true;zeichne()};
}}}

/* =====================================================================
   ⚖️ Waage: Kisten mit verstecktem Gewicht. Immer zwei vergleichen, dann von leicht nach schwer ordnen.
   ===================================================================== */
const KISTEN=["🟥","🟧","🟨","🟩","🟦","🟪","🟫","⬛"];
function waage({titel,punkte=15,merke,text,n=5,ziel}){return{titel,punkte,merke,zeige(el,ctx){
  const d=ctx.daten;if(!d.w){d.w=mischen(Array.from({length:n},(_,i)=>i+1));d.log=[];d.gew=[];ctx.speichern()}
  let wahl=[],falsch=false;
  const zeichne=()=>{const [a,b]=d.letzt||[];
    const kipp=d.letzt?(d.w[a]>d.w[b]?"links":"rechts"):"";
    el.innerHTML=kopfText(text)+`<div class="waage-box">
      <div class="waage ${kipp}"><div class="balken-w"><div class="schale">${d.letzt?KISTEN[a]:""}</div><div class="schale">${d.letzt?KISTEN[b]:""}</div></div><div class="fuss">▲</div></div>
      <p class="eyebrow">Tippe zwei Kisten an, um sie zu wiegen · gewogen: ${d.log.length}-mal${ziel?` · Profis schaffen es mit ${ziel}`:""}</p>
      <div class="kisten">${d.w.map((_,i)=>`<button class="kiste${wahl.includes(i)?" an":""}${d.gew.includes(i)?" weg":""}" data-k="${i}">${KISTEN[i]}</button>`).join("")}</div>
      ${d.log.length?`<p class="eyebrow" style="margin-top:12px">Das weißt du schon</p><div class="wlog">${d.log.map(([x,y])=>`<span>${KISTEN[x]} ${d.w[x]>d.w[y]?"ist schwerer als":"ist leichter als"} ${KISTEN[y]}</span>`).join("")}</div>`:""}
      <p class="eyebrow" style="margin-top:14px">Deine Reihenfolge: leicht → schwer <span class="muted">(tippe unten die Kisten der Reihe nach an)</span></p>
      <div class="reihe-w${falsch?" falsch":""}">${d.gew.map((i,k)=>`<button class="kiste klein" data-g="${k}" title="Zurücklegen">${KISTEN[i]}</button>`).join("<i>‹</i>")}${d.gew.length<n?`<span class="muted">… noch ${n-d.gew.length}</span>`:""}</div>
      <div class="karten" style="margin-top:8px">${d.w.map((_,i)=>d.gew.includes(i)?"":`<button class="karte" data-r="${i}">${KISTEN[i]} einordnen</button>`).join("")}</div>
    </div>${MLD}`;
    el.querySelectorAll("[data-k]").forEach(x=>x.onclick=()=>{const i=+x.dataset.k;if(wahl.includes(i))wahl=wahl.filter(j=>j!==i);else wahl.push(i);
      if(wahl.length===2){d.letzt=wahl.slice();d.log.push(wahl.slice());wahl=[];ctx.speichern()}zeichne()});
    el.querySelectorAll("[data-r]").forEach(x=>x.onclick=()=>{d.gew.push(+x.dataset.r);falsch=false;ctx.speichern();zeichne()});
    el.querySelectorAll("[data-g]").forEach(x=>x.onclick=()=>{d.gew.splice(+x.dataset.g,1);falsch=false;ctx.speichern();zeichne()});
  };
  zeichne();
  ctx.pruefer=()=>{const ok=d.gew.every((i,k)=>k===0||d.w[d.gew[k-1]]<d.w[i]);
    const r=bewerte(ctx,el,{leer:d.gew.length<n,leerText:"Ordne zuerst alle Kisten ein (unten).",fehler:ok?0:1,stand:d.gew.join(),punkte,
      okText:`Richtig sortiert! Du hast ${d.log.length}-mal gewogen. ⚖️`});
    if(!r&&d.gew.length===n){falsch=true;const l=el.querySelector(".mld").innerHTML;zeichne();meldung(el,false,l+" Wiege noch ein paar Kisten nach!")}return r};
  ctx.loesung=()=>{d.gew=d.w.map((_,i)=>i).sort((a,b)=>d.w[a]-d.w[b]);zeichne()};
  if(ctx.geloest)schonGeloest(el);
}}}

/* ---------- ⇄ Tausch-Sortieren: Nur Nachbarn tauschen (wie Bubblesort) ---------- */
function tauschSortieren({titel,punkte=15,merke,text,zahlen:start}){return{titel,punkte,merke,zeige(el,ctx){
  const d=ctx.daten;d.z=d.z||start.slice();d.t=d.t||0;
  const fehlst=a=>{let n=0;for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)if(a[i]>a[j])n++;return n};
  const best=fehlst(start);
  const zeichne=()=>{const fertig=fehlst(d.z)===0;
    el.innerHTML=kopfText(text)+`<p class="eyebrow" style="margin-top:12px">Getauscht: ${d.t}-mal${fertig?"":" · Ziel: von klein nach groß"}</p>
      <div class="tausch">${d.z.map((v,i)=>`${i?`<button class="tbtn" data-t="${i-1}" ${fertig?"disabled":""} title="Tauschen">⇄</button>`:""}<span class="tkarte${fertig?" ok":""}">${v}</span>`).join("")}</div>
      ${fertig?`<div class="msg ok">Sortiert mit ${d.t} Tauschen${d.t===best?" – kürzer geht es nicht! 🏆":""}. Tippe auf „Weiter“.</div>`:""}
      <div class="row" style="margin-top:12px"><button class="btn ghost" id="treset">Von vorn</button></div>${MLD}`;
    el.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const i=+b.dataset.t;[d.z[i],d.z[i+1]]=[d.z[i+1],d.z[i]];d.t++;ctx.speichern();zeichne();
      if(fehlst(d.z)===0)ctx.geschafft(punkte)});
    el.querySelector("#treset").onclick=()=>{d.z=start.slice();d.t=0;ctx.speichern();zeichne()};
  };
  zeichne();
  ctx.pruefer=()=>{if(fehlst(d.z)===0){ctx.geschafft(punkte);return true}meldung(el,false,"Sortiere zuerst alle Zahlen von klein nach groß.");return false};
  ctx.loesung=()=>{d.z=start.slice().sort((a,b)=>a-b);d.t=best;zeichne()};
}}}

/* =====================================================================
   🧠 KI-Trainer: Beispiele beschriften, die KI lernt (ähnlichstes Beispiel) und testet an neuen Dingen.
   kiTrainer({titel,punkte,merke,text,klassen:[["o","Obst","🍎"],…],merkmale:[["süß","🍬"],…],
              beispiele:[{ico,name,f:[1,0,…],ist:"o",label:"g"}],tests:[{ico,name,f,ist}]})
   ===================================================================== */
function kiTrainer({titel,punkte=20,merke,text,klassen,merkmale,beispiele,tests}){return{titel,punkte,merke,zeige(el,ctx){
  const d=ctx.daten;if(!d.lab){d.lab=beispiele.map(b=>b.label||b.ist);ctx.speichern()}
  const kl=id=>klassen.find(k=>k[0]===id);
  const abst=(a,b)=>a.reduce((s,v,i)=>s+(v!==b[i]?1:0),0);
  const rate=t=>{let best=null,bd=1e9;beispiele.forEach((b,i)=>{const x=abst(t.f,b.f);if(x<bd){bd=x;best=i}});return{i:best,lab:d.lab[best]}};
  const chips=f=>merkmale.map(([n,ico],i)=>f[i]?`<span class="mm" title="${n}">${ico}</span>`:"").join("");
  const zeichne=()=>{
    el.innerHTML=kopfText(text)+`<p class="muted small" style="margin-top:10px">Merkmale: ${merkmale.map(([n,ico])=>`${ico} ${n}`).join(" · ")}</p>
      <p class="eyebrow" style="margin-top:10px">Trainings-Beispiele · tippe an, um die Beschriftung zu ändern</p>
      <div class="kibsp">${beispiele.map((b,i)=>{const k=kl(d.lab[i]);return`<button class="kib k-${d.lab[i]}" data-b="${i}"><span class="kico2">${b.ico}</span><b>${b.name}</b><span class="mms">${chips(b.f)}</span><span class="chip">${k[2]} ${k[1]}</span></button>`}).join("")}</div>
      <div class="row" style="margin-top:12px"><button class="btn" id="kitest">KI lernen lassen und testen</button></div>
      ${d.test?`<p class="eyebrow" style="margin-top:14px">Test mit neuen Dingen, die die KI noch nie gesehen hat</p>
        <div class="kitests">${tests.map(t=>{const r=rate(t),ok=r.lab===t.ist,k=kl(r.lab),b=beispiele[r.i];
          return`<div class="kit ${ok?"ok":"no"}"><span class="kico2">${t.ico}</span><div><b>${t.name}</b> <span class="mms">${chips(t.f)}</span><br><span class="small">KI sagt: <b>${k[2]} ${k[1]}</b> ${ok?"✅":"❌"}<br><span class="muted">weil es so ähnlich ist wie ${b.ico} ${b.name}</span></span></div></div>`}).join("")}</div>`:""}${MLD}`;
    el.querySelectorAll("[data-b]").forEach(x=>x.onclick=()=>{const i=+x.dataset.b,k=klassen.findIndex(c=>c[0]===d.lab[i]);d.lab[i]=klassen[(k+1)%klassen.length][0];d.test=false;ctx.speichern();zeichne()});
    el.querySelector("#kitest").onclick=()=>{d.test=true;const falsch=tests.filter(t=>rate(t).lab!==t.ist).length;ctx.speichern();zeichne();
      if(!falsch){d.ok=true;ctx.speichern();meldung(el,true,"🎉 Die KI erkennt jetzt alles richtig! Tippe auf „Weiter“.")}
      else{d.fl=(d.fl||0)+1;if(d.fl%2===0)ctx.fehler();
        meldung(el,false,`Die KI liegt ${falsch}-mal falsch. Schau dir die Trainings-Beispiele genau an: Ist eins falsch beschriftet? Dann lernt die KI etwas Falsches!`)}};
  };
  zeichne();
  ctx.pruefer=()=>{if(d.ok){ctx.geschafft(punkte);return true}meldung(el,false,d.test?"Die KI macht noch Fehler. Verbessere die Beispiele und teste noch mal.":"Tippe zuerst auf „KI lernen lassen und testen“.");return false};
  ctx.loesung=()=>{d.lab=beispiele.map(b=>b.ist);d.test=true;d.ok=true;zeichne()};
}}}

/* ---------- 🔓 PIN-Knacker: Wie schnell probiert ein Computer alle Zahlen durch? (Die PIN wird nicht gespeichert) ---------- */
function pinKnacker({titel,punkte=5,merke,text}){return{titel,punkte,merke,zeige(el,ctx){
  const d=ctx.daten;let lauf=null;
  el.innerHTML=kopfText(text)+`<div class="row raten-ein" style="margin-top:12px"><input type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4 Ziffern, z. B. 2580"><button class="btn" id="hack">Hacker starten</button></div>
    <div class="hacker"><div class="hzahl">0000</div><div class="small" id="hinfo">Der Computer probiert einfach alle Zahlen durch: 0000, 0001, 0002 …</div></div>${MLD}`;
  const inp=el.querySelector("input"),z=el.querySelector(".hzahl");
  inp.oninput=()=>{inp.value=inp.value.replace(/\D/g,"").slice(0,4)};
  el.querySelector("#hack").onclick=()=>{const pin=inp.value;if(pin.length!==4)return meldung(el,false,"Tippe eine ausgedachte PIN mit 4 Ziffern ein.");
    clearInterval(lauf);const ziel=+pin;let i=0;const schritt=Math.max(7,Math.ceil(ziel/60));
    lauf=setInterval(()=>{i=Math.min(ziel,i+schritt);z.textContent=String(i).padStart(4,"0");
      if(i>=ziel){clearInterval(lauf);z.classList.add("geknackt");
        el.querySelector("#hinfo").innerHTML=`Geknackt nach <b>${(ziel+1).toLocaleString("de-DE")}</b> Versuchen! Ein echter Computer braucht dafür weniger als <b>1 Tausendstel Sekunde</b>.`;
        d.ok=true;ctx.speichern();meldung(el,true,"Eine 4-stellige PIN hat nur 10.000 Möglichkeiten. Ein Passwort mit 12 Zeichen hat mehr Möglichkeiten, als es Sandkörner auf der Erde gibt!");ctx.geschafft(punkte)}},30)};
  ctx.beimVerlassen(()=>clearInterval(lauf));
  ctx.pruefer=()=>{if(d.ok){ctx.geschafft(punkte);return true}meldung(el,false,"Probier den Hacker-Computer zuerst einmal aus.");return false};
  ctx.loesung=()=>{inp.value="2580";el.querySelector("#hack").click()};
  if(ctx.geloest)schonGeloest(el);
}}}

/* Station: Pixel-Werkstatt (KLP Inhaltsfeld „Information und Daten“):
   Daten vs. Information, binär decodieren und codieren, Farbcodes, Daten verkleinern (Lauflänge),
   Fehler finden (Prüfbit-Zaubertrick), eigenes Bild mit Code-Ansicht. Ca. 60 Minuten. */
(()=>{
const SW=["#FFFFFF","#1B1B1F"];
const PAL=["#FFFFFF","#1B1B1F","#E5383B","#2DA44E","#F5C518","#2F6FDE","#8B5A2B","#F28CB8","#F08A24","#8E5BD6"];
const NAMEN=["Weiß","Schwarz","Rot","Grün","Gelb","Blau","Braun","Rosa","Orange","Lila"];
const zahlen=z=>z.join("").split("").map(Number);

const BILDER={
  pfeil:["00011000","00111100","01111110","11111111","00011000","00011000","00011000","00011000"],
  boot:["00010000","00011000","00011100","00011110","00010000","11111111","01111110","00111100"],
  alien:["00100100","00011000","00111100","01011010","11111111","10111101","10100101","00100100"],
  herz:["00000000","01100110","11111111","11111111","01111110","00111100","00011000","00000000"],
  smiley:["00111100","01000010","10100101","10000001","10100101","10011001","01000010","00111100"],
  haus:["00011000","00111100","01111110","11111111","01000010","01011010","01011010","01111110"],
  apfel:["00003200","00003000","01111110","11111111","11111111","11111111","01111110","00111100"],
  sonne:["00111100","01111110","01111110","00111100","00000000","22222222","22222222","22222222"],
  tanne:["00011000","00111100","01111110","00111100","01111110","11111111","00011000","00011000"],
  pilz:["00111100","01111110","11111111","00011000","00011000","00111100"],
  herz5:["01010","11111","11111","01110","00100"],
  pfeil:["00011000","00111100","01111110","11111111","00011000","00011000","00011000","00011000"],
};
/* Farbcodes: In jedem Bild gilt ein eigener Schlüssel (1, 2, 3 …). 0 ist immer weiß. */
const SCHLUESSEL={
  apfel:[["Rot","#E5383B"],["Grün","#2DA44E"],["Braun","#8B5A2B"]],
  sonne:[["Gelb","#F5C518"],["Blau","#2F6FDE"]],
};

/* Wird beim Tippen auf „Weiter“ aufgerufen. true = richtig. Ab dem 3. Fehlversuch werden falsche Kästchen rot umrandet. */
function pruefen(ctx,raster,soll,punkte,box){
  if(raster.werte.every(x=>x===0)){box.className="msg no";box.textContent="Mal zuerst das Bild, dann tippe auf „Weiter“.";return false} // aus Versehen getippt: kein Abzug
  const stand=raster.werte.join("");
  const falsch=[];soll.forEach((x,k)=>{if(raster.werte[k]!==x)falsch.push(k)});
  if(falsch.length&&stand===ctx.daten.letzterFehler){box.className="msg no";box.textContent=`Du hast noch nichts geändert. Noch ${falsch.length===1?"1 Kästchen ist":falsch.length+" Kästchen sind"} falsch.`;return false}
  ctx.daten.versuche=(ctx.daten.versuche||0)+1;ctx.speichern();
  if(!falsch.length){raster.markiere([]);box.className="msg ok";box.textContent="Richtig! Alle Kästchen stimmen.";ctx.geschafft(punkte);return true}
  ctx.fehler();ctx.daten.letzterFehler=stand;ctx.speichern();
  box.className="msg no";
  box.textContent=falsch.length===1?"Fast! Noch 1 Kästchen ist falsch.":`Noch ${falsch.length} Kästchen sind falsch.`;
  if(ctx.daten.versuche>=3){raster.markiere(falsch);box.textContent+=" Sie sind jetzt rot umrandet."}
  box.scrollIntoView({block:"nearest",behavior:"smooth"});
  return false;
}

function abmalen(name,titel,punkte,merke){return{titel,punkte,merke,zeige(el,ctx){
  const soll=zahlen(BILDER[name]);
  el.innerHTML=`<p>Mal das Bild links genau ab. Tippe auf ein Kästchen, dann wird es schwarz. Nochmal tippen macht es wieder weiß. Du kannst auch ziehen.</p>
    <div class="paar"><div><p class="eyebrow">Vorlage</p><div id="a"></div></div><div><p class="eyebrow">Dein Bild</p><div id="b"></div></div></div>
    <div class="row noprint" style="margin-top:14px"><button class="btn ghost" id="l">Alles löschen</button><span class="muted small">Fertig? Tippe unten auf „Weiter“ – dann wird geprüft.</span></div><div id="m"></div>`;
  el.querySelector("#a").append(pixelRaster({w:8,h:8,werte:soll,palette:SW}).el);
  const r=pixelRaster({w:8,h:8,werte:ctx.daten.bild,palette:SW,malbar:true,onAenderung:v=>{ctx.daten.bild=v.slice();ctx.speichern()}});
  el.querySelector("#b").append(r.el);

  el.querySelector("#l").onclick=()=>{if(confirm("Wirklich alles löschen?"))r.setzeAlle(Array(64).fill(0))};
  if(ctx.geloest){const m=el.querySelector("#m");m.className="msg ok";m.textContent="Schon gelöst. Weiter geht's!"}
}}}

function codeBild(name,titel,punkte,farbig,merke){return{titel,punkte,merke,zeige(el,ctx){
  const roh=BILDER[name],soll=zahlen(roh);
  const key=farbig?SCHLUESSEL[name]:null;
  const pal=farbig?["#FFFFFF",...key.map(x=>x[1])]:SW;
  const ziffer=c=>farbig&&c!=="0"?`<span class="z" style="--c:${pal[+c]}">${c}</span>`:`<span>${c}</span>`;
  el.innerHTML=(farbig
    ?`<div class="regel"><b>Neue Regel:</b> Jetzt ist jede Zahl eine <b>Farbe</b>. Schau in den Schlüssel: Welche Zahl ist welche Farbe?</div>
      <p class="eyebrow" style="margin-top:12px">Schlüssel – tippe auf eine Farbe, dann auf die Kästchen</p><div class="schluessel" id="key">${key.map(([n,c],k)=>`<button data-f="${k+1}" style="--c:${c}"><b>${k+1}</b><span class="sw"></span>${n}</button>`).join("")}<button data-f="0" class="rad" style="--c:#fff"><b>0</b><span class="sw"></span>Weiß 🧽</button></div>`
    :`<p>Das ist ein Geheimcode. <b>1</b> heißt schwarz, <b>0</b> heißt weiß. Mal jede Zeile so, wie der Code es sagt. Was kommt heraus?</p>`)+
    `<div class="paar"><div><p class="eyebrow">Code</p><ol class="code">${roh.map(z=>`<li>${z.split("").map(ziffer).join("")}</li>`).join("")}</ol></div>
    <div><p class="eyebrow">Dein Bild</p><div id="b"></div></div></div>
    <div class="row noprint" style="margin-top:14px"><button class="btn ghost" id="l">Alles löschen</button><span class="muted small">Fertig? Tippe unten auf „Weiter“ – dann wird geprüft.</span></div><div id="m"></div>`;
  let wahl=1;
  if(farbig){const knoepfe=el.querySelectorAll("#key button");
    const setze=f=>{wahl=f;knoepfe.forEach(b=>b.classList.toggle("an",+b.dataset.f===f))};
    knoepfe.forEach(b=>b.onclick=()=>setze(+b.dataset.f));setze(1)}
  const r=pixelRaster({w:8,h:8,werte:ctx.daten.bild,palette:pal,malbar:true,farbe:()=>wahl,onAenderung:v=>{ctx.daten.bild=v.slice();ctx.speichern()}});
  el.querySelector("#b").append(r.el);
  const zeilen=el.querySelectorAll(".code li");
  const leuchte=z=>zeilen.forEach((li,k)=>li.classList.toggle("an",k===z));
  r.el.addEventListener("pointerover",e=>{const k=e.target.dataset?.k;if(k!=null)leuchte(Math.floor(k/8))});
  r.el.addEventListener("pointermove",e=>{const t=document.elementFromPoint(e.clientX,e.clientY);if(t&&t.dataset?.k!=null&&t.parentNode===r.el)leuchte(Math.floor(t.dataset.k/8))});
  r.el.addEventListener("pointerleave",()=>leuchte(-1));
  ctx.pruefer=()=>pruefen(ctx,r,soll,punkte,el.querySelector("#m"));
  ctx.loesung=()=>r.setzeAlle(soll);
  el.querySelector("#l").onclick=()=>{if(confirm("Wirklich alles löschen?"))r.setzeAlle(Array(64).fill(0))};
  if(ctx.geloest){const m=el.querySelector("#m");m.className="msg ok";m.textContent="Schon gelöst. Weiter geht's!"}
}}}

/* ---------- Codieren: Das Kind schreibt selbst den Code zu einem Bild (0/1-Knöpfe antippen) ---------- */
function codieren(name,titel,punkte,merke){return{titel,punkte,merke,zeige(el,ctx){
  const roh=BILDER[name],soll=zahlen(roh),h=roh.length;
  const code=ctx.daten.code||(ctx.daten.code=Array(8*h).fill(0));
  el.innerHTML=`<div class="regel"><b>Jetzt andersrum!</b> Du siehst das Bild und schreibst den Code. Tippe auf eine Zahl, dann wird aus 0 eine 1. Schwarz = 1, weiß = 0.</div>
    <div class="paar" style="margin-top:12px"><div><p class="eyebrow">Bild</p><div id="a"></div></div>
    <div><p class="eyebrow">Dein Code</p><div class="tipp-code" id="c">${roh.map((_,z)=>`<div class="tz">${Array.from({length:8},(_,s)=>`<button data-i="${z*8+s}">${code[z*8+s]}</button>`).join("")}</div>`).join("")}</div></div></div>
    <div id="m"></div>`;
  el.querySelector("#a").append(pixelRaster({w:8,h,werte:soll,palette:SW}).el);
  const knoepfe=[...el.querySelectorAll("#c button")];
  const zeig=()=>knoepfe.forEach((b,k)=>{b.textContent=code[k];b.classList.toggle("eins",code[k]===1)});zeig();
  knoepfe.forEach(b=>b.onclick=()=>{const k=+b.dataset.i;code[k]=code[k]?0:1;b.classList.remove("falsch");zeig();ctx.speichern()});
  ctx.pruefer=()=>{const m=el.querySelector("#m");
    if(code.every(x=>x===0)){m.className="msg no";m.textContent="Tippe zuerst die Zahlen an, dann auf „Weiter“.";return false}
    const falsch=[];soll.forEach((x,k)=>{if(code[k]!==x)falsch.push(k)});
    if(!falsch.length){m.className="msg ok";m.textContent="Richtig! Du hast das Bild codiert – wie ein Computer.";ctx.geschafft(punkte);return true}
    const stand=code.join("");if(stand!==ctx.daten.letzterFehler){ctx.fehler();ctx.daten.letzterFehler=stand;ctx.daten.versuche=(ctx.daten.versuche||0)+1;ctx.speichern()}
    m.className="msg no";m.textContent=falsch.length===1?"Fast! Noch 1 Zahl ist falsch.":`Noch ${falsch.length} Zahlen sind falsch.`;
    if((ctx.daten.versuche||0)>=3){knoepfe.forEach((b,k)=>b.classList.toggle("falsch",falsch.includes(k)));m.textContent+=" Sie sind jetzt rot."}
    return false};
  ctx.loesung=()=>{soll.forEach((x,k)=>code[k]=x);zeig()};
  if(ctx.geloest){const m=el.querySelector("#m");m.className="msg ok";m.textContent="Schon gelöst. Weiter geht's!"}
}}}

/* ---------- Kurzschrift: lange Codes kürzer schreiben (immer: erst weiß, dann schwarz, dann weiß …) ---------- */

const laeufe=z=>{const r=[];for(const c of z){if(r.length&&r[r.length-1].c===c)r[r.length-1].n++;else r.push({c,n:1})}return r};
const SQ_W=`<i class="sq"></i>`,SQ_S=`<i class="sq s"></i>`;
const kurzText=z=>laeufe(z).map(l=>`<span class="lauf"><b>${l.n}</b>${l.c==="1"?SQ_S:SQ_W}</span>`).join("");

  r.el.addEventListener("pointerleave",()=>leuchte(-1));
  ctx.pruefer=()=>pruefen(ctx,r,soll,punkte,el.querySelector("#m"));

function kurzSchreiben(name,titel,punkte,merke){return{titel,punkte,merke,zeige(el,ctx){
  const roh=BILDER[name],soll=roh.map(laeufe);
  const ein=ctx.daten.ein||(ctx.daten.ein=soll.map(l=>l.map(()=>"")));

    if(f.value&&felder[i+1])felder[i+1].focus()});

  if(ctx.geloest){const m=el.querySelector("#m");m.className="msg ok";m.textContent="Schon gelöst. Weiter geht's!"}

/* ---------- Zaubertrick (Prüfbit): In jeder Reihe und Spalte ist die Zahl der schwarzen Kästchen gerade.
   Der Zauberer dreht heimlich ein Kästchen um – das Kind findet es. So erkennt der Computer Übertragungsfehler. ---------- */
const N=6;
function neueRunde(){const g=Array(N*N).fill(0);
  for(let z=0;z<N-1;z++)for(let s=0;s<N-1;s++)g[z*N+s]=Math.random()<.45?1:0;
  for(let z=0;z<N-1;z++)g[z*N+N-1]=g.slice(z*N,z*N+N-1).reduce((a,b)=>a+b,0)%2;
  for(let s=0;s<N;s++){let n=0;for(let z=0;z<N-1;z++)n+=g[z*N+s];g[(N-1)*N+s]=n%2}
  return{g,dreh:null}}
function zauber(titel,punkte,runden,hilfe,merke){return{titel,punkte,merke,zeige(el,ctx){
  const d=ctx.daten;d.geschafft=d.geschafft||0;if(!d.runde)d.runde=neueRunde();ctx.speichern();
  const zeichne=()=>{const {g,dreh}=d.runde;
    const zs=z=>g.slice(z*N,z*N+N).reduce((a,b)=>a+b,0),ss=s=>{let n=0;for(let z=0;z<N;z++)n+=g[z*N+s];return n};
    el.innerHTML=`<div class="regel">🎩 <b>Der Trick:</b> In jeder Reihe und jeder Spalte sind <b>gerade viele</b> schwarze Kästchen (0, 2, 4 oder 6). Der Zauberer dreht heimlich <b>ein</b> Kästchen um. Wo ist jetzt eine Reihe <b>und</b> eine Spalte ungerade? Da ist es!</div>
      <p class="eyebrow" style="margin-top:12px">Runde ${Math.min(d.geschafft+1,runden)} von ${runden} · ${d.geschafft} geschafft</p>
      <div class="zauber${hilfe?" hilfe":""}">${Array.from({length:N},(_,z)=>Array.from({length:N},(_,s)=>`<button data-i="${z*N+s}" class="${g[z*N+s]?"s":""}" ${dreh==null?"disabled":""}></button>`).join("")+(hilfe?`<span class="zahl">${zs(z)}</span>`:"")).join("")}
        ${hilfe?Array.from({length:N},(_,s)=>`<span class="zahl">${ss(s)}</span>`).join("")+"<span></span>":""}</div>
      <div class="row" style="margin-top:14px">${d.geschafft>=runden?"":dreh==null?`<button class="btn" id="zaub">🎩 Zaubern! Ein Kästchen umdrehen</button>`:`<span class="msg" style="margin:0">Tippe auf das umgedrehte Kästchen!</span>`}</div><div id="m"></div>`;
    if(hilfe)el.querySelector(".zauber").style.gridTemplateColumns=`repeat(${N},1fr) 2.2em`;
    const z=el.querySelector("#zaub");if(z)z.onclick=()=>{const g2=d.runde.g;el.querySelector(".zauber").classList.add("wackeln");
      setTimeout(()=>{const i=Math.floor(Math.random()*N*N);g2[i]=g2[i]?0:1;d.runde.dreh=i;ctx.speichern();zeichne()},600)};
    el.querySelectorAll(".zauber button:not([disabled])").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
      if(i===d.runde.dreh){b.classList.add("gefunden");d.geschafft++;d.runde=neueRunde();ctx.speichern();
        if(d.geschafft>=runden){ctx.geschafft(punkte);setTimeout(()=>{zeichne();const m=el.querySelector("#m");m.className="msg ok";m.textContent="🎉 Super! Du hast den Trick durchschaut. Tippe auf „Weiter“."},500)}
        else{toast("Gefunden!");setTimeout(zeichne,700)}}
      else{ctx.fehler();b.classList.add("daneben");toast("Nicht das – zähl die schwarzen Kästchen in jeder Reihe!")}});
  };
  zeichne();
  ctx.pruefer=()=>{const m=el.querySelector("#m");m.className="msg no";m.textContent=`Noch ${runden-d.geschafft} ${runden-d.geschafft===1?"Runde":"Runden"}!`;return false};
  ctx.loesung=()=>{if(d.runde.dreh!=null){const b=el.querySelector(`.zauber button[data-i="${d.runde.dreh}"]`);if(b)b.classList.add("gefunden")}else toast("Erst „Zaubern“ tippen")};
}}}

/* ---------- Pixel-Rätsel (Nonogramm): Die Zahlen am Rand sagen, wie viele schwarze Kästchen nebeneinander liegen ---------- */
const hinweise=zeile=>{const r=[];let n=0;for(const c of zeile){if(c===1)n++;else if(n){r.push(n);n=0}}if(n)r.push(n);return r.length?r:[0]};
function nonogramm(name,titel,punkte,merke){return{titel,punkte,merke,zeige(el,ctx){
  const roh=BILDER[name],h=roh.length,w=roh[0].length,soll=zahlen(roh);
  const reihe=z=>soll.slice(z*w,z*w+w),spalte=sp=>Array.from({length:h},(_,z)=>soll[z*w+sp]);
  const rh=Array.from({length:h},(_,z)=>hinweise(reihe(z))),sh=Array.from({length:w},(_,sp)=>hinweise(spalte(sp)));
  el.innerHTML=`<div class="regel">🧩 <b>Pixel-Rätsel:</b> Die Zahlen sagen dir, wie viele <b>schwarze Kästchen nebeneinander</b> liegen. „2 1“ heißt: erst 2 schwarze, dann Lücke, dann 1 schwarzes. Eine Zahl wird <b style="color:var(--good)">grün</b>, wenn die Reihe passt.</div>
    <div class="nono" style="--w:${w}"><div></div><div class="sh">${sh.map((x,sp)=>`<span data-s="${sp}">${x.join("<br>")}</span>`).join("")}</div>
      <div class="rh">${rh.map((x,z)=>`<span data-r="${z}">${x.join(" ")}</span>`).join("")}</div><div id="b"></div></div>
    <div class="row noprint" style="margin-top:14px"><button class="btn ghost" id="l">Alles löschen</button><span class="muted small">Fertig? Tippe unten auf „Weiter“.</span></div><div id="m"></div>`;
  const pruefeZeilen=v=>{
    for(let z=0;z<h;z++)el.querySelector(`[data-r="${z}"]`).classList.toggle("ok",hinweise(v.slice(z*w,z*w+w)).join()===rh[z].join());
    for(let sp=0;sp<w;sp++)el.querySelector(`[data-s="${sp}"]`).classList.toggle("ok",hinweise(Array.from({length:h},(_,z)=>v[z*w+sp])).join()===sh[sp].join())};
  const r=pixelRaster({w,h,werte:ctx.daten.bild,palette:SW,malbar:true,onAenderung:v=>{ctx.daten.bild=v.slice();ctx.speichern();pruefeZeilen(v)}});
  el.querySelector("#b").append(r.el);r.el.style.maxWidth="none";pruefeZeilen(r.werte);
  ctx.pruefer=()=>pruefen(ctx,r,soll,punkte,el.querySelector("#m"));
  ctx.loesung=()=>r.setzeAlle(soll);
  el.querySelector("#l").onclick=()=>{if(confirm("Wirklich alles löschen?"))r.setzeAlle(Array(w*h).fill(0))};
  if(ctx.geloest){const m=el.querySelector("#m");m.className="msg ok";m.textContent="Schon gelöst. Weiter geht's!"}
}}}

/* ---------- Farbmischer: Bildschirm-Farben entstehen aus 3 Lampen (Rot, Grün, Blau). Jede Lampe: aus / halb / an.
   Für den Computer ist jede Farbe 3 Zahlen (0, 128 oder 255). ---------- */
const STUFEN=[0,128,255],STUFE_TEXT=["aus","halb","an"];
const ZIELE=[
  {n:"Rot",s:[2,0,0],tipp:"Mach nur die rote Lampe an."},
  {n:"Gelb",s:[2,2,0],tipp:"Komisch, aber wahr: <b>Rot + Grün</b> ergibt bei Licht <b>Gelb</b>!"},
  {n:"Weiß",s:[2,2,2],tipp:"Was passiert, wenn <b>alle drei</b> Lampen an sind?"},
  {n:"Lila",s:[1,0,2],tipp:"<b>Halb Rot</b> und <b>ganz Blau</b>."},
];
const rgb=st=>st.map(x=>STUFEN[x]).join(",");
function farbmischer(titel,punkte,merke){return{titel,punkte,merke,zeige(el,ctx){
  const d=ctx.daten;d.runde=d.runde||0;d.s=d.s||[0,0,0];
  const zeichne=()=>{
    if(d.runde>=ZIELE.length){el.innerHTML=`<div class="msg ok">🎨 Alle Farben gemischt! Tippe auf „Weiter“.</div>`;return}
    const ziel=ZIELE[d.runde];
    el.innerHTML=`<div class="regel">🔦 Jeder Bildschirm hat winzige <b>Lampen</b> in Rot, Grün und Blau. Tippe auf die Lampen, bis deine Farbe aussieht wie das Ziel. Jede Lampe: <b>aus → halb → an</b>.</div>
      <p class="eyebrow" style="margin-top:12px">Farbe ${d.runde+1} von ${ZIELE.length}</p><p class="tipp">💡 Tipp: ${ziel.tipp}</p>
      <div class="mischer"><div class="felder"><div><div class="feld" style="background:rgb(${rgb(ziel.s)})"></div><b>Ziel: ${ziel.n}</b></div>
        <div><div class="feld" id="du"></div><b>Deine Farbe</b></div></div>
        <div><div class="lampen">${["Rot","Grün","Blau"].map((n,k)=>`<button class="lampe l${k}" data-k="${k}"><span class="birne"></span><b>${n}</b><span class="stufe"></span></button>`).join("")}</div>
        <p class="muted" style="margin-top:10px">Für den Computer ist deine Farbe: <b id="code"></b></p></div></div><div id="m"></div>`;
    const male=()=>{el.querySelector("#du").style.background=`rgb(${rgb(d.s)})`;
      el.querySelectorAll(".lampe").forEach(b=>{const k=+b.dataset.k;b.dataset.st=d.s[k];b.querySelector(".stufe").textContent=`${STUFE_TEXT[d.s[k]]} (${STUFEN[d.s[k]]})`});
      el.querySelector("#code").textContent=d.s.map(x=>STUFEN[x]).join(", ")};male();
    el.querySelectorAll(".lampe").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;d.s[k]=(d.s[k]+1)%3;male();ctx.speichern();
      if(d.s.join()===ZIELE[d.runde].s.join()){const m=el.querySelector("#m");m.className="msg ok";m.textContent="Genau richtig! Tippe auf „Weiter“."}});
  };
  zeichne();
  ctx.pruefer=()=>{const m=el.querySelector("#m");
    if(d.runde>=ZIELE.length){ctx.geschafft(punkte);return true}
    if(d.s.join()===ZIELE[d.runde].s.join()){d.runde++;d.s=[0,0,0];ctx.speichern();
      if(d.runde>=ZIELE.length){ctx.geschafft(punkte);return true}
      toast("Perfekt gemischt! 🎨 Nächste Farbe");zeichne();return false}
    m.className="msg no";m.textContent="Noch nicht gleich – schau dir den Tipp oben an.";return false};
  ctx.loesung=()=>{if(d.runde<ZIELE.length){d.s=ZIELE[d.runde].s.slice();zeichne()}};
}}}

  schritte:[{titel:"Dein Kunstwerk",punkte:0,zeige(el,ctx){
    const d=ctx.daten,{PAL,NAMEN}=P();
    el.innerHTML=`<p>Mal, was du willst! Wenn du fertig bist, kannst du dein Bild als Datei speichern.</p><div id="pal"></div><div class="frei" id="b"></div>
      <div class="row" style="margin-top:14px"><button class="btn" id="png">💾 Als Bild speichern</button><button class="btn ghost" id="l">🧽 Alles löschen</button></div>`;
    const leiste=farbLeiste(PAL,NAMEN,1,false,false);el.querySelector("#pal").append(leiste.el);
    const r=pixelRaster({w:16,h:16,werte:d.bild,palette:PAL,malbar:true,farbe:leiste.farbe,onAenderung:v=>{d.bild=v.slice();ctx.speichern()}});
    el.querySelector("#b").append(r.el);
    el.querySelector("#l").onclick=()=>{if(confirm("Ganzes Bild löschen?"))r.setzeAlle(Array(256).fill(0))};
    el.querySelector("#png").onclick=()=>{const c=document.createElement("canvas");c.width=c.height=320;const g=c.getContext("2d");
      r.werte.forEach((v,k)=>{g.fillStyle=PAL[v];g.fillRect(k%16*20,Math.floor(k/16)*20,20,20)});
      const a=document.createElement("a");a.href=c.toDataURL("image/png");a.download="mein-pixelbild.png";a.click();toast("Bild gespeichert! 🎨")};
  }}]});

async function versionPruefen(){if(!/github\.io$/.test(location.hostname))return;
  try{const r=await fetch("version.txt?"+Date.now(),{cache:"no-store"});const v=(await r.text()).trim();
    if(!v||v===VERSION)return;
    /* höchstens ein Neuladen pro Version (sonst Schleife, solange GitHub noch die alte Seite ausliefert) */
    let schon=null;try{schon=sessionStorage.getItem("if5-neu")}catch(e){}
    if(schon===v)return;try{sessionStorage.setItem("if5-neu",v)}catch(e){}
    await hochladen();location.replace(location.pathname+"?v="+v+location.hash)}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)versionPruefen();else if(sitzung){clearTimeout(pushTimer);hochladen()}});
