@font-face{font-family:"Hyperlegible";font-style:normal;font-weight:200 800;font-display:swap;src:url("fonts/ahl-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Hyperlegible Mono";font-style:normal;font-weight:200 800;font-display:swap;src:url("fonts/ahm-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Informatik 5 — „Rechenheft“: kariertes Papier, Füllertinte, Textmarker, Stempel. Siehe DESIGN.md */
:root{color-scheme:light;
  --bg:#F3F6FA; --karo:#DDE6F1; --surface:#FFFFFF; --ink:#16203F; --muted:#56607A; --line:#D5DCE8;
  --fill:rgba(31,68,200,.06); --fill2:rgba(22,32,63,.12);
  --accent:#1F44C8; --accent-ink:#FFFFFF;
  --marker:#FFE55C; --marker-ink:#2B2500;
  --good:#17783F; --bad:#C22A3D; --gold:#16203F;
  --good-soft:#E6F4EB; --bad-soft:#FBE9EB;
  --tint:rgba(31,68,200,.09);
  --sans:"Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --serif:var(--sans);
  --mono:"Hyperlegible Mono",var(--mono);
  --r:8px; --r-l:10px; --r-m:10px;
  --lift:0 0 0 1.5px var(--line);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#141A24; --karo:#1D2634; --surface:#1B2331; --ink:#E9EDF6; --muted:#A3AEC4; --line:#313C50;
  --fill:rgba(160,180,255,.09); --fill2:rgba(200,210,235,.18);
  --accent:#9DB2FF; --accent-ink:#0E1530; --marker:#E7CC45;
  --good:#6FCB94; --bad:#F2909B; --gold:#E9EDF6; --good-soft:#1C3328; --bad-soft:#3A2228;
  --tint:rgba(157,178,255,.14)}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#141A24; --karo:#1D2634; --surface:#1B2331; --ink:#E9EDF6; --muted:#A3AEC4; --line:#313C50;
  --fill:rgba(160,180,255,.09); --fill2:rgba(200,210,235,.18);
  --accent:#9DB2FF; --accent-ink:#0E1530; --marker:#E7CC45;
  --good:#6FCB94; --bad:#F2909B; --gold:#E9EDF6; --good-soft:#1C3328; --bad-soft:#3A2228;
  --tint:rgba(157,178,255,.14)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--sans);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 75%,transparent);outline-offset:2px}
#app{max-width:58rem;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 60px max(16px,env(safe-area-inset-right,0px));overflow-wrap:break-word}
h1,h2,h3{font-family:var(--serif);font-optical-sizing:auto;text-wrap:balance;margin:0}
h1{font-size:2.25rem;font-weight:600;line-height:1.1;letter-spacing:-.02em;margin-bottom:12px}
h2{font-size:1.5rem;font-weight:600;line-height:1.2;letter-spacing:-.012em;margin-bottom:10px}
p{margin:0 0 10px;text-wrap:pretty}
.eyebrow{font-size:.8125rem;font-weight:650;color:var(--muted);margin:0 0 6px;letter-spacing:.02em;text-transform:uppercase}
.muted{color:var(--muted)} .small{font-size:.875rem}
.block{background:var(--surface);border-radius:var(--r-m);padding:20px;margin:0 0 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 22px;border:0;border-radius:var(--r);font-weight:650;background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(0,0,0,.1);transition:transform .15s,filter .15s}
.btn:active:not(:disabled){transform:scale(.97);filter:brightness(.93)}
.btn.ghost{background:var(--tint);color:var(--accent);box-shadow:none}
.btn.wide{width:100%}
.btn:disabled{opacity:.38;cursor:default}
.link{border:0;background:none;padding:6px 0;color:var(--accent);font-weight:600;min-height:44px}
.chip{display:inline-block;border-radius:4px;background:var(--fill);color:var(--muted);padding:3px 10px;font-weight:650;font-size:.78rem;white-space:nowrap}
.chip.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
input[type=text],select{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 14px;font-size:1.125rem}
input[type=text]:focus,select:focus{border-color:var(--accent);outline:none}
label.f{display:block;font-weight:650;margin:0 0 6px}

/* Kopf mit Name */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 14px}
.top .who{font-weight:650}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:600;font-size:1.25rem}
.brand svg{width:34px;height:34px}

/* Platte (Startseite / Ergebnis) */
.plate{position:relative;overflow:hidden;border-radius:var(--r-l);padding:24px 22px;margin:0 0 16px;color:#fff;
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.16),transparent 55%),linear-gradient(165deg,var(--plate-top),var(--plate-bot));box-shadow:0 18px 36px -26px var(--plate-bot)}
.plate .eyebrow{color:rgba(255,255,255,.8)}
.plate h1,.plate h2{color:#fff}
.plate .btn{background:#fff;color:var(--plate-bot)}

/* Stationen-Kacheln */
.grid-st{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.st{display:flex;flex-direction:column;gap:6px;text-align:left;border:0;border-radius:var(--r-m);background:var(--surface);padding:18px;min-height:150px;box-shadow:var(--lift)}
.st .ico{font-size:2rem;line-height:1}
.st h3{font-size:1.25rem}
.st.soon{opacity:.55;box-shadow:none;cursor:default}
.st .meta{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}

/* Schritt-Leiste */
.steps{display:flex;gap:6px;margin:0 0 16px}
.steps i{flex:1;height:8px;border-radius:4px;background:var(--fill2)}
.steps i.ok{background:var(--good)} .steps i.now{background:var(--accent)}
.stephead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 8px}
.pts{font-weight:700;color:var(--gold);white-space:nowrap}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.msg{border-radius:var(--r);padding:12px 16px;margin:12px 0 0;font-weight:600}
.msg.ok{background:var(--good-soft);color:var(--good)}
.msg.no{background:var(--bad-soft);color:var(--bad)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:var(--r);font-weight:600;z-index:9;box-shadow:var(--lift)}

/* Ergebnis */
.result dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:12px 0 0}
.result dt{color:rgba(255,255,255,.75)} .result dd{margin:0;font-weight:700}
.note{font-family:var(--serif);font-size:3.5rem;font-weight:700;line-height:1}
@media print{.noprint{display:none!important}body{background:#fff}}

/* Anmeldung */
.wahl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.gross{min-height:110px;border:0;border-radius:var(--r-m);background:var(--surface);box-shadow:var(--lift);font:600 2.5rem/1 var(--serif);color:var(--accent)}
.gross:active{transform:scale(.97)}
.tiere{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.tiere.klein{grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.tier{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;border-radius:var(--r-m);background:var(--surface);box-shadow:var(--lift);padding:14px 6px 12px;font-weight:650;font-size:.9375rem;min-height:110px}
.tier .e{font-size:2.75rem;line-height:1.1}
.tiere.klein .tier{min-height:92px;padding:10px 4px;font-size:.8125rem}
.tiere.klein .tier .e{font-size:2.25rem}
.tier:active:not(:disabled){transform:scale(.96)}
.tier.zu{opacity:.38;box-shadow:none;cursor:default}
input[type=password]{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 14px;font-size:1.125rem}

/* Lehrer-Ansicht */
.tabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.tabs button{border:0;border-radius:var(--r);background:var(--surface);padding:10px 18px;font-weight:650;min-height:46px}
.tabs button.an{background:var(--accent);color:var(--accent-ink)}
.tabs button.an .muted{color:inherit;opacity:.75}
.frei-box{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border-left:6px solid var(--bad)}
.frei-box.offen{border-left-color:var(--good)}
table.liste{border-collapse:collapse;width:100%;font-size:.9375rem}
.liste th{text-align:left;font-size:.78rem;color:var(--muted);font-weight:650;padding:6px 10px 8px;white-space:nowrap}
.liste td{border-top:1px solid var(--line);padding:8px 10px;vertical-align:middle;white-space:nowrap}
.liste td.t{font-weight:650}.liste td.t .e{font-size:1.5rem;margin-right:6px;vertical-align:middle}
.liste input.vn{min-height:40px;padding:6px 10px;font-size:1rem;min-width:9rem;border-radius:6px}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
label.btn{cursor:pointer}
.steps.springen i{cursor:pointer;height:14px}
.steps.springen i:hover{filter:brightness(.85)}
.note.zeichen{font-family:var(--sans);font-size:4rem;font-weight:800}
.chip.gross-z{font-size:1rem;min-width:2rem;text-align:center;padding:2px 10px}
.heute{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px 18px;margin-top:10px}
.heute div{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:6px 0}
.steps.springen i.zu{cursor:default;opacity:.6}
.btn.pfeil{min-width:9rem;font-size:1.0625rem}
.frage{font-size:1.25rem;font-weight:600;margin:4px 0 14px}
.antworten{display:grid;gap:10px}
.antwort{text-align:left;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px 18px;font-size:1.0625rem;font-weight:600;min-height:58px}
.antwort:hover:not(:disabled){border-color:var(--accent)}
.antwort.falsch{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.antwort.richtig{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.antwort:disabled{cursor:default}
.aha{margin-top:16px;border-radius:var(--r);padding:16px 18px;background:color-mix(in srgb,var(--gold) 12%,var(--surface));border:2px solid color-mix(in srgb,var(--gold) 35%,transparent);font-size:1.0625rem}
.vorschlag{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:2px solid var(--accent)}
.vorschlag .e{font-size:3rem;line-height:1}
.vorschlag .btn{margin-left:auto}
.gross-tier .e{font-size:4.5rem;line-height:1;display:block;margin-bottom:6px}
.code li{border-radius:6px;transition:background .1s}
.code li.an{background:color-mix(in srgb,var(--accent) 18%,transparent);outline:2px solid var(--accent)}
.pal button.radierer{background:repeating-linear-gradient(45deg,#fff 0 6px,#eee 6px 12px)}
.pal button .rad{background:none;font-size:1.25rem;padding:0}
.konfetti{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.konfetti i{position:absolute;top:-40px;font-style:normal;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.bildchen{font-size:2rem;line-height:1.05;letter-spacing:2px;margin:0 0 14px}
.antworten{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.antwort{font-size:1.25rem;text-align:center;min-height:72px}
.regel{border-radius:var(--r);padding:12px 16px;background:color-mix(in srgb,var(--gold) 12%,var(--surface));border:2px solid color-mix(in srgb,var(--gold) 35%,transparent);font-size:1.0625rem}
.schluessel{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
.schluessel button{display:flex;align-items:center;gap:10px;border:3px solid var(--line);border-radius:var(--r);background:var(--surface);padding:8px 16px 8px 10px;font-weight:700;font-size:1.0625rem;min-height:58px}
.schluessel button b{font:800 1.75rem/1 var(--mono);min-width:1.2em;text-align:center}
.schluessel .sw{width:30px;height:30px;border-radius:8px;background:var(--c);border:1px solid rgba(0,0,0,.15)}
.schluessel button.an{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent);transform:scale(1.04)}
.code .z{text-decoration:underline 5px var(--c);text-underline-offset:5px;text-decoration-skip-ink:none}
.code li{align-items:baseline}
.aha.merke{margin:4px 0 14px}
.tipp-code{display:grid;gap:4px}
.tipp-code .tz{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-width:340px}
.tipp-code button{aspect-ratio:1;min-height:34px;border:2px solid var(--line);border-radius:8px;background:var(--surface);font:700 1.125rem var(--mono);padding:0}
.tipp-code button.eins{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tipp-code button.falsch{outline:3px solid var(--bad);outline-offset:-3px}
.kurz{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.kurz li{display:flex;gap:6px;border-radius:8px;padding:2px 4px}
.kurz li.an{background:color-mix(in srgb,var(--accent) 18%,transparent);outline:2px solid var(--accent)}
.lauf{display:inline-flex;align-items:center;gap:3px;border-radius:8px;padding:2px 8px;background:var(--fill);font-size:1.0625rem}
.lauf b{font-family:var(--mono);font-size:1.25rem}
.kurz-ein{display:grid;gap:6px}
.kz{display:flex;gap:6px;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;gap:2px;border-radius:6px;background:var(--fill);padding:2px}
.stepper button{width:32px;height:34px;border:0;border-radius:8px;background:var(--surface);font-weight:800;font-size:1.125rem}
.stepper b{min-width:1.4em;text-align:center;font:700 1.25rem var(--mono)}
.stepper i{font-style:normal;padding:0 4px 0 2px}
.stepper.falsch{outline:3px solid var(--bad)}
.zauber{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;max-width:360px;align-items:center}
.zauber button{aspect-ratio:1;border:2px solid var(--line);border-radius:6px;background:#fff;padding:0}
.zauber button.s{background:#1B1B1F;border-color:#1B1B1F}
.zauber button:disabled{cursor:default}
.zauber button.daneben{outline:3px solid var(--bad);outline-offset:-3px}
.zauber button.gefunden{outline:4px solid var(--good);outline-offset:-4px;box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 40%,transparent)}
.zauber .zahl{font:700 1.125rem var(--mono);text-align:center;color:var(--muted)}
.zauber.wackeln{animation:wackeln .6s}
@keyframes wackeln{0%,100%{transform:none}20%{transform:rotate(-3deg)}40%{transform:rotate(3deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(2deg)}}
.bildcode{font:600 .75rem/1.25 var(--mono);background:var(--fill);border-radius:6px;padding:10px;margin:0 0 6px;overflow-x:auto;letter-spacing:1px}
@media (prefers-reduced-motion: reduce){.zauber.wackeln{animation:none}}
.kurz-tabelle{display:grid;gap:10px;margin-top:14px}
.kzeile{display:flex;gap:8px;flex-wrap:nowrap}
.gruppe{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed var(--accent);border-radius:6px;padding:5px}
.kaest{display:flex;gap:2px}
.kaest i{width:30px;height:30px;border-radius:4px;background:#fff;border:1.5px solid #c9c9d2}
.kaest i.s{background:#1B1B1F;border-color:#1B1B1F}
.gruppe input{width:46px;height:42px;text-align:center;font:700 1.375rem var(--mono);border:2px solid var(--line);border-radius:6px;background:var(--surface);padding:0}
.gruppe input:focus{border-color:var(--accent);outline:none}
.gruppe input.falsch{border-color:var(--bad);background:var(--bad-soft)}
@media (max-width:520px){.kaest i{width:20px;height:20px}}
.sq{display:inline-block;width:.95em;height:.95em;border-radius:3px;background:#fff;border:1.5px solid #b9b9c4;vertical-align:-.12em;margin:0 1px}
.sq.s{background:#1B1B1F;border-color:#1B1B1F}
/* Dunkelmodus: Schwarz muss sich vom Hintergrund abheben */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sq.s,:root:not([data-theme="light"]) .kaest i.s,:root:not([data-theme="light"]) .zauber button.s{border-color:#8a8a96}
  :root:not([data-theme="light"]) .px{background:#6b6b76;border-color:#6b6b76}}
:root[data-theme="dark"] .sq.s,:root[data-theme="dark"] .kaest i.s,:root[data-theme="dark"] .zauber button.s{border-color:#8a8a96}
:root[data-theme="dark"] .px{background:#6b6b76;border-color:#6b6b76}
/* Pixel-Inhalte immer auf hellem „Papier“, auch im Dunkelmodus */
.lauf{background:#ECECF1;color:#1B1B1F}
.gruppe{background:#F4F4F7}
.gruppe input{background:#fff;color:#1B1B1F;border:2px solid #8b84e8}
.gruppe input::placeholder{color:#b0b0bb}
.nono{display:grid;grid-template-columns:auto minmax(0,min(100%,calc(var(--w)*44px)));gap:6px;margin-top:14px;align-items:end;max-width:100%}
.nono .sh{display:grid;grid-template-columns:repeat(var(--w),1fr);gap:2px;text-align:center;font:700 1rem/1.15 var(--mono);padding:0 2px}
.nono .rh{display:grid;grid-auto-rows:1fr;gap:2px;font:700 1rem var(--mono);text-align:right;align-self:stretch;padding:4px 0}
.nono .rh span{display:flex;align-items:center;justify-content:flex-end;padding-right:4px;white-space:nowrap}
.nono span.ok{color:var(--good)}
.nono .px{max-width:none;width:100%}
.mischer{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:6px;align-items:center}
.felder{display:flex;gap:14px}
.felder>div{flex:1;text-align:center}
.feld{aspect-ratio:1;border-radius:var(--r);border:2px solid var(--line);margin-bottom:6px;background:#000}
.regler{display:grid;gap:12px}
.regler label{display:grid;grid-template-columns:3.4em 1fr 2.6em;align-items:center;gap:10px;font-weight:700}
.regler input{width:100%;height:34px}
.regler .r0 input{accent-color:#E5383B}.regler .r1 input{accent-color:#2DA44E}.regler .r2 input{accent-color:#2F6FDE}
.regler b{font-family:var(--mono);text-align:right}
.nono{width:fit-content;grid-template-columns:auto min(calc(var(--w)*48px),calc(100vw - 110px))}
.lampen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lampe{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 6px;font-size:1rem}
.lampe .birne{width:56px;height:56px;border-radius:50%;background:#2a2a30;border:3px solid #55555f;transition:all .15s}
.lampe .stufe{font-size:.875rem;color:var(--muted);font-weight:600}
.lampe.l0[data-st="1"] .birne{background:#801c1e;box-shadow:0 0 14px #e5383b80}.lampe.l0[data-st="2"] .birne{background:#ff2b2b;box-shadow:0 0 26px #ff2b2b}
.lampe.l1[data-st="1"] .birne{background:#167030;box-shadow:0 0 14px #2da44e80}.lampe.l1[data-st="2"] .birne{background:#2bff5a;box-shadow:0 0 26px #2bff5a}
.lampe.l2[data-st="1"] .birne{background:#1c3f8a;box-shadow:0 0 14px #2f6fde80}.lampe.l2[data-st="2"] .birne{background:#3b7bff;box-shadow:0 0 26px #3b7bff}
.lampe:active{transform:scale(.97)}
.tipp{font-size:1.0625rem;margin:0 0 10px}
.bewertung{text-align:center;background:rgba(255,255,255,.14);border-radius:var(--r);padding:10px 16px;min-width:9rem}
.bewertung .note{margin:2px 0}

/* ===== Startseite: Rang, Held, Lernpfad, Spielplatz ===== */
.plate.start h1{margin-bottom:8px}
.sterne{display:flex;flex-wrap:wrap;gap:6px 16px;font-weight:650;margin-bottom:12px}
.balken{height:12px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}
.balken i{display:block;height:100%;background:#fff;border-radius:4px}
.hero{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:0;box-shadow:var(--lift);flex-wrap:wrap}
.hero.los{cursor:pointer;border:3px solid var(--accent)}
.hero .hico{font-size:3.25rem;line-height:1}
.hero>div{flex:1;min-width:200px}
.hero h2{margin:2px 0 4px}
.hero .btn{pointer-events:none}
.lernpfad{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.lernpfad .kap{font-weight:700;color:var(--muted);margin:14px 0 2px;font-size:.9375rem}
.pfad{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:var(--r-m);background:var(--surface);padding:12px 14px;min-height:64px}
.pfad .nr{width:30px;height:30px;border-radius:50%;background:var(--fill2);display:grid;place-items:center;font-weight:700;font-size:.875rem;flex:none}
.pfad.fertig .nr{background:var(--good);color:#fff}
.pfad.offen .nr{background:var(--accent);color:var(--accent-ink)}
.pfad .pico{font-size:1.75rem;line-height:1;flex:none}
.pfad .ptitel{flex:1;display:flex;flex-direction:column;min-width:0}
.pfad .ptitel small{color:var(--muted)}
.pfad.zu,.pfad.morgen{opacity:.55}
.pfad.offen{box-shadow:0 0 0 2px var(--accent)}
.pfad .abz{font-size:1.5rem;white-space:nowrap}
.chip.jetzt{background:var(--accent);color:var(--accent-ink)}
.schloss{font-size:1.25rem}
.spielplatz.zu .spiele{opacity:.45}
.spiele{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.spiel{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid var(--line);border-radius:var(--r-m);background:var(--surface);padding:14px 8px;text-align:center}
.spiel span{font-size:2.25rem;line-height:1}
.spiel small{color:var(--muted)}
.spiel:disabled{cursor:default}
.abzeichen-box{display:flex;align-items:center;gap:16px}
.gross-abz{font-size:3.5rem;line-height:1}
.liste th.c,.liste td.c{text-align:center;padding-left:4px;padding-right:4px}
details.plan summary{cursor:pointer}
details.plan ol{padding-left:22px;display:grid;gap:10px;margin:14px 0}

/* ===== Bausteine: Karten, Töpfe, Reihenfolge, Paare ===== */
.karten{display:flex;flex-wrap:wrap;gap:8px;min-height:10px}
.karten.spalte{flex-direction:column;align-items:stretch}
.karte{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 14px;font-weight:600;font-size:1rem;min-height:50px;text-align:left;box-shadow:0 1px 0 var(--line);transition:transform .12s,border-color .12s}
.karte:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.karte:active{transform:scale(.97)}
.karte.an{border-color:var(--accent);background:var(--tint);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent);transform:translateY(-2px)}
.karte.falsch,.wkarte.falsch{border-color:var(--bad)!important;background:var(--bad-soft);color:var(--bad)}
.karte .kico{font-size:1.5rem;line-height:1}
.karte .weg{margin-left:auto;color:var(--muted);font-size:.875rem}
.toepfe{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin-top:14px}
.toepfe.breit{grid-template-columns:1fr}
.topf{border:2.5px dashed var(--line);border-radius:var(--r);background:color-mix(in srgb,var(--fill) 60%,var(--surface));padding:10px;min-height:120px;transition:border-color .15s,background .15s;cursor:pointer}
.topf.bereit{border-color:var(--accent);background:var(--tint)}
.topf-kopf{display:flex;align-items:center;gap:8px;font-weight:750;font-size:1.0625rem;margin:2px 4px 10px}
.topf-kopf span{font-size:1.5rem}
.topf-inhalt{display:flex;flex-wrap:wrap;gap:6px}
.topf-inhalt .karte{font-size:.9375rem;min-height:42px;padding:6px 10px}
.toepfe .topf:nth-child(1){--tc:#1F44C8}.toepfe .topf:nth-child(2){--tc:#C2410C}.toepfe .topf:nth-child(3){--tc:#15803D}.toepfe .topf:nth-child(4){--tc:#A21CAF}
.topf{border-color:color-mix(in srgb,var(--tc,var(--line)) 45%,transparent)}
.topf-kopf{color:var(--tc,var(--ink))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .topf-kopf{color:color-mix(in srgb,var(--tc) 50%,#fff)}}
:root[data-theme="dark"] .topf-kopf{color:color-mix(in srgb,var(--tc) 50%,#fff)}
ol.reihe{margin:0;padding:0 0 0 26px;display:grid;gap:6px}
ol.reihe li::marker{font-weight:800;color:var(--accent)}
ol.reihe .karte{width:100%}
ol.reihe li.leer{color:var(--muted);list-style:none;margin-left:-26px;padding:10px 14px;border:2px dashed var(--line);border-radius:var(--r)}
.paare{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.paare>div{display:grid;gap:8px;align-content:start}
.paare .karte{width:100%;font-size:.9375rem}
.pnr{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.875rem;background:var(--fill2);color:var(--muted)}
.karte.links .pnr,.pnr.voll{background:var(--pf);color:#fff}
.karte.links.an{border-color:var(--pf);box-shadow:0 0 0 3px color-mix(in srgb,var(--pf) 30%,transparent)}
.karte.rechts[style*="--pf"]{border-color:var(--pf)}
@media (max-width:560px){.paare{gap:8px}.paare .karte{padding:8px 10px;font-size:.875rem}}
.wahlkarten{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:8px}
.wkarte{border:2px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px;font-weight:600;min-height:58px;text-align:center}
.wkarte.an{border-color:var(--good);background:var(--good-soft);color:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.wkarte.an::before{content:"✔ "}
ul.warum{margin:10px 0 0;padding-left:20px;font-weight:500;display:grid;gap:4px}

/* Nachricht / Fehler-Suche */
.nachricht{border-radius:var(--r);background:var(--surface);border:2px solid var(--line);overflow:hidden;margin-top:6px;box-shadow:var(--lift)}
.n-art{background:var(--fill);padding:8px 14px;font-weight:700;font-size:.875rem;color:var(--muted)}
.n-kopf{padding:10px 14px;border-bottom:1px solid var(--line);font-size:.9375rem;color:var(--muted)}
.n-text{padding:14px;font-size:1.0625rem;line-height:2}
.stelle{border-radius:6px;padding:2px 3px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone;border-bottom:2px dotted color-mix(in srgb,var(--muted) 45%,transparent)}
.stelle:hover{background:var(--fill)}
.stelle.an{background:color-mix(in srgb,#F5C518 45%,transparent);border-bottom-color:#B38600;font-weight:650}
.stelle.falsch{background:var(--bad-soft);color:var(--bad);border-bottom-color:var(--bad)}
/* Szene / Entscheidung */
.szene{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:var(--r);padding:14px 16px;border:2px solid var(--line);margin:4px 0 12px}
.sz-bild{font-size:2.75rem;line-height:1;flex:none}
.sz-text{font-size:1.0625rem}
/* Explorer */
.explorer{border:2px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;margin-top:12px}
.ex-leiste{display:flex;gap:10px;align-items:center;padding:8px;border-bottom:1px solid var(--line);background:var(--fill);flex-wrap:wrap}
.klein-btn{min-height:42px;padding:8px 14px}
.ex-pfad{font-weight:650;font-size:.9375rem;display:flex;flex-wrap:wrap;gap:4px}
.ex-pfad span{color:var(--muted)}
.ex-inhalt{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;padding:12px;min-height:120px}
.ex-ordner{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent;border-radius:var(--r);background:none;padding:10px 4px;font-weight:600;font-size:.9375rem}
.ex-ordner span{font-size:2.5rem;line-height:1}
.ex-ordner:hover{background:var(--tint);border-color:var(--accent)}
.ex-datei{display:flex;align-items:center;justify-content:center;border-radius:var(--r);background:var(--good-soft);color:var(--good);font-weight:700;padding:10px;text-align:center}
.ex-speichern{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line);background:var(--fill)}
/* Eingabe */
.eing{margin-top:14px;max-width:26rem}
.eing input{font:700 1.375rem var(--mono);letter-spacing:.06em;min-height:58px}
.eing.pw input{letter-spacing:.02em}
/* Tastatur & Tippen */
.tippzeile{font:600 1.75rem/1.5 var(--mono);background:#FBFBFD;color:#1B1B1F;border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:4px 0 8px;display:flex;flex-wrap:wrap;gap:1px 0}
.tippzeile span{padding:0 1px;border-radius:5px}
.tippzeile span.ok{color:#2D7A4E}
.tippzeile span.jetzt{background:#1F44C8;color:#fff;animation:blink 1s steps(2) infinite}
.tippzeile.blitz{animation:wackeln .35s;border-color:var(--bad)}
@keyframes blink{50%{background:#7c74f0}}
.tastatur{display:grid;gap:5px;margin-top:10px;max-width:640px;user-select:none}
.t-reihe{display:flex;gap:5px}
.taste{flex:1;min-width:0;aspect-ratio:1;display:grid;place-items:center;border-radius:9px;font:700 .9375rem var(--sans);border:1.5px solid rgba(0,0,0,.12);color:#1B1B1F;max-width:48px}
.taste.breit{flex:1.6;aspect-ratio:auto;max-width:80px;background:#E5E5EC}
.taste.leer{flex:none;width:55%;aspect-ratio:auto;height:40px;max-width:none;margin-left:22%;background:#E5E5EC}
.taste.f0,.taste.f7{background:#FDE2E4}.taste.f1,.taste.f6{background:#FFF1C1}.taste.f2,.taste.f5{background:#D9F2E0}.taste.f3,.taste.f4{background:#DDE6FF}
.taste.huegel{text-decoration:underline 3px;text-underline-offset:4px}
.taste.naechst{background:#1F44C8!important;color:#fff;transform:scale(1.12);box-shadow:0 4px 14px rgba(67,56,202,.45);z-index:1}
@media (max-width:520px){.taste{font-size:.75rem;border-radius:6px}.t-reihe{gap:3px}.tastatur{gap:3px}}
/* Tasten-Missionen */
.missionen{display:grid;gap:6px;margin-top:6px}
.mission{display:flex;align-items:center;gap:10px;border-radius:var(--r);padding:8px 12px;background:var(--surface);border:2px solid var(--line);flex-wrap:wrap}
.mission.jetzt{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.mission.ok{opacity:.6}
.mnr{width:30px;height:30px;border-radius:50%;background:var(--fill2);display:grid;place-items:center;font-weight:800;flex:none}
.mission.jetzt .mnr{background:var(--accent);color:var(--accent-ink)}
.kappen{margin-left:auto;display:flex;align-items:center;gap:4px}
.kappen i{font-style:normal;color:var(--muted);font-weight:700}
kbd{display:inline-block;min-width:2.2em;text-align:center;border-radius:8px;background:#F4F4F8;color:#1B1B1F;border:1.5px solid #c9c9d4;border-bottom-width:4px;padding:3px 8px;font:700 .9375rem var(--sans)}
.uebfeld{width:100%;min-height:120px;margin-top:10px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;font:500 1.125rem/1.5 var(--sans);resize:vertical}
.uebfeld:focus{outline:none;border-color:var(--accent)}
/* Maus-Arena */
.arena{position:relative;height:300px;border-radius:var(--r);background:radial-gradient(circle at 20% 20%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 50%),var(--surface);border:2px solid var(--line);overflow:hidden;touch-action:none;user-select:none}
.mz{position:absolute;font-size:3.25rem;line-height:1;cursor:pointer;transition:transform .15s;user-select:none;-webkit-user-select:none}
.mz:hover{transform:scale(1.12)}
.mz.treffer{transform:scale(1.6);opacity:0;transition:all .35s}
.ziel{position:absolute;font-size:4rem;line-height:1;pointer-events:none}
/* Mal-Roboter */
ol.programm{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;counter-reset:p}
ol.programm li{counter-increment:p;display:flex;align-items:center;gap:4px;font-size:1.5rem;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:4px 8px}
ol.programm li::before{content:counter(p);font:700 .7rem var(--sans);color:var(--muted)}
ol.programm li.loop{border-color:#C2410C;background:color-mix(in srgb,#F08A24 12%,var(--surface))}
ol.programm li.loop span{font:800 .875rem var(--sans);color:#C2410C;margin-right:2px}
.px.start-ol i:first-child{box-shadow:inset 0 0 0 3px #1F44C8}
.block.info{font-size:1.0625rem}


/* ===== Robo-Labyrinth ===== */
.robo{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;margin-top:12px;align-items:start}
@media (max-width:720px){.robo{grid-template-columns:1fr}}
.rfeld{display:grid;gap:3px;background:#2A2D3A;border-radius:var(--r);padding:6px;max-width:440px}
.rz{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;background:#F3F1E7;font-size:clamp(1.1rem,4.5vw,1.9rem);line-height:1;transition:background .2s}
.rz.wand{background:repeating-linear-gradient(135deg,#4B5163 0 6px,#3D4252 6px 12px)}
.rz.spur{background:#CFE8D5}
.rz.crash{background:#F8B4AA;animation:wackeln .4s}
.rsteuer{display:grid;gap:10px}
.rprog{display:flex;flex-wrap:wrap;gap:6px;min-height:58px;align-items:center;background:var(--surface);border:2px dashed var(--line);border-radius:var(--r);padding:8px}
.bef{font-size:1.5rem;line-height:1;border:2px solid var(--line);border-radius:6px;background:var(--surface);width:46px;height:46px;padding:0}
.bef:hover{border-color:var(--bad)}
.schleife{display:inline-flex;align-items:center;gap:4px;border:2px solid #C2410C;border-radius:var(--r);padding:4px;background:color-mix(in srgb,#F08A24 12%,var(--surface))}
.schleife.offen{box-shadow:0 0 0 3px color-mix(in srgb,#F08A24 40%,transparent)}
.sk{display:inline-flex;align-items:center;gap:2px;font-weight:800;color:#C2410C;margin-right:2px}
.sk button{width:28px;height:30px;border:0;border-radius:8px;background:var(--surface);font-weight:800;padding:0}
.zu-btn,.weg-btn{border:0;border-radius:8px;background:var(--surface);font-weight:700;font-size:.8125rem;padding:6px 8px;min-height:34px}
.zu-btn{background:#C2410C;color:#fff}
.rknoepfe{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rk{font-size:1.75rem;min-height:58px;padding:6px}
.rk.breit{grid-column:1/-1;font-size:1.0625rem}

/* ===== Binär-Karten ===== */
.tresor{display:flex;align-items:center;gap:14px;margin:12px 0}
.tico{font-size:3rem;line-height:1}
.bkarten{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:560px}
.bkarten.klein{max-width:380px;gap:6px}
.bkarte{aspect-ratio:3/4;border-radius:var(--r);border:2.5px solid #16308F;background:repeating-linear-gradient(45deg,#1F44C8 0 8px,#1A3BB0 8px 16px);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 4px;transition:transform .25s;font-weight:800}
.bkarte.auf{background:#FFFDF5;color:#1B1B1F;border-color:#E2B93B;transform:rotateY(360deg)}
.bwert{font:800 1.375rem var(--mono)}
.bpunkte{font-size:.75rem;line-height:1.05;letter-spacing:1px;color:#D97706;text-align:center;word-break:break-all;padding:0 2px}
.bkarten.klein .bpunkte{font-size:.6rem}
.brueck{font-size:.75rem;font-weight:700;opacity:.75;margin:auto;letter-spacing:.02em}
.bkarte:not(.auf) .bwert{opacity:.55}
.bkarten.klein .brueck{font-size:.6rem}
.bbits{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:560px;margin-top:6px;text-align:center;font:800 1.75rem var(--mono);color:var(--accent)}
.bkarten.klein+.bbits{max-width:380px;font-size:1.25rem}
.bsum{font-size:1.125rem;margin-top:10px}
/* Caesar */
.crad{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:10px;margin-top:12px;overflow-x:auto}
.crow{display:grid;grid-template-columns:4.6em repeat(26,minmax(1.15em,1fr));gap:2px;font:700 1rem var(--mono);text-align:center;min-width:560px}
.crow span{padding:4px 0;border-radius:5px;background:var(--fill)}
.crow.geheim span{background:color-mix(in srgb,#F08A24 22%,var(--surface));color:#9A3412}
.crow .clab{background:none!important;color:var(--muted)!important;font:700 .75rem var(--sans);text-align:left;align-self:center}
.ckey{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:8px;font-size:1.125rem}
.cwort{margin-top:12px;font-size:1.25rem}
.cwort b{font-family:var(--mono);letter-spacing:.1em}
.cvor{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .crow.geheim span{color:#FDBA74}}
:root[data-theme="dark"] .crow.geheim span{color:#FDBA74}

/* ===== Automaten ===== */
.automat{margin-top:12px}
.zustaende{display:flex;flex-wrap:wrap;gap:8px}
.zst{display:flex;align-items:center;gap:8px;border-radius:4px;padding:8px 14px;background:var(--surface);border:2px solid var(--line);font-size:.9375rem;transition:all .2s}
.zst span{font-size:1.375rem}
.zst.jetzt{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.anzeige{margin:14px 0;border-radius:var(--r);background:#10131A;color:#7CFCB0;font:700 1.25rem var(--mono);padding:14px 16px;min-height:56px;border:3px solid #2A2F3C}
.anzeige.blitz{animation:aufleuchten .4s}
@keyframes aufleuchten{from{background:#1F3B2C}to{background:#10131A}}
.aknoepfe{display:flex;flex-wrap:wrap;gap:8px}
details.diagramm{margin-top:12px;border-radius:var(--r);background:var(--fill);padding:10px 14px}
details.diagramm summary{cursor:pointer;font-weight:700}
details.diagramm ul{margin:8px 0;padding-left:18px;display:grid;gap:4px;font-size:.9375rem}
ul.ziele{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.ziele li{border-radius:var(--r);padding:8px 12px;background:var(--surface);border:2px solid var(--line);font-weight:600}
ul.ziele li.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.ampeln{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:12px}
.ampelbox{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;text-align:center;border-radius:var(--r);padding:10px;background:var(--surface);border:2px solid var(--line)}
.ampelbox.falsch{border-color:var(--bad)}
.ampelbox.spielt{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.ampel{display:inline-flex;flex-direction:column;gap:8px;background:#22252E;border-radius:var(--r);padding:10px}
.lampe-a{width:54px;height:54px;border-radius:50%;border:3px solid #3a3e4a;background:color-mix(in srgb,var(--lc) 22%,#30333d);padding:0;transition:all .15s}
.lampe-a.an{background:var(--lc);box-shadow:0 0 22px var(--lc);border-color:var(--lc)}

/* ===== Entscheidungsbaum ===== */
.baum{overflow-x:auto;padding:10px 2px;margin-top:10px}
.bzweig{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:min-content}
.bkinder{display:flex;gap:12px;justify-content:center;width:100%}
.bkinder>div{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;position:relative;padding-top:4px;border-top:2px solid var(--line)}
.bj{font:800 .75rem var(--sans);text-transform:uppercase;color:var(--good);background:var(--good-soft);border-radius:4px;padding:1px 8px}
.bj.nein{color:var(--bad);background:var(--bad-soft)}
.bk{border-radius:var(--r);padding:8px 12px;font-weight:650;font-size:.875rem;text-align:center;background:var(--surface);border:2px solid var(--line);max-width:190px}
.bk.frage{background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.bk.jetzt{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.bk.weg{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.bk.blatt{background:color-mix(in srgb,var(--good) 10%,var(--surface));display:flex;align-items:center;gap:6px;min-height:42px;font-size:1.125rem}
.bk.blatt.gut{border-color:var(--good)}
.bk.blatt.voll{border-color:var(--bad);background:var(--bad-soft)}
.baum.bauen button.bk{cursor:pointer;min-height:44px}
/* KI */
.kidenk{display:grid;gap:8px;min-height:90px}
.kibalken{display:grid;grid-template-columns:7.5em 1fr 3em;gap:8px;align-items:center;font-weight:650}
.kibalken div{height:16px;border-radius:4px;background:var(--fill2);overflow:hidden}
.kibalken i{display:block;height:100%;background:linear-gradient(90deg,#8E5BD6,#1F44C8);border-radius:4px;transition:width .3s}
.kibalken b{text-align:right;font-variant-numeric:tabular-nums}
.kierk{display:flex;flex-wrap:wrap;gap:6px}
.kibsp{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.kib{display:flex;flex-direction:column;align-items:center;gap:3px;border:2.5px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 6px}
.kico2{font-size:2.25rem;line-height:1}
.mms{display:inline-flex;gap:2px;font-size:.9375rem;min-height:1.2em}
.kib .chip{font-size:.8125rem}
.kib.k-o,.kib.k-a{border-color:#E5383B55}.kib.k-o .chip,.kib.k-a .chip{background:#E5383B1f;color:#B4232A}
.kib.k-g,.kib.k-b{border-color:#2DA44E55}.kib.k-g .chip,.kib.k-b .chip{background:#2DA44E1f;color:#1F7A3A}
.kitests{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px}
.kit{display:flex;gap:10px;align-items:center;border-radius:var(--r);padding:10px 12px;border:2px solid var(--line);background:var(--surface)}
.kit.ok{border-color:var(--good);background:var(--good-soft)}
.kit.no{border-color:var(--bad);background:var(--bad-soft)}
/* Passwort */
.pwmeter{height:16px;border-radius:4px;background:var(--fill2);overflow:hidden;margin:14px 0 8px;max-width:26rem}
.pwmeter i{display:block;height:100%;width:0;border-radius:4px;transition:width .25s,background .25s}
.pwzeit{font-size:1.0625rem;min-height:1.5em}
ul.pwregeln{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
ul.pwregeln li{border-radius:var(--r);padding:8px 12px;background:var(--surface);border:2px solid var(--line);font-weight:600}
ul.pwregeln li.ok{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.hacker{margin-top:14px;border-radius:var(--r);background:#0B0F14;color:#39FF88;padding:16px;font-family:var(--mono);max-width:30rem}
.hzahl{font-size:3rem;font-weight:800;letter-spacing:.2em}
.hzahl.geknackt{color:#FF5C5C}
.hacker .small{color:#9BE7BC}
/* Zahl raten */
.raten{margin-top:12px}
.zstrahl{position:relative;height:64px;border-radius:var(--r);background:var(--fill2);margin:34px 8px 30px}
.zbereich{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 45%,transparent);border-radius:var(--r);transition:all .3s}
.ztipp{position:absolute;top:-26px;transform:translateX(-50%);font:700 .8125rem var(--mono);background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 5px}
.ztipp::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:40px;background:var(--ink);opacity:.5}
.ztipp.ok{background:var(--good);color:#fff}
.zende{position:absolute;bottom:-22px;font-size:.8125rem;color:var(--muted);font-weight:700}
.zende.l{left:0}.zende.r{right:0}
.raten-ein{margin-top:26px;max-width:24rem;flex-wrap:nowrap}
.raten-ein input{font:700 1.5rem var(--mono);text-align:center;min-height:56px;width:100%;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 14px}
/* Waage */
.waage-box{margin-top:10px}
.waage{display:flex;flex-direction:column;align-items:center;margin:70px 0 14px}
.balken-w{width:min(320px,90%);height:10px;background:#8B5A2B;border-radius:6px;display:flex;justify-content:space-between;transition:transform .5s;position:relative}
.waage.links .balken-w{transform:rotate(-9deg)}.waage.rechts .balken-w{transform:rotate(9deg)}
.schale{width:84px;height:54px;margin-top:-54px;border-bottom:6px solid #8B5A2B;border-radius:0 0 40px 40px;display:grid;place-items:end center;font-size:2.25rem;line-height:1.2}
.fuss{color:#8B5A2B;font-size:2rem;line-height:1;margin-top:-4px}
.kisten{display:flex;flex-wrap:wrap;gap:10px}
.kiste{font-size:2.75rem;line-height:1;border:3px solid var(--line);border-radius:var(--r);background:var(--surface);padding:8px 10px;min-width:72px}
.kiste.an{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 6px 16px -6px var(--accent)}
.kiste.weg{opacity:.4}
.kiste.klein{font-size:1.75rem;min-width:52px;padding:4px 6px}
.wlog{display:flex;flex-wrap:wrap;gap:6px}
.wlog span{border-radius:6px;background:var(--fill);padding:4px 10px;font-weight:600;font-size:.9375rem}
.reihe-w{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:62px;border:2px dashed var(--line);border-radius:var(--r);padding:6px 10px}
.reihe-w i{font-style:normal;color:var(--muted);font-weight:800}
.reihe-w.falsch{border-color:var(--bad)}
/* Tausch-Sortieren */
.tausch{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:8px}
.tkarte{display:grid;place-items:center;width:64px;height:80px;border-radius:var(--r);background:var(--surface);border:2.5px solid var(--accent);font:800 1.75rem var(--mono);box-shadow:var(--lift)}
.tkarte.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.tbtn{width:38px;height:44px;border:0;border-radius:6px;background:var(--tint);color:var(--accent);font-size:1.25rem;font-weight:800;padding:0}
@media (max-width:520px){.tkarte{width:48px;height:64px;font-size:1.375rem}.tbtn{width:30px}}
/* Binär-Tabellen, ABC, Zaun, Anleitung */
.abc-tab{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;margin:12px 0;max-width:620px}
.abc-tab span{display:flex;flex-direction:column;align-items:center;border-radius:8px;background:var(--fill);padding:3px 0;font-size:.75rem;color:var(--muted);font-weight:650}
.abc-tab b{font-size:1.0625rem;color:var(--ink)}
@media (max-width:520px){.abc-tab{grid-template-columns:repeat(9,1fr)}}
table.bittab{border-collapse:separate;border-spacing:4px;margin:8px 0;font:700 1.25rem var(--mono);text-align:center}
.bittab th{font:700 .8125rem var(--sans);color:var(--muted);padding:0 6px}
.bittab td{min-width:2.1em;padding:6px 4px;border-radius:8px;background:var(--fill)}
.bittab td.eins{background:#FFF4D6;color:#8A5A00;box-shadow:inset 0 0 0 2px #E2B93B}
.zaun{display:grid;gap:4px;margin:14px 0;width:fit-content;max-width:100%;overflow-x:auto}
.zaun>div{display:grid;grid-template-columns:repeat(var(--n),2.6rem);gap:4px}
.zaun span{height:2.6rem;border-radius:6px;display:grid;place-items:center;font:800 1.375rem var(--mono);background:var(--fill)}
.zaun span.z{background:color-mix(in srgb,#8B5A2B 18%,var(--surface));border:2px solid #8B5A2B}
ol.anleitung{margin:12px 0;padding-left:24px;font-size:1.125rem;display:grid;gap:4px}
.n-text.zeilen{line-height:1.5;display:grid;gap:6px;justify-items:start}
.n-text.zeilen .stelle{display:inline-block;padding:3px 6px}
.crow span{cursor:pointer}
.crow span.an{background:var(--accent)!important;color:var(--accent-ink)!important}
.bstart{display:flex;justify-content:center;gap:6px;font-size:1.75rem;margin-bottom:6px}
.bkarten,.bbits{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:520px){table.bittab{font-size:1rem;border-spacing:3px}.bittab td{min-width:1.6em;padding:5px 2px}.bittab th{padding:0 2px;font-size:.75rem}
  .bkarten{gap:5px}.bwert{font-size:1.1rem}.bpunkte{font-size:.6rem}}
.bittab td.hilf{background:none;padding:0}
.bittab input.mini{width:2.6em;height:2.2em;text-align:center;font:700 1.125rem var(--mono);border:1.5px dashed var(--accent);border-radius:8px;background:var(--surface);color:var(--ink);padding:0;text-transform:uppercase}
.msg.info{background:var(--tint);color:var(--accent)}
/* Touch-Parcours */
.arena.touch,.arena.touch *{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.mz.foto{transform:translate(-50%,-50%);font-size:5rem;background:var(--surface);border:6px solid #fff;border-radius:var(--r);box-shadow:0 10px 30px -10px rgba(0,0,0,.45);padding:6px 14px;transition:transform .25s}
.mz.foto:hover{transform:translate(-50%,-50%)}
.mz.klein{transform:translate(-50%,-50%);font-size:2.25rem;transition:none}
.mz.klein:hover{transform:translate(-50%,-50%)}
.mz.drueckt{animation:druck .65s linear forwards}
@keyframes druck{from{filter:none}to{transform:scale(1.25);filter:drop-shadow(0 0 14px var(--accent))}}
.lmenu{position:absolute;display:grid;min-width:160px;border-radius:var(--r);background:var(--surface);box-shadow:0 12px 30px -8px rgba(0,0,0,.45);overflow:hidden;animation:aufgehen .18s ease-out;z-index:2}
.lmenu span{padding:9px 14px;font-weight:600;border-bottom:1px solid var(--line)}
.lmenu span:last-child{color:var(--bad);border:0}
@keyframes aufgehen{from{transform:scale(.85);opacity:0}}

/* =====================================================================
   Rechenheft – Grundgerüst (überschreibt die älteren Regeln oben)
   ===================================================================== */
body{background-color:var(--bg);background-image:linear-gradient(var(--karo) 1px,transparent 1px),linear-gradient(90deg,var(--karo) 1px,transparent 1px);background-size:22px 22px;font:17px/1.5 var(--sans);font-weight:450}
#app{max-width:52rem;margin:18px auto 40px;padding:22px clamp(16px,4vw,36px) 28px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-l);min-height:60vh}
@media (max-width:560px){#app{margin:0;border:0;border-radius:0;min-height:100vh}}
h1,h2,h3{font-family:var(--sans);letter-spacing:-.015em}
h1{font-size:1.875rem;font-weight:750;line-height:1.15;margin-bottom:10px}
h2{font-size:1.375rem;font-weight:700;margin-bottom:8px}
b,strong{font-weight:700}
.eyebrow{text-transform:none;letter-spacing:0;font-weight:600;font-size:.875rem;color:var(--muted)}
.block{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-m);padding:16px 18px}
.btn{min-height:50px;padding:11px 22px;border-radius:var(--r);border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:none;transition:background .12s,transform .08s}
.btn:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn:active:not(:disabled){transform:translateY(1px);filter:none}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--ink)}
.btn.ghost:hover:not(:disabled){background:var(--fill)}
.btn:disabled{opacity:.4}
.link{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.chip{border-radius:4px;background:var(--fill2);color:var(--ink);font-weight:600;padding:2px 8px}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
input[type=text],input[type=password],select,.uebfeld{border:2px solid var(--ink);border-radius:var(--r)}
input[type=text]:focus,input[type=password]:focus,select:focus,.uebfeld:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--tint)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.msg{border-radius:var(--r);border-left:5px solid currentColor;font-weight:600}
.msg.info{background:var(--tint);color:var(--ink);border-left-color:var(--accent)}
.toast{border-radius:var(--r);background:var(--ink);color:var(--surface);box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* Kopfzeile */
.top{margin:0 0 20px;padding-bottom:12px;border-bottom:1.5px solid var(--line)}
.brand{font-family:var(--sans);font-weight:750;font-size:1.0625rem;gap:9px}
.brand svg{width:26px;height:26px;color:var(--accent)}
.top .who{font-weight:600}

/* „Platte“ ist jetzt nur noch eine Überschriften-Gruppe */
.plate{background:none;color:var(--ink);box-shadow:none;border-radius:0;padding:0;margin:0 0 18px;overflow:visible}
.plate h1,.plate h2{color:var(--ink)} .plate .eyebrow{color:var(--muted)}
.plate .btn{background:var(--accent);color:var(--accent-ink)}
.plate p{max-width:38rem}

/* Merke = Textmarker, Arbeitsauftrag = ruhiger Text */
.aha,.aha.merke{background:none;border:0;border-left:6px solid var(--marker);border-radius:0;padding:2px 0 2px 14px;margin:4px 0 16px;font-size:1rem}
.aha b:first-child{background:linear-gradient(transparent 55%,var(--marker) 55%);padding:0 2px}
.regel{background:none;border:0;border-radius:0;padding:0;font-size:1.125rem;max-width:40rem}
.frage{font-size:1.1875rem;font-weight:700}

/* Station: schmale Zeile, Kästchen-Fortschritt, fester Fuß */
.leiste{display:flex;align-items:center;gap:12px;margin:0 0 12px;font-size:.9375rem;color:var(--muted);font-weight:600}
.leiste .wo{display:flex;align-items:center;gap:8px;color:var(--ink);min-width:0}
.leiste .wo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leiste .pts{margin-left:auto;color:var(--ink);font-weight:700;white-space:nowrap}
.steps{gap:4px;margin:0 0 20px;flex-wrap:wrap}
.steps i{flex:none;width:22px;height:22px;border-radius:3px;background:var(--surface);border:1.5px solid var(--muted)}
.steps i.ok{background:var(--ink);border-color:var(--ink)} .steps i.now{background:var(--surface);border:3px solid var(--accent)}
.steps.springen i{height:22px} .steps.springen i.zu{opacity:.45}
.nav{position:sticky;bottom:0;margin:22px calc(-1*clamp(16px,4vw,36px)) -28px;padding:12px clamp(16px,4vw,36px);background:var(--surface);border-top:1.5px solid var(--line);border-radius:0 0 var(--r-l) var(--r-l);z-index:5}
.btn.pfeil{min-width:8.5rem}
#weiter{min-width:11rem;font-size:1.0625rem}

/* Pixelzeichen der Stationen */
.pix{display:block;flex:none;color:var(--ink)}
.pix.blau{color:var(--accent)}

/* Start */
.gruss{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 18px;color:var(--muted);font-weight:600}
.gruss b{color:var(--ink)}
.heute-karte{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;width:100%;text-align:left;border:2px solid var(--ink);border-radius:var(--r-l);background:var(--surface);padding:20px;margin:0 0 26px}
button.heute-karte:hover{background:var(--fill)}
.heute-karte h2{font-size:1.625rem;margin:2px 0 4px}
.heute-karte p{margin:0}
.heute-karte .btn{pointer-events:none}
@media (max-width:600px){.heute-karte{grid-template-columns:auto 1fr}.heute-karte .btn{grid-column:1/-1}}
.lernpfad{gap:0}
.lernpfad .kap{font-weight:700;color:var(--ink);font-size:1rem;margin:20px 0 4px;padding-bottom:4px;border-bottom:1.5px solid var(--ink)}
.pfad{border-radius:0;background:none;border-bottom:1px solid var(--line);padding:10px 4px;min-height:58px;gap:14px}
.pfad:hover{background:var(--fill)}
.pfad .nr{width:auto;height:auto;border-radius:0;background:none!important;color:var(--muted)!important;font:600 .9375rem var(--mono);min-width:1.6em;text-align:right;display:block}
.pfad.zu,.pfad.morgen{opacity:1;color:var(--muted)} .pfad.zu .pix,.pfad.morgen .pix{opacity:.35}
.pfad.offen{box-shadow:none} .pfad.offen .ptitel b{color:var(--accent)}
.pfad .stand{font-size:.875rem;font-weight:600;color:var(--muted);white-space:nowrap}
.pfad.offen .stand{color:var(--accent)}
.stempel-k{display:grid;place-items:center;width:30px;height:30px;border:2px solid var(--ink);border-radius:3px;font:800 1.125rem/1 var(--sans);transform:rotate(-4deg)}
.spielplatz{margin:0 0 26px}
.spielplatz.zu-hinweis{border:0;padding:0;color:var(--muted);margin-top:22px}
.spiele{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.spiel{flex-direction:row;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px}
.spiel:hover:not(:disabled){border-color:var(--ink)}
.spiel span{font-size:1rem} .spiel small{display:none}

/* Ergebnis: Stempel */
.ergebnis{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;margin:8px 0 22px}
@media (max-width:560px){.ergebnis{grid-template-columns:1fr}}
.stempel{display:grid;place-items:center;gap:0;width:150px;height:150px;border:4px double var(--accent);border-radius:6px;color:var(--accent);transform:rotate(-5deg);text-align:center;font-weight:700;font-size:.8125rem;animation:stempeln .28s cubic-bezier(.2,1.4,.4,1) both;padding:8px}
.stempel .z{font:800 4.5rem/1 var(--sans)}
@keyframes stempeln{from{transform:rotate(-5deg) scale(1.7);opacity:0}}
@media (prefers-reduced-motion: reduce){.stempel{animation:none}}
.result dl{margin:10px 0 0;gap:4px 18px} .result dt{color:var(--muted)} .result dd{font-weight:700}

/* Anmeldung */
.gross{border:2px solid var(--ink);border-radius:var(--r-l);box-shadow:none;font:750 2.25rem/1 var(--sans);color:var(--ink);background:var(--surface)}
.gross:hover{background:var(--fill)}
.tier{border:1.5px solid var(--line);box-shadow:none;border-radius:var(--r)}
.tier:hover:not(:disabled){border-color:var(--ink)}
.tier.zu{opacity:.35}
.vorschlag{border:2px solid var(--ink)}

/* Lehrer */
.tabs button{border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tabs button.an{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.frei-box{border-left-width:6px}

/* Bausteine: ruhiger */
.karte,.wkarte,.antwort{border-width:1.5px;border-color:var(--muted);box-shadow:none;font-weight:600}
.karte.an{box-shadow:0 0 0 3px var(--tint);transform:none}
.topf{border-style:solid;border-width:1.5px;border-color:var(--line);border-top:5px solid var(--tc,var(--ink));background:var(--fill)}
.topf.bereit{border-color:var(--accent);border-top-color:var(--tc,var(--accent))}
.toepfe .topf:nth-child(1){--tc:#1F44C8}.toepfe .topf:nth-child(2){--tc:#C2570C}.toepfe .topf:nth-child(3){--tc:#17783F}.toepfe .topf:nth-child(4){--tc:#8A2BA8}
.topf-kopf{color:var(--ink)!important}
.pnr{border-radius:3px}
.szene,.nachricht,.explorer,.crad,.mission,.kit,.kib,.ampelbox,.rprog{box-shadow:none;border-width:1.5px}
.zst{border-radius:4px} .zst.jetzt{box-shadow:none}
.tippzeile{border-radius:var(--r);border-color:#16203F}
.tippzeile span.jetzt{background:#1F44C8}

<body>
<main id="app"></main>
<script src="vendor/supabase.js"></script>
<script>
/* =====================================================================
   Informatik 5 — eigene Stunden-Seite für Jahrgang 5 (EKG Homberg, GNDO)
   Kinder: Klasse → Tier antippen (beim ersten Mal selbst aussuchen), dann im Lernpfad die nächste Station lösen.
   Lernpfad: Stationen der Reihe nach, höchstens eine neue pro Tag. Wer heute fertig ist, darf auf den Spielplatz.
   Anmelden geht nur während der eigenen Stunde (Stundenplan unten) oder wenn die Lehrkraft von Hand öffnet.
   Lehrkraft (#lehrer): Stände sehen, Vornamen zuordnen (nur lokal), Klassen von Hand öffnen/schließen.
   Neue Stunde = neue Datei in src/stationen/ (siehe README).
   ===================================================================== */
const VERSION="d976d8a3e6";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=q=>document.querySelector(q);
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),2400)}

/* Klassen: hier jedes Schuljahr anpassen */
const KLASSEN=["5B","5D","5E"];
/* So lange öffnet „Jetzt öffnen“ von Hand */
const FREIGABE_MIN=90;

/* Stundenplan Informatik (deutsche Zeit). tag: 1=Mo … 5=Fr. Jedes Schuljahr anpassen.
   Anmelden geht PUFFER Minuten vor Beginn bis zum Ende der Stunde. Speichern geht auch danach noch.
   (Kein Puffer nach dem Ende, sonst überschneiden sich Stunden, die direkt aufeinander folgen.) */
const PUFFER=5;
const STUNDENPLAN=[
  {klasse:"5B",tag:1,von:"09:05",min:60},   // 5B-1 Mo
  {klasse:"5B",tag:3,von:"11:25",min:60},   // 5B-2 Mi
  {klasse:"5D",tag:4,von:"13:40",min:60},   // 5D-1 Do
  {klasse:"5D",tag:3,von:"10:20",min:60},   // 5D-2 Mi
  {klasse:"5E",tag:1,von:"08:00",min:60},   // 5E-1 Mo
  {klasse:"5E",tag:5,von:"10:20",min:60},   // 5E-2 Fr
];
/* Ferien NRW 2026/27 (erster und letzter Ferientag). Bewegliche Ferientage der Schule hier ergänzen. */
const FERIEN=[["2026-12-23","2027-01-06"],["2027-03-22","2027-04-03"],["2027-05-18","2027-05-18"],["2027-07-19","2027-08-31"]];

/* =====================================================================
   Datenschicht. Zwei Modi mit denselben Funktionen:
   - ONLINE (talib47.github.io + Schlüssel eingetragen): Supabase, Kinder nur über RPC-Funktionen.
   - VORSCHAU (sonst): alles in diesem Browser – zum Ausprobieren und solange die Schule noch nicht zugestimmt hat.
   In beiden Modi: KEINE Namen in der Datenbank. Vornamen nur im Browser der Lehrkraft („if5-namen“).
   ===================================================================== */

/* Nach dem Okay der Schule hier eintragen (Supabase → Project Settings → API). Nur der anon-Schlüssel! */
const ONLINE={url:"https://dqopymysowroicfdwwhv.supabase.co",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxb3B5bXlzb3dyb2ljZmR3d2h2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyNTk5NzMsImV4cCI6MjEwOTgzNTk3M30.-0X9oc6t_ezyPQLW-t6u6EWM02ETB8crrlHkb1RpJqs"};

const CLOUD=!!(ONLINE.url&&ONLINE.key&&/github\.io$/.test(location.hostname)&&window.supabase);
const sb=CLOUD?window.supabase.createClient(ONLINE.url,ONLINE.key):null;

/* Tiere: Jedes Kind sucht sich beim ersten Mal ein Tier aus (in der Klasse einmalig) */
/* Tiere: bewusst nur solche, die kein Schimpfwort und keine Angriffsfläche sind (kein Schwein, Hund, Esel, Affe, Schnecke …) */
const TIERE=[["🦊","Fuchs"],["🐼","Panda"],["🦁","Löwe"],["🐯","Tiger"],["🐨","Koala"],["🐧","Pinguin"],["🦉","Eule"],["🦈","Hai"],
  ["🐬","Delfin"],["🦜","Papagei"],["🦅","Adler"],["🐺","Wolf"],["🐻","Bär"],["🦔","Igel"],["🦦","Otter"],["🐆","Leopard"],
  ["🦌","Hirsch"],["🦎","Gecko"],["🐊","Krokodil"],["🦘","Känguru"],["🦖","Dino"],["🐉","Drache"],["🦓","Zebra"],["🐿️","Eichhörnchen"],
  ["🦇","Fledermaus"],["🦢","Schwan"],["🐙","Krake"],["🦂","Skorpion"],["🐴","Pferd"],["🦡","Dachs"],["🦝","Waschbär"],["🦞","Hummer"],["🦀","Krabbe"]];
const tierInfo=n=>{const t=TIERE.find(x=>x[1]===n);return t?{emoji:t[0],name:t[1]}:{emoji:"❓",name:n}};
const WEIBLICH=new Set(["Eule","Krake","Fledermaus","Krabbe"]),SAECHLICH=new Set(["Zebra","Känguru","Eichhörnchen","Krokodil","Pferd"]);
const artikel=n=>WEIBLICH.has(n)?"die":SAECHLICH.has(n)?"das":"der";

/* Gerätekennung (für „besetzt“): bleibt auf dem PC, auch nach dem Abmelden */
const GERAET=(()=>{let g=lsGet("if5-geraet");if(!g){g=Math.random().toString(36).slice(2,12);lsSet("if5-geraet",g)}return g})();

/* ---------- Stundenplan: Ist die Klasse gerade offen? (deutsche Zeit, Sommer-/Winterzeit automatisch) ---------- */
function berlin(ms=Date.now()){
  const p=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Berlin",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",weekday:"short",hourCycle:"h23"})
    .formatToParts(new Date(ms)).map(x=>[x.type,x.value]));
  return{datum:`${p.year}-${p.month}-${p.day}`,tag:{Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6,Sun:7}[p.weekday],min:+p.hour*60+ +p.minute};
}
const hm=s=>{const [h,m]=s.split(":").map(Number);return h*60+m};
function planOffen(klasse,ms=Date.now()){
  const b=berlin(ms);
  if(FERIEN.some(([v,z])=>b.datum>=v&&b.datum<=z))return false;
  return STUNDENPLAN.some(s=>s.klasse===klasse&&s.tag===b.tag&&b.min>=hm(s.von)-PUFFER&&b.min<hm(s.von)+s.min);
}
/* Nächste geplante Stunde (für die Anzeige) */
function naechsteStunde(klasse){
  for(let d=0;d<21;d++){const ms=Date.now()+d*864e5,b=berlin(ms);
    if(FERIEN.some(([v,z])=>b.datum>=v&&b.datum<=z))continue;
    const s=STUNDENPLAN.filter(x=>x.klasse===klasse&&x.tag===b.tag&&(d>0||hm(x.von)+x.min>b.min)).sort((a,c)=>hm(a.von)-hm(c.von))[0];
    if(s)return`${d===0?"heute":d===1?"morgen":new Date(ms).toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"2-digit"})} um ${s.von} Uhr`}
  return null;
}
function offenAus(klasse,fg){const n=Date.now();fg=fg||{};
  if((fg.zu_bis||0)>n)return false;if((fg.offen_bis||0)>n)return true;return planOffen(klasse)}

/* ---------- Vorschau-Datenbank im Browser (bildet die Supabase-Funktionen nach) ---------- */
const MIN75=75*60000;
const vdb={
  lesen(){return lsGet("if5-vdb")||{kinder:[],staende:{},freigaben:{}}},
  schreiben(d){lsSet("if5-vdb",d)},
};
const jetztMs=()=>Date.now();
const vBesetzt=k=>!!(k.token&&jetztMs()-k.aktiv<MIN75);

const db={
  online:CLOUD,

  /* --- Kinder --- */
  async offeneKlassen(){
    if(CLOUD){const {data,error}=await sb.rpc("offene_klassen",{p_klassen:KLASSEN});if(error)throw error;return data||[]}
    const d=vdb.lesen();return KLASSEN.filter(k=>offenAus(k,d.freigaben[k]));
  },
  async tiere(klasse){
    if(CLOUD){const {data,error}=await sb.rpc("kind_tiere",{p_klasse:klasse});if(error)throw error;return data}
    const d=vdb.lesen();
    return{offen:offenAus(klasse,d.freigaben[klasse]),
      liste:d.kinder.filter(k=>k.klasse===klasse).map(k=>({tier:k.tier,besetzt:vBesetzt(k)&&k.geraet!==GERAET}))};
  },
  async neu(klasse,tier){
    if(CLOUD){const {data,error}=await sb.rpc("kind_neu",{p_klasse:klasse,p_tier:tier,p_geraet:GERAET});if(error)throw error;return data}
    const d=vdb.lesen();
    if(!offenAus(klasse,d.freigaben[klasse]))return{fehler:"zu"};
    if(d.kinder.some(x=>x.klasse===klasse&&x.tier===tier))return{fehler:"vergeben"};
    const k={id:Math.random().toString(36).slice(2,12),klasse,tier,token:Math.random().toString(36).slice(2),geraet:GERAET,aktiv:jetztMs(),erstellt:jetztMs()};
    d.kinder.push(k);vdb.schreiben(d);return{token:k.token,staende:{}};
  },
  async anmelden(klasse,tier){
    if(CLOUD){const {data,error}=await sb.rpc("kind_anmelden",{p_klasse:klasse,p_tier:tier,p_geraet:GERAET});if(error)throw error;return data}
    const d=vdb.lesen();
    if(!offenAus(klasse,d.freigaben[klasse]))return{fehler:"zu"};
    const k=d.kinder.find(x=>x.klasse===klasse&&x.tier===tier);
    if(!k)return{fehler:"unbekannt"};
    if(vBesetzt(k)&&k.geraet!==GERAET)return{fehler:"besetzt"};
    k.token=Math.random().toString(36).slice(2);k.geraet=GERAET;k.aktiv=jetztMs();vdb.schreiben(d);
    return{token:k.token,staende:d.staende[k.id]||{}};
  },
  async speichern(token,station,prog){
    if(CLOUD){const {data,error}=await sb.rpc("kind_speichern",{p_token:token,p_station:station,p_prog:prog});if(error)throw error;return data}
    const d=vdb.lesen();const k=d.kinder.find(x=>x.token===token);if(!k)return false;
    (d.staende[k.id]=d.staende[k.id]||{})[station]=prog;k.aktiv=jetztMs();vdb.schreiben(d);return true;
  },
  async abmelden(token){
    if(CLOUD){await sb.rpc("kind_abmelden",{p_token:token});return}
    const d=vdb.lesen();const k=d.kinder.find(x=>x.token===token);if(k){k.token=null;k.geraet=null;vdb.schreiben(d)}
  },

  /* --- Lehrkraft --- */
  async lSitzung(){if(!CLOUD)return true;const {data}=await sb.auth.getSession();return!!data.session},
  async lAnmelden(email,pw){const {error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error;
    /* Aus dem Passwort entsteht ein Schlüssel, der nur in diesem Browser bleibt. Damit wird die Namensliste verschlüsselt,
       bevor sie zum Server geht: Dort liegt nur Zeichensalat, den ohne das Passwort niemand lesen kann. */
    try{const enc=new TextEncoder(),roh=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
      const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode("if5:"+email.toLowerCase()),iterations:250000,hash:"SHA-256"},roh,256);
      localStorage.setItem("if5-schluessel",btoa(String.fromCharCode(...new Uint8Array(bits))))}catch(e){}},
  hatSchluessel(){return!!localStorage.getItem("if5-schluessel")},
  async _key(){const b=localStorage.getItem("if5-schluessel");if(!b)return null;
    return crypto.subtle.importKey("raw",Uint8Array.from(atob(b),c=>c.charCodeAt(0)),"AES-GCM",false,["encrypt","decrypt"])},
  /* Verschlüsselte Namensliste der Lehrkraft holen / sichern (nur online) */
  async lGeheimLaden(){
    if(!CLOUD)return null;const key=await this._key();if(!key)return null;
    const {data,error}=await sb.from("lehrer_daten").select("inhalt").maybeSingle();if(error)throw error;if(!data)return null;
    const roh=Uint8Array.from(atob(data.inhalt),c=>c.charCodeAt(0));
    const klar=await crypto.subtle.decrypt({name:"AES-GCM",iv:roh.slice(0,12)},key,roh.slice(12));
    return JSON.parse(new TextDecoder().decode(klar));
  },
  /* Einmalige Übergabe: vorbereitete Namen-Zuordnung abholen; sie wird danach verschlüsselt gesichert und hier gelöscht */
  async lUebergabeHolen(){if(!CLOUD)return null;const {data,error}=await sb.from("lehrer_uebergabe").select("inhalt").maybeSingle();if(error)throw error;return data?data.inhalt:null},
  async lUebergabeLoeschen(){if(CLOUD)await sb.from("lehrer_uebergabe").delete().eq("id",1)},
  async lGeheimSpeichern(obj){
    if(!CLOUD)return false;const key=await this._key();if(!key)return false;
    const {data:u}=await sb.auth.getUser();if(!u?.user)return false;
    const iv=crypto.getRandomValues(new Uint8Array(12)),geh=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj))));
    const alles=new Uint8Array(12+geh.length);alles.set(iv);alles.set(geh,12);let s="";alles.forEach(b=>s+=String.fromCharCode(b));
    const {error}=await sb.from("lehrer_daten").upsert({user_id:u.user.id,inhalt:btoa(s),geaendert:new Date().toISOString()});if(error)throw error;return true;
  },
  async lAbmelden(){if(CLOUD)await sb.auth.signOut();localStorage.removeItem("if5-schluessel")},
  /* Stundenplan und Ferien aus src/app.js zum Server bringen (beim Öffnen der Lehrer-Ansicht) */
  async lPlanUebertragen(){
    if(!CLOUD)return;
    const r1=await sb.from("stundenplan").delete().neq("tag",-1);if(r1.error)throw r1.error;
    const r2=await sb.from("stundenplan").insert(STUNDENPLAN.map(s=>({klasse:s.klasse,tag:s.tag,von:s.von,min:s.min,puffer:PUFFER})));if(r2.error)throw r2.error;
    const r3=await sb.from("ferien").delete().gte("von","1900-01-01");if(r3.error)throw r3.error;
    const r4=await sb.from("ferien").insert(FERIEN.map(([von,bis])=>({von,bis})));if(r4.error)throw r4.error;
  },
  async lAlles(){
    if(CLOUD){
      const [k,s,f,a]=await Promise.all([sb.from("kinder").select("*").order("erstellt"),sb.from("staende").select("kind_id,station,prog"),sb.from("freigaben").select("*"),sb.from("abschluesse").select("*").order("fertig_am")]);
      for(const r of [k,s,f])if(r.error)throw r.error;
      const staende={};s.data.forEach(r=>{(staende[r.kind_id]=staende[r.kind_id]||{})[r.station]=r.prog});
      const freigaben={};f.data.forEach(r=>freigaben[r.klasse]={offen_bis:r.offen_bis?new Date(r.offen_bis).getTime():0,zu_bis:r.zu_bis?new Date(r.zu_bis).getTime():0});
      return{kinder:k.data.map(r=>({id:r.id,klasse:r.klasse,tier:r.tier,
        besetzt:!!(r.token&&Date.now()-new Date(r.aktiv_seit).getTime()<MIN75),aktiv:r.aktiv_seit?new Date(r.aktiv_seit).getTime():0})),staende,freigaben,abschluesse:a.error?[]:a.data};
    }
    const d=vdb.lesen();
    return{kinder:d.kinder.map(k=>({...k,besetzt:vBesetzt(k)})),staende:d.staende,freigaben:d.freigaben};
  },
  /* Die Lehrkraft legt die Kinder an (Tier zuteilen); Kinder können sich nicht selbst neu anlegen */
  async lKindAnlegen(klasse,tier){
    if(CLOUD){const {data,error}=await sb.from("kinder").insert({klasse,tier}).select("id").single();if(error)throw error;return data.id}
    const d=vdb.lesen();const k={id:Math.random().toString(36).slice(2,12),klasse,tier,token:null,geraet:null,aktiv:0,erstellt:jetztMs()};
    d.kinder.push(k);vdb.schreiben(d);return k.id;
  },
  async lAbmeldenKind(id){
    if(CLOUD){const {error}=await sb.from("kinder").update({token:null,geraet:null}).eq("id",id);if(error)throw error;return}
    const d=vdb.lesen();const k=d.kinder.find(x=>x.id===id);if(k){k.token=null;k.geraet=null;vdb.schreiben(d)}
  },
  async lStandLoeschen(id,station){

/* Alle Stationen tragen sich selbst hier ein (Dateien in src/stationen/) */
const STATIONEN=[];

/* Kapitel des Lernpfads (Reihenfolge = Reihenfolge im Schuljahr) */
const KAPITEL_NAME={fit:"Fit am Computer",netz:"Sicher im Netz",daten:"Daten und Codes",algo:"Algorithmen",ki:"Automaten und KI",ich:"Ich und meine Daten"};
const KAPITEL={fit:"🖥️ Fit am Computer",netz:"🛡️ Sicher im Netz",daten:"🔢 Daten & Codes",algo:"🤖 Algorithmen",ki:"🧠 Automaten & KI",ich:"👣 Ich & meine Daten"};
/* Höchstens eine NEUE Station pro Tag (sonst laufen schnelle Kinder der Klasse weit davon) */
const EINE_PRO_TAG=true;
/* Ränge nach gesammelten Sternen (= Punkte aller Stationen) */
const RAENGE=[[0,"🌱","Neuling"],[150,"🖱️","Klick-Kenner"],[400,"💾","Daten-Detektiv"],[750,"🔐","Code-Knacker"],[1100,"🤖","Robo-Meister"],[1500,"🧠","Informatik-Ass"],[1900,"🏆","Informatik-Legende"]];

/* Bewertung wie im Notenbuch: + / o / − aus den Prozent der Punkte (Grenzen hier anpassen) */
const PLUS_AB=75,O_AB=40;
const zeichenAus=p=>p>=PLUS_AB?"+":p>=O_AB?"o":"−";
const ZEICHEN_TEXT={"+":"Stark gearbeitet","o":"Ordentlich, da geht mehr","−":"Das war zu wenig"};
const zeichenKlasse=z=>z==="+"?"good":z==="o"?"":"bad";
const zeit=ms=>{const m=Math.round((ms||0)/60000);return m<1?"unter 1 Min.":m+" Min."};
const maxPunkte=st=>st.schritte.reduce((a,s)=>a+(s.punkte||0),0);
const summe=prog=>Object.values(prog?.punkte||{}).reduce((a,b)=>a+b,0);
const prozent=(st,prog)=>{const m=maxPunkte(st);return m?Math.round(summe(prog)/m*100):100};
const ABZEICHEN={"+":"🥇","o":"🥈","−":"🥉"};
const heuteTag=()=>new Date().toDateString(),tagVon=ms=>new Date(ms).toDateString();
const PFAD=()=>STATIONEN.filter(s=>!s.spiel),SPIELE=()=>STATIONEN.filter(s=>s.spiel);
const sterne=()=>PFAD().reduce((a,s)=>a+summe(meineStaende()[s.id]),0);
const rang=n=>{let r=RAENGE[0];for(const x of RAENGE)if(n>=x[0])r=x;return r};
const naechsterRang=n=>RAENGE.find(x=>x[0]>n);
/* Status einer Station im Lernpfad: fertig | offen | zu (vorherige fehlt) | morgen (heute schon eine geschafft) */
function status(st){
  const s=meineStaende(),p=s[st.id];
  if(p?.fertig)return"fertig";
  if(VS||st.spiel)return"offen";
  const pfad=PFAD(),i=pfad.indexOf(st);if(i<=0)return"offen";
  const vor=s[pfad[i-1].id];
  if(!vor?.fertig)return"zu";
  if(p)return"offen";
  if(EINE_PRO_TAG&&tagVon(vor.fertig)===heuteTag())return"morgen";
  return"offen";
}
/* Der Spielplatz ist die Belohnung für gute Arbeit: Er öffnet nur, wenn die Station von heute ein + hat (Schnell-Durchklicken lohnt sich nicht). */
const heuteFertig=()=>PFAD().filter(s=>{const p=meineStaende()[s.id];return p?.fertig&&tagVon(p.fertig)===heuteTag()});
const spielplatzOffen=()=>VS||heuteFertig().some(s=>zeichenAus(prozent(s,meineStaende()[s.id]))==="+");
/* Aufräumen beim Verlassen eines Teils (z. B. Tastatur-Abhörer, Zeitgeber) */

async function hochladen(){
  if(!sitzung)return;

    try{const ok=await db.speichern(sitzung.token,id,staende[id]);

  }

  const alt=lsGet("if5-ungesendet")||[];const rest=alt.filter(x=>!(x.klasse===sitzung.klasse&&x.tier===sitzung.tier));
  rest.push({klasse:sitzung.klasse,tier:sitzung.tier,staende:s,zeit:Date.now()});lsSet("if5-ungesendet",rest.slice(-12))}
const weiterAls=(a,b)=>!b||(!!a.fertig&&!b.fertig)||Object.keys(a.punkte||{}).length>Object.keys(b.punkte||{}).length;

function anmeldeErgebnis(klasse,tier,r,nochmal){
  const t=tierInfo(tier);

    /* Liegt auf diesem PC noch ein nicht gesendeter Stand von diesem Tier? Dann jetzt nachreichen. */
    const un=(lsGet("if5-ungesendet")||[]).find(x=>x.klasse===klasse&&x.tier===tier);
    if(un){Object.entries(un.staende).forEach(([id,p])=>{if(weiterAls(p,staende[id])){staende[id]=p;pushWarte.add(id)}});
      lsSet("if5-ungesendet",(lsGet("if5-ungesendet")||[]).filter(x=>x!==un&&!(x.klasse===klasse&&x.tier===tier)));setTimeout(hochladen,500)}

  const spielplatz=VS?`<h2 style="margin:28px 0 6px">Spielplatz</h2><p class="muted">Bonus-Spiele ohne Note. Kinder sehen sie erst, wenn die Station von heute geschafft ist.</p><div class="spielplatz">${spielListe}</div>`
    :spOffen?`<div class="spielplatz"><h2>Spielplatz</h2><p class="muted">Deine Belohnung für heute. Hier gibt es keine Note.</p>${spielListe}</div>`:"";
  let kap="";

    return`${kopf}<li><button class="pfad ${stt}" data-id="${x.id}"><span class="nr">${i+1}</span>${pix(x.id,28)}<span class="ptitel"><b>${esc(x.titel)}</b><small>${esc(x.kurz)}</small></span>${rechts}</button></li>`}).join("");

    :`<div class="gruss"><span>Hallo <b>${ich()}</b></span><span><b>${n}</b> Punkte, <b>${fertig}</b> von ${pfad.length} Stationen, Rang <b>${rName}</b></span></div>`}
