/* Station 3 · Ordnung im Computer – Dateien, Endungen, Ordner, Pfade, Suche
   Rahmen: Der Trainer der U11 vom FC Ruhrwiese hat einen neuen Laptop. Alles liegt durcheinander. Das Kind räumt für ihn auf.
   (Nov. 2026 neu gebaut. Ab jetzt neue Teile nur noch hinten anhängen, sobald Kinder an der Station arbeiten.) */
{
const VEREIN={"Bilder":{"Verein":{"Sammelkarten":{"Saison 2026":{},"Saison 2025":{}},"Mannschaftsfoto":{}},"Privat":{}},
  "Dokumente":{"Verein":{"Aufstellungen":{},"Training":{},"Turniere":{}},"Privat":{}},
  "Musik":{"Kabine":{}},"Videos":{"Verein":{"Tore":{},"Training":{}},"Privat":{}}};

/* Nachricht vom Trainer: ruhige Sprechblase, keine Farbe nötig */
const ORD=sym("ordner",22);
const vomTrainer=t=>nachricht("Nachricht vom Trainer","ball",t);

/* ---------- Endungs-Probe: Endung ändern, „Öffnen“ drücken, sehen was passiert ----------
   Das Kind entdeckt selbst: Die Endung entscheidet, welches Programm die Datei öffnet. Der Inhalt bleibt gleich.
   Falsches Öffnen ist Ausprobieren und kostet nichts. Nur eine falsche Antwort auf die Frage kostet Punkte. */
const ENDUNG={".mp4":[dico("a.mp4",40),"Video-Player"],".jpg":[dico("a.jpg",40),"Fotos"],".mp3":[dico("a.mp3",40),"Musik-Player"],".docx":[dico("a.docx",40),"Word"]};
const INHALT={".mp4":"Das Video läuft: der Fallrückzieher.",".docx":"Die Aufstellung für Samstag ist offen.",".mp3":"Das Lied läuft: der Torjubel aus der Kabine."};
function endungProbe({titel,punkte=15,merke,text,runden,art="Ausprobieren"}){return{titel,punkte,merke,art,zeige(el,ctx){
  const d=ctx.daten;d.r=d.r||0;
  const zeichne=()=>{
    if(d.r>=runden.length){el.innerHTML=kopfText(text)+`<div class="msg ok">Alle ${runden.length} Dateien gehen wieder auf. Tippe auf „Weiter“.</div>`;return}
    const R=runden[d.r];if(!d.e)d.e=R.start;d.probiert=d.probiert||[];
    const [ico,prog]=ENDUNG[d.e];
    const frage=d.offen&&R.frage;if(frage&&(!d.opt||d.opt.length!==R.falsch.length+1))d.opt=mischen([R.richtig,...R.falsch]);
    el.innerHTML=kopfText(text)+`<p class="eyebrow" style="margin-top:12px">Datei ${d.r+1} von ${runden.length}</p>
      <p class="frage">${R.auftrag}</p>
      <div class="probe"><div class="probe-datei"><span class="pd-ico">${ico}</span><span class="pd-name">${esc(R.name)}<b>${d.e}</b></span><span class="muted small">öffnet mit: ${prog}</span></div>
        <div class="probe-endungen" role="group" aria-label="Endung wählen">${Object.keys(ENDUNG).map(x=>`<button class="karte${x===d.e?" an":""}" data-e="${x}">${x}</button>`).join("")}</div>
        <button class="btn" id="oeffnen" ${d.offen?"disabled":""}>Öffnen</button></div>
      <div id="fenster">${d.zuletzt?fenster(d.zuletzt):""}</div>
      ${frage?`<p class="frage" style="margin-top:18px">${R.frage}</p><div class="antworten">${d.opt.map((o,i)=>`<button class="antwort" data-o="${i}">${o}</button>`).join("")}</div>`:""}${MLD}`;
    el.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{if(d.offen)return;d.e=b.dataset.e;d.zuletzt=null;ctx.speichern();zeichne()});
    el.querySelector("#oeffnen").onclick=()=>{if(!d.probiert.includes(d.e))d.probiert.push(d.e);
      const ok=d.e===R.echt;d.zuletzt={ok,e:d.e,echt:R.echt};
      if(ok){d.offen=true;if(!R.frage)return weiterRunde(`Richtig: Mit <b>${R.echt}</b> geht die Datei auf.`)}
      ctx.speichern();zeichne()};
    el.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
      if(d.opt[+b.dataset.o]===R.richtig)weiterRunde("Genau. Hier kommt die nächste Datei.");
      else{ctx.fehler();b.classList.add("falsch");b.disabled=true;meldung(el,false,"Schau noch mal: Was war bei jedem Öffnen anders, was blieb gleich?")}});
  };
  const fenster=z=>{const [ico,prog]=ENDUNG[z.e];
    const k=dico("a"+z.e,20);return z.ok?`<div class="fenster ok"><div class="f-kopf">${k} ${prog}</div><p>${INHALT[z.echt]}</p></div>`
      :`<div class="fenster"><div class="f-kopf">${k} ${prog}</div><p><b>Fehler:</b> ${prog} kann diese Datei nicht öffnen.</p></div>`};
  const weiterRunde=t=>{d.r++;d.e=null;d.offen=false;d.zuletzt=null;d.opt=null;d.probiert=[];ctx.speichern();zeichne();
    if(d.r>=runden.length)ctx.geschafft(punkte);else meldung(el,true,t)};
  zeichne();
  ctx.pruefer=()=>{if(d.r>=runden.length){ctx.geschafft(punkte);return true}
    meldung(el,false,d.offen?"Beantworte zuerst die Frage.":"Bring zuerst die Datei zum Laufen: Endung wählen, dann „Öffnen“.");return false};
  ctx.loesung=()=>{d.r=runden.length;zeichne()};
}}}

/* ---------- Datei-Suche: Suchfeld über alle Dateien des Trainers, Fragen beantworten ---------- */
const DATEIEN=["fallrueckzieher.mp4","freistoss-tor.mp4","elfmeter-finale.mp4","training-dribbeln.mp4","mannschaftsfoto-2026.jpg","torwart-nr1.jpg","sammelkarte-nr7.jpg","sammelkarte-nr10.jpg",
  "aufstellung-samstag.docx","aufstellung-pokal.docx","training-plan-november.docx","training-uebungen.pdf","turnier-mai.pdf","elternbrief-trikots.pdf","torjubel.mp3","kabinen-playlist.mp3","Neues Dokument (3).docx","bild.jpg"];
function dateiSuche({titel,punkte=15,merke,text,fragen,art="Ausprobieren"}){return{titel,punkte,merke,art,zeige(el,ctx){
  const d=ctx.daten;d.r=d.r||0;d.s=d.s||"";
  const zeichne=(fokus)=>{
    if(d.r>=fragen.length){el.innerHTML=kopfText(text)+`<div class="msg ok">Alle ${fragen.length} Fragen gelöst. Tippe auf „Weiter“.</div>`;return}
    const F=fragen[d.r],q=d.s.trim().toLowerCase(),treffer=q?DATEIEN.filter(x=>x.toLowerCase().includes(q)):DATEIEN;
    el.innerHTML=kopfText(text)+`<p class="eyebrow" style="margin-top:12px">Frage ${d.r+1} von ${fragen.length}</p><p class="frage">${F.frage}</p>
      <div class="explorer"><div class="ex-leiste">${sym("lupe",24)}<input type="text" id="such" placeholder="Suchen" autocomplete="off" spellcheck="false" value="${esc(d.s)}" aria-label="Dateien durchsuchen"></div>
        <p class="muted small" style="margin:8px 12px 0">${q?`${treffer.length} ${treffer.length===1?"Treffer":"Treffer"}`:`Alle ${DATEIEN.length} Dateien`}</p>
        <ul class="treffer">${treffer.map(x=>`<li>${dico(x,20)} ${x}</li>`).join("")||`<li class="muted">Nichts gefunden. Probier ein kürzeres Wort.</li>`}</ul></div>
      <div class="eing" style="margin-top:14px"><input type="text" id="antw" ${F.zahl?'inputmode="numeric"':""} placeholder="${F.platz||"Deine Antwort"}" autocomplete="off" spellcheck="false" value="${esc(d.a||"")}"></div>${MLD}`;
    const s=el.querySelector("#such"),a=el.querySelector("#antw");
    s.oninput=()=>{d.s=s.value;ctx.speichern();zeichne("such")};
    a.oninput=()=>{d.a=a.value;ctx.speichern()};
    a.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();document.getElementById("weiter")?.click()}};
    if(fokus==="such"){s.focus();s.setSelectionRange(s.value.length,s.value.length)}
  };
  zeichne();
  const norm=v=>String(v||"").trim().toLowerCase().replace(/\s+/g," ");
  ctx.pruefer=()=>{if(d.r>=fragen.length){ctx.geschafft(punkte);return true}
    const F=fragen[d.r],v=norm(d.a);
    if(!v){meldung(el,false,"Schreib zuerst deine Antwort ins untere Feld.");return false}
    if(F.antwort.map(norm).includes(v)){d.r++;d.a="";d.s="";ctx.speichern();
      if(d.r>=fragen.length){zeichne();ctx.geschafft(punkte);return true}
      zeichne();meldung(el,true,"Richtig. Hier kommt die nächste Frage.");return false}
    if(d.falsch!==v){ctx.fehler();d.falsch=v;ctx.speichern()}
    meldung(el,false,F.tipp||"Schau genau in die Trefferliste.");return false};
  ctx.loesung=()=>{d.r=fragen.length;zeichne()};
}}}

/* ---------- Datei-Detektiv: Liste nach Name, Datum oder Größe sortieren, dann die gesuchte Datei antippen ---------- */
function dateiListe({titel,punkte=15,merke,text,dateien,fragen,art="Ausprobieren"}){return{titel,punkte,merke,art,zeige(el,ctx){
  const d=ctx.daten;d.r=d.r||0;d.sp=d.sp||0;d.ab=!!d.ab;
  const SP=["Name","Geändert am","Größe"],wert=[x=>x[0],x=>x[2],x=>x[4]];
  const zeichne=()=>{
    if(d.r>=fragen.length){el.innerHTML=kopfText(text)+`<div class="msg ok">Alle ${fragen.length} Dateien gefunden. Tippe auf „Weiter“.</div>`;return}
    const F=fragen[d.r],liste=dateien.slice().sort((a,b)=>{const x=wert[d.sp](a),y=wert[d.sp](b);return(x<y?-1:x>y?1:0)*(d.ab?-1:1)});
    el.innerHTML=kopfText(text)+`<p class="eyebrow" style="margin-top:12px">Frage ${d.r+1} von ${fragen.length}</p><p class="frage">${F.frage}</p>
      <div class="explorer"><table class="liste dliste"><thead><tr>${SP.map((n,k)=>`<th><button class="sortk${d.sp===k?" an":""}" data-sk="${k}">${n} ${d.sp===k?(d.ab?"▼":"▲"):""}</button></th>`).join("")}</tr></thead>
        <tbody>${liste.map(x=>`<tr><td><button class="dzeile" data-n="${esc(x[0])}">${dico(x[0],20)} ${esc(x[0])}</button></td><td>${x[1]}</td><td class="r">${x[3]}</td></tr>`).join("")}</tbody></table></div>${MLD}`;
    el.querySelectorAll("[data-sk]").forEach(b=>b.onclick=()=>{const k=+b.dataset.sk;if(d.sp===k)d.ab=!d.ab;else{d.sp=k;d.ab=false}ctx.speichern();zeichne()});
    el.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{
      if(b.dataset.n===F.antwort){d.r++;ctx.speichern();zeichne();if(d.r>=fragen.length)ctx.geschafft(punkte);else meldung(el,true,"Richtig. Hier kommt die nächste Frage.")}
      else{ctx.fehler();b.classList.add("falsch");meldung(el,false,F.tipp||"Das ist sie nicht. Tippe oben auf eine Spalte. Dann sortiert der Computer für dich.")}});
  };
  zeichne();
  ctx.pruefer=()=>{if(d.r>=fragen.length){ctx.geschafft(punkte);return true}meldung(el,false,"Tippe in der Liste auf die gesuchte Datei.");return false};
  ctx.loesung=()=>{d.r=fragen.length;zeichne()};
}}}

/* ---------- Namen geben: Das Kind erfindet selbst einen guten Dateinamen. Geprüft wird: Stichwort drin? Endung richtig? ---------- */
function namenGeben({titel,punkte=15,merke,text,runden,art="Selbst schreiben"}){return{titel,punkte,merke,art,zeige(el,ctx){
  const d=ctx.daten;d.r=d.r||0;
  const pruef=(R,v)=>{v=v.trim().toLowerCase();return[[v.includes(R.wort),`Das Wort „${R.wort}“ kommt vor.`],[v.endsWith(R.endung)&&v.length>R.endung.length,"Die Endung passt zur Datei."]]};
  const zeichne=()=>{
    if(d.r>=runden.length){el.innerHTML=kopfText(text)+`<div class="msg ok">Alle ${runden.length} Dateien haben einen guten Namen. Tippe auf „Weiter“.</div>`;return}
    const R=runden[d.r];
    el.innerHTML=kopfText(text)+`<p class="eyebrow" style="margin-top:12px">Datei ${d.r+1} von ${runden.length}</p>
      <div class="szene"><span class="sz-bild">${R.bild}</span><div class="sz-text">${R.was}</div></div>
      <p class="frage">${R.auftrag}</p>
      <div class="eing"><input type="text" id="nn" placeholder="Dateiname" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="50" value="${esc(d.v||"")}"></div>
      <ul class="regeln" id="rg"></ul>${MLD}`;
    const inp=el.querySelector("#nn"),rg=el.querySelector("#rg");
    const zeig=()=>{rg.innerHTML=d.geprueft?pruef(R,inp.value).map(([ok,t])=>`<li class="${ok?"ok":"no"}">${ok?"✓":"✗"} ${ok?t:t.replace("kommt vor","fehlt noch").replace("passt zur Datei","fehlt oder passt nicht")}</li>`).join(""):""};
    inp.oninput=()=>{d.v=inp.value;ctx.speichern()};
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();document.getElementById("weiter")?.click()}};
    zeig();
  };
  zeichne();
  ctx.pruefer=()=>{if(d.r>=runden.length){ctx.geschafft(punkte);return true}
    const R=runden[d.r],v=(d.v||"").trim();
    if(!v){meldung(el,false,"Schreib zuerst einen Namen ins Feld.");return false}
    const erg=pruef(R,v);
    if(erg.every(x=>x[0])){d.r++;d.v="";d.geprueft=false;ctx.speichern();
      if(d.r>=runden.length){zeichne();ctx.geschafft(punkte);return true}
      zeichne();meldung(el,true,`Guter Name: <b>${esc(v)}</b>. Hier kommt die nächste Datei.`);return false}
    if(d.falsch!==v.toLowerCase()){ctx.fehler();d.falsch=v.toLowerCase()}
    d.geprueft=true;ctx.speichern();zeichne();meldung(el,false,"Noch nicht ganz. Schau auf die Liste unter dem Feld.");return false};
  ctx.loesung=()=>{d.r=runden.length;zeichne()};
}}}

/* ---------- Kopier-Probe: Dateien zwischen Laptop, USB-Stick und Papierkorb bewegen. Ausprobieren kostet nichts. ---------- */
function kopierProbe({titel,punkte=20,merke,text,start,missionen,art="Ausprobieren"}){return{titel,punkte,merke,art,zeige(el,ctx){
  const d=ctx.daten;d.r=d.r||0;if(!d.o)d.o=JSON.parse(JSON.stringify(start));d.o.korb=d.o.korb||[];
  const ORT={laptop:[sym("laptop",22),"Laptop"],stick:[sym("stick",22),"USB-Stick"],korb:[sym("korb",22),"Papierkorb"]};
  let wahl=null;   // {ort, n}
  const hat=(ort,n)=>ort==="korb"?d.o.korb.some(x=>x.n===n):d.o[ort].includes(n);
  const zeichne=()=>{
    if(d.r>=missionen.length){el.innerHTML=kopfText(text)+`<div class="msg ok">Alle ${missionen.length} Aufträge erledigt. Tippe auf „Weiter“.</div>`;return}
    const M=missionen[d.r],frage=d.erledigt&&M.frage;

    const anderer=wahl&&wahl.ort!=="korb"?(wahl.ort==="laptop"?"stick":"laptop"):null;
    const kasten=ort=>{const liste=ort==="korb"?d.o.korb.map(x=>x.n):d.o[ort];
      return`<div class="kp-ort"><div class="kp-kopf">${ORT[ort][0]} ${ORT[ort][1]}</div>${liste.map(n=>`<button class="karte${wahl&&wahl.ort===ort&&wahl.n===n?" an":""}" data-ort="${ort}" data-n="${esc(n)}" ${d.erledigt?"disabled":""}>${dico(n,20)}<span>${esc(n)}</span></button>`).join("")||`<p class="muted small" style="margin:0">leer</p>`}</div>`};
    el.innerHTML=kopfText(text)+`<p class="eyebrow" style="margin-top:12px">Auftrag ${d.r+1} von ${missionen.length}</p><p class="frage">${M.auftrag}</p>
      <div class="kp">${kasten("laptop")}${kasten("stick")}${kasten("korb")}</div>
      ${d.erledigt?"":`<div class="kp-knoepfe"><span class="muted small">${wahl?`Ausgewählt: <b>${esc(wahl.n)}</b>`:"Tippe zuerst eine Datei an."}</span>
        ${wahl&&wahl.ort==="korb"?`<button class="btn" data-a="zurueck">Wiederherstellen</button>`
          :`<button class="btn" data-a="kopie" ${wahl?"":"disabled"}>Kopieren${anderer?` auf ${ORT[anderer][1]}`:""}</button><button class="btn" data-a="schieb" ${wahl?"":"disabled"}>Verschieben${anderer?` auf ${ORT[anderer][1]}`:""}</button><button class="btn ghost" data-a="weg" ${wahl?"":"disabled"}>Löschen</button>`}</div>`}
      ${frage?`<p class="frage" style="margin-top:18px">${M.frage}</p><div class="antworten">${d.opt.map((o,i)=>`<button class="antwort" data-o="${i}">${o}</button>`).join("")}</div>`:""}${MLD}`;
    el.querySelectorAll("[data-ort]").forEach(b=>b.onclick=()=>{const w={ort:b.dataset.ort,n:b.dataset.n};wahl=wahl&&wahl.ort===w.ort&&wahl.n===w.n?null:w;zeichne()});
    el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{if(!wahl)return;const {ort,n}=wahl,a=b.dataset.a,ziel=ort==="laptop"?"stick":"laptop";
      if(a==="zurueck"){const x=d.o.korb.find(y=>y.n===n);d.o.korb=d.o.korb.filter(y=>y!==x);if(!d.o[x.von].includes(n))d.o[x.von].push(n)}
      else if(a==="weg"){d.o[ort]=d.o[ort].filter(y=>y!==n);d.o.korb.push({n,von:ort})}
      else{if(!d.o[ziel].includes(n))d.o[ziel].push(n);if(a==="schieb")d.o[ort]=d.o[ort].filter(y=>y!==n)}
      wahl=null;
      if(M.test(hat)){if(M.frage){d.erledigt=true;ctx.speichern();zeichne();meldung(el,true,"Auftrag erledigt. Beantworte noch die Frage.")}else naechste("Auftrag erledigt.")}
      else{ctx.speichern();zeichne()}});
    el.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
      if(d.opt[+b.dataset.o]===M.richtig)naechste("Richtig.");
      else{ctx.fehler();b.classList.add("falsch");b.disabled=true;meldung(el,false,"Zähl oben nach: In welchen Kästen liegt die Datei?")}});
  };
  const naechste=t=>{d.r++;d.erledigt=false;d.opt=null;ctx.speichern();zeichne();
    if(d.r>=missionen.length)ctx.geschafft(punkte);else meldung(el,true,t+" Hier kommt der nächste Auftrag.")};
  zeichne();
  ctx.pruefer=()=>{if(d.r>=missionen.length){ctx.geschafft(punkte);return true}
    meldung(el,false,d.erledigt?"Beantworte zuerst die Frage.":"Erledige zuerst den Auftrag. Tippe eine Datei an und wähle dann, was mit ihr passieren soll.");return false};
  ctx.loesung=()=>{d.r=missionen.length;zeichne()};
}}}

/* ---------- Spurensuche: durch Ordner gehen, Textdateien öffnen, Hinweisen folgen, Codewort finden ---------- */
function spurenSuche({titel,punkte=20,merke,text,baum,code,art="Rätsel"}){return{titel,punkte,merke,art,zeige(el,ctx){
  const d=ctx.daten;d.pfad=d.pfad||[];
  const ordner=p=>p.reduce((o,n)=>o[n],baum);
  const zeichne=()=>{
    if(ctx.geloest){el.innerHTML=kopfText(text)+`<div class="msg ok">Das Codewort stimmt. Der Pokal ist wieder da. Tippe auf „Weiter“.</div>`;return}
    const hier=ordner(d.pfad),namen=Object.keys(hier),auf=d.auf&&typeof hier[d.auf]==="string"?d.auf:null;
    el.innerHTML=kopfText(text)+`<div class="tafel"><div class="explorer"><div class="ex-leiste"><button class="btn ghost klein-btn" id="hoch" ${d.pfad.length?"":"disabled"}>Eine Ebene zurück</button>
      <div class="ex-pfad">Vereins-Laptop ${d.pfad.map(n=>`<span>›</span> ${n}`).join(" ")}</div></div>
      <div class="ex-inhalt">${namen.map(n=>typeof hier[n]==="string"?`<button class="ex-ordner datei${auf===n?" an":""}" data-f="${esc(n)}"><span>${dico(n,44)}</span>${n}</button>`:`<button class="ex-ordner" data-n="${esc(n)}"><span>${sym("ordner",44)}</span>${n}</button>`).join("")||`<p class="muted" style="grid-column:1/-1">Dieser Ordner ist leer.</p>`}</div></div>
      ${auf?`<div class="fenster"><div class="f-kopf">${dico(auf,20)} ${esc(auf)}</div><p>${hier[auf]}</p></div>`:""}
      <div class="eing" style="margin-top:14px"><input type="text" id="cw" placeholder="Codewort" autocomplete="off" spellcheck="false" maxlength="20" value="${esc(d.v||"")}"></div></div>${MLD}`;
    el.querySelector("#hoch").onclick=()=>{d.pfad.pop();d.auf=null;ctx.speichern();zeichne()};
    el.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{d.pfad.push(b.dataset.n);d.auf=null;ctx.speichern();zeichne()});
    el.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{d.auf=b.dataset.f;ctx.speichern();zeichne()});
    const inp=el.querySelector("#cw");inp.oninput=()=>{d.v=inp.value;ctx.speichern()};
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();document.getElementById("weiter")?.click()}};
  };
  zeichne();
  ctx.pruefer=()=>{if(ctx.geloest)return true;const v=(d.v||"").trim().toUpperCase();
    if(!v){meldung(el,false,"Folge den Hinweisen. Das Codewort steht in der letzten Datei.");return false}
    if(v===code){ctx.geschafft(punkte);zeichne();return true}
    if(d.falsch!==v){ctx.fehler();d.falsch=v;ctx.speichern()}
    meldung(el,false,"Das ist nicht das Codewort. Lies den letzten Hinweis noch einmal genau.");return false};
  ctx.loesung=()=>{d.v=code;zeichne()};
}}}

/* Station: Pixel-Werkstatt (KLP Inhaltsfeld „Information und Daten“):
   Daten vs. Information, binär decodieren und codieren, Farbcodes, Daten verkleinern (Lauflänge),
   Fehler finden (Prüfbit-Zaubertrick), eigenes Bild mit Code-Ansicht. Ca. 60 Minuten. */
(()=>{
const SW=["#FFFFFF","#1B1B1F"];
const PAL=["#FFFFFF","#1B1B1F","#E5383B","#2DA44E","#F5C518","#2F6FDE","#8B5A2B","#F28CB8","#F08A24","#8E5BD6"];
const NAMEN=["Weiß","Schwarz","Rot","Grün","Gelb","Blau","Braun","Rosa","Orange","Lila"];
const zahlen=z=>z.join("").split("").map(Number);

const BILDER={
  pfeil:["00011000","00111100","01111110","11111111","00011000","00011000","00011000","00011000"],
  boot:["00010000","00011000","00011100","00011110","00010000","11111111","01111110","00111100"],
  alien:["00100100","00011000","00111100","01011010","11111111","10111101","10100101","00100100"],
  herz:["00000000","01100110","11111111","11111111","01111110","00111100","00011000","00000000"],
  smiley:["00111100","01000010","10100101","10000001","10100101","10011001","01000010","00111100"],
  haus:["00011000","00111100","01111110","11111111","01000010","01011010","01011010","01111110"],
  apfel:["00003200","00003000","01111110","11111111","11111111","11111111","01111110","00111100"],
  sonne:["00111100","01111110","01111110","00111100","00000000","22222222","22222222","22222222"],
  tanne:["00011000","00111100","01111110","00111100","01111110","11111111","00011000","00011000"],
  pilz:["00111100","01111110","11111111","00011000","00011000","00111100"],
  herz5:["01010","11111","11111","01110","00100"],
  pfeil:["00011000","00111100","01111110","11111111","00011000","00011000","00011000","00011000"],
};
/* Farbcodes: In jedem Bild gilt ein eigener Schlüssel (1, 2, 3 …). 0 ist immer weiß. */
const SCHLUESSEL={
  apfel:[["Rot","#E5383B"],["Grün","#2DA44E"],["Braun","#8B5A2B"]],
  sonne:[["Gelb","#F5C518"],["Blau","#2F6FDE"]],
};

/* Wird beim Tippen auf „Weiter“ aufgerufen. true = richtig. Ab dem 3. Fehlversuch werden falsche Kästchen rot umrandet. */
function pruefen(ctx,raster,soll,punkte,box){
  if(raster.werte.every(x=>x===0)){box.className="msg no";box.textContent="Mal zuerst das Bild, dann tippe auf „Weiter“.";return false} // aus Versehen getippt: kein Abzug
  const stand=raster.werte.join("");
  const falsch=[];soll.forEach((x,k)=>{if(raster.werte[k]!==x)falsch.push(k)});
  if(falsch.length&&stand===ctx.daten.letzterFehler){box.className="msg no";box.textContent=`Du hast noch nichts geändert. Noch ${falsch.length===1?"1 Kästchen ist":falsch.length+" Kästchen sind"} falsch.`;return false}
  ctx.daten.versuche=(ctx.daten.versuche||0)+1;ctx.speichern();
  if(!falsch.length){raster.markiere([]);box.className="msg ok";box.textContent="Richtig! Alle Kästchen stimmen.";ctx.geschafft(punkte);return true}
  ctx.fehler();ctx.daten.letzterFehler=stand;ctx.speichern();
  box.className="msg no";
  box.textContent=falsch.length===1?"Fast! Noch 1 Kästchen ist falsch.":`Noch ${falsch.length} Kästchen sind falsch.`;
  if(ctx.daten.versuche>=3){raster.markiere(falsch);box.textContent+=" Sie sind jetzt rot umrandet."}
  box.scrollIntoView({block:"nearest",behavior:"smooth"});
  return false;
}

function abmalen(name,titel,punkte,merke){return{titel,punkte,merke,zeige(el,ctx){
  const soll=zahlen(BILDER[name]);
  el.innerHTML=`<p>Mal das Bild links genau ab. Tippe auf ein Kästchen, dann wird es schwarz. Nochmal tippen macht es wieder weiß. Du kannst auch ziehen.</p>
    <div class="paar"><div><p class="eyebrow">Vorlage</p><div id="a"></div></div><div><p class="eyebrow">Dein Bild</p><div id="b"></div></div></div>
    <div class="row noprint" style="margin-top:14px"><button class="btn ghost" id="l">Alles löschen</button><span class="muted small">Fertig? Tippe unten auf „Weiter“ – dann wird geprüft.</span></div><div id="m"></div>`;
  el.querySelector("#a").append(pixelRaster({w:8,h:8,werte:soll,palette:SW}).el);
  const r=pixelRaster({w:8,h:8,werte:ctx.daten.bild,palette:SW,malbar:true,onAenderung:v=>{ctx.daten.bild=v.slice();ctx.speichern()}});
  el.querySelector("#b").append(r.el);
  ctx.pruefer=()=>pruefen(ctx,r,soll,punkte,el.querySelector("#m"));
  ctx.loesung=()=>r.setzeAlle(soll);
  el.querySelector("#l").onclick=()=>{if(confirm("Wirklich alles löschen?"))r.setzeAlle(Array(64).fill(0))};
  if(ctx.geloest){const m=el.querySelector("#m");m.className="msg ok";m.textContent="Schon gelöst. Weiter geht's!"}
}}}

function codeBild(name,titel,punkte,farbig,merke){return{titel,punkte,merke,zeige(el,ctx){
  const roh=BILDER[name],soll=zahlen(roh);
  const key=farbig?SCHLUESSEL[name]:null;
  const pal=farbig?["#FFFFFF",...key.map(x=>x[1])]:SW;
  const ziffer=c=>farbig&&c!=="0"?`<span class="z" style="--c:${pal[+c]}">${c}</span>`:`<span>${c}</span>`;
  el.innerHTML=(farbig
    ?`<div class="regel"><b>Neue Regel:</b> Jetzt ist jede Zahl eine <b>Farbe</b>. Schau in den Schlüssel: Welche Zahl ist welche Farbe?</div>
      <p class="eyebrow" style="margin-top:12px">Schlüssel – tippe auf eine Farbe, dann auf die Kästchen</p><div class="schluessel" id="key">${key.map(([n,c],k)=>`<button data-f="${k+1}" style="--c:${c}"><b>${k+1}</b><span class="sw"></span>${n}</button>`).join("")}<button data-f="0" class="rad" style="--c:#fff"><b>0</b><span class="sw"></span>Weiß 🧽</button></div>`
    :`<p>Das ist ein Geheimcode. <b>1</b> heißt schwarz, <b>0</b> heißt weiß. Mal jede Zeile so, wie der Code es sagt. Was kommt heraus?</p>`)+
    `<div class="paar"><div><p class="eyebrow">Code</p><ol class="code">${roh.map(z=>`<li>${z.split("").map(ziffer).join("")}</li>`).join("")}</ol></div>
    <div><p class="eyebrow">Dein Bild</p><div id="b"></div></div></div>
    <div class="row noprint" style="margin-top:14px"><button class="btn ghost" id="l">Alles löschen</button><span class="muted small">Fertig? Tippe unten auf „Weiter“ – dann wird geprüft.</span></div><div id="m"></div>`;
  let wahl=1;
  if(farbig){const knoepfe=el.querySelectorAll("#key button");
    const setze=f=>{wahl=f;knoepfe.forEach(b=>b.classList.toggle("an",+b.dataset.f===f))};
    knoepfe.forEach(b=>b.onclick=()=>setze(+b.dataset.f));setze(1)}
  const r=pixelRaster({w:8,h:8,werte:ctx.daten.bild,palette:pal,malbar:true,farbe:()=>wahl,onAenderung:v=>{ctx.daten.bild=v.slice();ctx.speichern()}});
  el.querySelector("#b").append(r.el);
  const zeilen=el.querySelectorAll(".code li");
  const leuchte=z=>zeilen.forEach((li,k)=>li.classList.toggle("an",k===z));
  r.el.addEventListener("pointerover",e=>{const k=e.target.dataset?.k;if(k!=null)leuchte(Math.floor(k/8))});
  r.el.addEventListener("pointermove",e=>{const t=document.elementFromPoint(e.clientX,e.clientY);if(t&&t.dataset?.k!=null&&t.parentNode===r.el)leuchte(Math.floor(t.dataset.k/8))});
  r.el.addEventListener("pointerleave",()=>leuchte(-1));
  ctx.pruefer=()=>pruefen(ctx,r,soll,punkte,el.querySelector("#m"));
  ctx.loesung=()=>r.setzeAlle(soll);
  el.querySelector("#l").onclick=()=>{if(confirm("Wirklich alles löschen?"))r.setzeAlle(Array(64).fill(0))};
  if(ctx.geloest){const m=el.querySelector("#m");m.className="msg ok";m.textContent="Schon gelöst. Weiter geht's!"}
}}}

/* ---------- Codieren: Das Kind schreibt selbst den Code zu einem Bild (0/1-Knöpfe antippen) ---------- */
function codieren(name,titel,punkte,merke){return{titel,punkte,merke,zeige(el,ctx){
  const roh=BILDER[name],soll=zahlen(roh),h=roh.length;
  const code=ctx.daten.code||(ctx.daten.code=Array(8*h).fill(0));
  el.innerHTML=`<div class="regel"><b>Jetzt andersrum!</b> Du siehst das Bild und schreibst den Code. Tippe auf eine Zahl, dann wird aus 0 eine 1. Schwarz = 1, weiß = 0.</div>
    <div class="paar" style="margin-top:12px"><div><p class="eyebrow">Bild</p><div id="a"></div></div>
    <div><p class="eyebrow">Dein Code</p><div class="tipp-code" id="c">${roh.map((_,z)=>`<div class="tz">${Array.from({length:8},(_,s)=>`<button data-i="${z*8+s}">${code[z*8+s]}</button>`).join("")}</div>`).join("")}</div></div></div>
    <div id="m"></div>`;
  el.querySelector("#a").append(pixelRaster({w:8,h,werte:soll,palette:SW}).el);
  const knoepfe=[...el.querySelectorAll("#c button")];
  const zeig=()=>knoepfe.forEach((b,k)=>{b.textContent=code[k];b.classList.toggle("eins",code[k]===1)});zeig();
  knoepfe.forEach(b=>b.onclick=()=>{const k=+b.dataset.i;code[k]=code[k]?0:1;b.classList.remove("falsch");zeig();ctx.speichern()});
  ctx.pruefer=()=>{const m=el.querySelector("#m");
    if(code.every(x=>x===0)){m.className="msg no";m.textContent="Tippe zuerst die Zahlen an, dann auf „Weiter“.";return false}
    const falsch=[];soll.forEach((x,k)=>{if(code[k]!==x)falsch.push(k)});
    if(!falsch.length){m.className="msg ok";m.textContent="Richtig! Du hast das Bild codiert – wie ein Computer.";ctx.geschafft(punkte);return true}
    const stand=code.join("");if(stand!==ctx.daten.letzterFehler){ctx.fehler();ctx.daten.letzterFehler=stand;ctx.daten.versuche=(ctx.daten.versuche||0)+1;ctx.speichern()}
    m.className="msg no";m.textContent=falsch.length===1?"Fast! Noch 1 Zahl ist falsch.":`Noch ${falsch.length} Zahlen sind falsch.`;
    if((ctx.daten.versuche||0)>=3){knoepfe.forEach((b,k)=>b.classList.toggle("falsch",falsch.includes(k)));m.textContent+=" Sie sind jetzt rot."}
    return false};
  ctx.loesung=()=>{soll.forEach((x,k)=>code[k]=x);zeig()};
  if(ctx.geloest){const m=el.querySelector("#m");m.className="msg ok";m.textContent="Schon gelöst. Weiter geht's!"}
}}}

/* ---------- Kurzschrift: lange Codes kürzer schreiben (immer: erst weiß, dann schwarz, dann weiß …) ---------- */
/* Läufe einer Zeile: [{c:"0"|"1", n}] – gleiche Farben hintereinander zusammengefasst */
const laeufe=z=>{const r=[];for(const c of z){if(r.length&&r[r.length-1].c===c)r[r.length-1].n++;else r.push({c,n:1})}return r};
const SQ_W=`<i class="sq"></i>`,SQ_S=`<i class="sq s"></i>`;
const kurzText=z=>laeufe(z).map(l=>`<span class="lauf"><b>${l.n}</b>${l.c==="1"?SQ_S:SQ_W}</span>`).join("");

function kurzLesen(name,titel,punkte,merke){return{titel,punkte,merke,zeige(el,ctx){
  const roh=BILDER[name],soll=zahlen(roh);
  el.innerHTML=`<div class="regel"><b>Kurzschrift:</b> Statt ${SQ_W.repeat(3)+SQ_S.repeat(2)+SQ_W.repeat(3)} schreibt der Computer kurz: <b>3${SQ_W} 2${SQ_S} 3${SQ_W}</b>. Das spart Platz! Lies jede Zeile und mal das Bild.</div>
    <div class="paar" style="margin-top:12px"><div><p class="eyebrow">Kurzschrift</p><ol class="kurz">${roh.map(z=>`<li>${kurzText(z)}</li>`).join("")}</ol></div>
    <div><p class="eyebrow">Dein Bild</p><div id="b"></div></div></div>
    <div class="row noprint" style="margin-top:14px"><button class="btn ghost" id="l">Alles löschen</button><span class="muted small">Fertig? Tippe unten auf „Weiter“ – dann wird geprüft.</span></div><div id="m"></div>`;
  const r=pixelRaster({w:8,h:roh.length,werte:ctx.daten.bild,palette:SW,malbar:true,onAenderung:v=>{ctx.daten.bild=v.slice();ctx.speichern()}});
  el.querySelector("#b").append(r.el);
  const zeilen=el.querySelectorAll(".kurz li"),leuchte=z=>zeilen.forEach((li,k)=>li.classList.toggle("an",k===z));

  r.el.addEventListener("pointerleave",()=>leuchte(-1));
  ctx.pruefer=()=>pruefen(ctx,r,soll,punkte,el.querySelector("#m"));
  ctx.loesung=()=>r.setzeAlle(soll);

  if(ctx.geloest){const m=el.querySelector("#m");m.className="msg ok";m.textContent="Schon gelöst. Weiter geht's!"}
}}}

function kurzSchreiben(name,titel,punkte,merke){return{titel,punkte,merke,zeige(el,ctx){

    return false};

/* ---------- Zaubertrick (Prüfbit): In jeder Reihe und Spalte ist die Zahl der schwarzen Kästchen gerade.
   Der Zauberer dreht heimlich ein Kästchen um – das Kind findet es. So erkennt der Computer Übertragungsfehler. ---------- */
const N=6;
function neueRunde(){const g=Array(N*N).fill(0);
  for(let z=0;z<N-1;z++)for(let s=0;s<N-1;s++)g[z*N+s]=Math.random()<.45?1:0;
  for(let z=0;z<N-1;z++)g[z*N+N-1]=g.slice(z*N,z*N+N-1).reduce((a,b)=>a+b,0)%2;
  for(let s=0;s<N;s++){let n=0;for(let z=0;z<N-1;z++)n+=g[z*N+s];g[(N-1)*N+s]=n%2}
  return{g,dreh:null}}
function zauber(titel,punkte,runden,hilfe,merke){return{titel,punkte,merke,zeige(el,ctx){
  const d=ctx.daten;d.geschafft=d.geschafft||0;if(!d.runde)d.runde=neueRunde();ctx.speichern();
  const zeichne=()=>{const {g,dreh}=d.runde;
    const zs=z=>g.slice(z*N,z*N+N).reduce((a,b)=>a+b,0),ss=s=>{let n=0;for(let z=0;z<N;z++)n+=g[z*N+s];return n};
    el.innerHTML=`<div class="regel">🎩 <b>Der Trick:</b> In jeder Reihe und jeder Spalte sind <b>gerade viele</b> schwarze Kästchen (0, 2, 4 oder 6). Der Zauberer dreht heimlich <b>ein</b> Kästchen um. Wo ist jetzt eine Reihe <b>und</b> eine Spalte ungerade? Da ist es!</div>
      <p class="eyebrow" style="margin-top:12px">Runde ${Math.min(d.geschafft+1,runden)} von ${runden} · ${d.geschafft} geschafft</p>
      <div class="zauber${hilfe?" hilfe":""}">${Array.from({length:N},(_,z)=>Array.from({length:N},(_,s)=>`<button data-i="${z*N+s}" class="${g[z*N+s]?"s":""}" ${dreh==null?"disabled":""}></button>`).join("")+(hilfe?`<span class="zahl">${zs(z)}</span>`:"")).join("")}
        ${hilfe?Array.from({length:N},(_,s)=>`<span class="zahl">${ss(s)}</span>`).join("")+"<span></span>":""}</div>
      <div class="row" style="margin-top:14px">${d.geschafft>=runden?"":dreh==null?`<button class="btn" id="zaub">🎩 Zaubern! Ein Kästchen umdrehen</button>`:`<span class="msg" style="margin:0">Tippe auf das umgedrehte Kästchen!</span>`}</div><div id="m"></div>`;
    if(hilfe)el.querySelector(".zauber").style.gridTemplateColumns=`repeat(${N},1fr) 2.2em`;
    const z=el.querySelector("#zaub");if(z)z.onclick=()=>{const g2=d.runde.g;el.querySelector(".zauber").classList.add("wackeln");
      setTimeout(()=>{const i=Math.floor(Math.random()*N*N);g2[i]=g2[i]?0:1;d.runde.dreh=i;ctx.speichern();zeichne()},600)};
    el.querySelectorAll(".zauber button:not([disabled])").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
      if(i===d.runde.dreh){b.classList.add("gefunden");d.geschafft++;d.runde=neueRunde();ctx.speichern();
        if(d.geschafft>=runden){ctx.geschafft(punkte);setTimeout(()=>{zeichne();const m=el.querySelector("#m");m.className="msg ok";m.textContent="🎉 Super! Du hast den Trick durchschaut. Tippe auf „Weiter“."},500)}
        else{toast("Gefunden!");setTimeout(zeichne,700)}}
      else{ctx.fehler();b.classList.add("daneben");toast("Nicht das – zähl die schwarzen Kästchen in jeder Reihe!")}});
  };
  zeichne();
  ctx.pruefer=()=>{const m=el.querySelector("#m");m.className="msg no";m.textContent=`Noch ${runden-d.geschafft} ${runden-d.geschafft===1?"Runde":"Runden"}!`;return false};
  ctx.loesung=()=>{if(d.runde.dreh!=null){const b=el.querySelector(`.zauber button[data-i="${d.runde.dreh}"]`);if(b)b.classList.add("gefunden")}else toast("Erst „Zaubern“ tippen")};
}}}

/* ---------- Pixel-Rätsel (Nonogramm): Die Zahlen am Rand sagen, wie viele schwarze Kästchen nebeneinander liegen ---------- */
const hinweise=zeile=>{const r=[];let n=0;for(const c of zeile){if(c===1)n++;else if(n){r.push(n);n=0}}if(n)r.push(n);return r.length?r:[0]};
function nonogramm(name,titel,punkte,merke){return{titel,punkte,merke,zeige(el,ctx){
  const roh=BILDER[name],h=roh.length,w=roh[0].length,soll=zahlen(roh);
  const reihe=z=>soll.slice(z*w,z*w+w),spalte=sp=>Array.from({length:h},(_,z)=>soll[z*w+sp]);
  const rh=Array.from({length:h},(_,z)=>hinweise(reihe(z))),sh=Array.from({length:w},(_,sp)=>hinweise(spalte(sp)));
  el.innerHTML=`<div class="regel">🧩 <b>Pixel-Rätsel:</b> Die Zahlen sagen dir, wie viele <b>schwarze Kästchen nebeneinander</b> liegen. „2 1“ heißt: erst 2 schwarze, dann Lücke, dann 1 schwarzes. Eine Zahl wird <b style="color:var(--good)">grün</b>, wenn die Reihe passt.</div>
    <div class="nono" style="--w:${w}"><div></div><div class="sh">${sh.map((x,sp)=>`<span data-s="${sp}">${x.join("<br>")}</span>`).join("")}</div>
      <div class="rh">${rh.map((x,z)=>`<span data-r="${z}">${x.join(" ")}</span>`).join("")}</div><div id="b"></div></div>
    <div class="row noprint" style="margin-top:14px"><button class="btn ghost" id="l">Alles löschen</button><span class="muted small">Fertig? Tippe unten auf „Weiter“.</span></div><div id="m"></div>`;
  const pruefeZeilen=v=>{
    for(let z=0;z<h;z++)el.querySelector(`[data-r="${z}"]`).classList.toggle("ok",hinweise(v.slice(z*w,z*w+w)).join()===rh[z].join());
    for(let sp=0;sp<w;sp++)el.querySelector(`[data-s="${sp}"]`).classList.toggle("ok",hinweise(Array.from({length:h},(_,z)=>v[z*w+sp])).join()===sh[sp].join())};
  const r=pixelRaster({w,h,werte:ctx.daten.bild,palette:SW,malbar:true,onAenderung:v=>{ctx.daten.bild=v.slice();ctx.speichern();pruefeZeilen(v)}});
  el.querySelector("#b").append(r.el);r.el.style.maxWidth="none";pruefeZeilen(r.werte);
  ctx.pruefer=()=>pruefen(ctx,r,soll,punkte,el.querySelector("#m"));
  ctx.loesung=()=>r.setzeAlle(soll);
  el.querySelector("#l").onclick=()=>{if(confirm("Wirklich alles löschen?"))r.setzeAlle(Array(w*h).fill(0))};
  if(ctx.geloest){const m=el.querySelector("#m");m.className="msg ok";m.textContent="Schon gelöst. Weiter geht's!"}
}}}

/* ---------- Farbmischer: Bildschirm-Farben entstehen aus 3 Lampen (Rot, Grün, Blau). Jede Lampe: aus / halb / an.
   Für den Computer ist jede Farbe 3 Zahlen (0, 128 oder 255). ---------- */
const STUFEN=[0,128,255],STUFE_TEXT=["aus","halb","an"];
const ZIELE=[
  {n:"Rot",s:[2,0,0],tipp:"Mach nur die rote Lampe an."},
  {n:"Gelb",s:[2,2,0],tipp:"Komisch, aber wahr: <b>Rot + Grün</b> ergibt bei Licht <b>Gelb</b>!"},
  {n:"Weiß",s:[2,2,2],tipp:"Was passiert, wenn <b>alle drei</b> Lampen an sind?"},
  {n:"Lila",s:[1,0,2],tipp:"<b>Halb Rot</b> und <b>ganz Blau</b>."},
];
const rgb=st=>st.map(x=>STUFEN[x]).join(",");
function farbmischer(titel,punkte,merke){return{titel,punkte,merke,zeige(el,ctx){
  const d=ctx.daten;d.runde=d.runde||0;d.s=d.s||[0,0,0];
  const zeichne=()=>{
    if(d.runde>=ZIELE.length){el.innerHTML=`<div class="msg ok">🎨 Alle Farben gemischt! Tippe auf „Weiter“.</div>`;return}
    const ziel=ZIELE[d.runde];
    el.innerHTML=`<div class="regel">🔦 Jeder Bildschirm hat winzige <b>Lampen</b> in Rot, Grün und Blau. Tippe auf die Lampen, bis deine Farbe aussieht wie das Ziel. Jede Lampe: <b>aus → halb → an</b>.</div>
      <p class="eyebrow" style="margin-top:12px">Farbe ${d.runde+1} von ${ZIELE.length}</p><p class="tipp">💡 Tipp: ${ziel.tipp}</p>
      <div class="mischer"><div class="felder"><div><div class="feld" style="background:rgb(${rgb(ziel.s)})"></div><b>Ziel: ${ziel.n}</b></div>
        <div><div class="feld" id="du"></div><b>Deine Farbe</b></div></div>
        <div><div class="lampen">${["Rot","Grün","Blau"].map((n,k)=>`<button class="lampe l${k}" data-k="${k}"><span class="birne"></span><b>${n}</b><span class="stufe"></span></button>`).join("")}</div>
        <p class="muted" style="margin-top:10px">Für den Computer ist deine Farbe: <b id="code"></b></p></div></div><div id="m"></div>`;
    const male=()=>{el.querySelector("#du").style.background=`rgb(${rgb(d.s)})`;
      el.querySelectorAll(".lampe").forEach(b=>{const k=+b.dataset.k;b.dataset.st=d.s[k];b.querySelector(".stufe").textContent=`${STUFE_TEXT[d.s[k]]} (${STUFEN[d.s[k]]})`});
      el.querySelector("#code").textContent=d.s.map(x=>STUFEN[x]).join(", ")};male();
    el.querySelectorAll(".lampe").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;d.s[k]=(d.s[k]+1)%3;male();ctx.speichern();
      if(d.s.join()===ZIELE[d.runde].s.join()){const m=el.querySelector("#m");m.className="msg ok";m.textContent="Genau richtig! Tippe auf „Weiter“."}});
  };
  zeichne();
  ctx.pruefer=()=>{const m=el.querySelector("#m");
    if(d.runde>=ZIELE.length){ctx.geschafft(punkte);return true}
    if(d.s.join()===ZIELE[d.runde].s.join()){d.runde++;d.s=[0,0,0];ctx.speichern();
      if(d.runde>=ZIELE.length){ctx.geschafft(punkte);return true}
      toast("Perfekt gemischt! 🎨 Nächste Farbe");zeichne();return false}
    m.className="msg no";m.textContent="Noch nicht gleich – schau dir den Tipp oben an.";return false};
  ctx.loesung=()=>{if(d.runde<ZIELE.length){d.s=ZIELE[d.runde].s.slice();zeichne()}};
}}}

    el.innerHTML=`<p>Steuere die Schlange mit den <b>Pfeiltasten</b>. Friss die roten Äpfel. Fahr nicht gegen die Wand und nicht in dich selbst.</p>
      <div class="sp-kopf"><span id="pk">Äpfel: <b>0</b></span><span id="rk">${rekText("schlange","Äpfel")}</span></div>

      <div class="sp-pfeile" aria-label="Steuerung für Tablets"><button data-d="0,-1">▲</button><div><button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button></div></div>
      <div class="row" style="margin-top:12px"><button class="btn" id="st">Start</button><span class="muted" id="inf"></span></div>`;
    const cv=el.querySelector("#cv"),g=cv.getContext("2d"),css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    let sn=[{x:5,y:7},{x:4,y:7},{x:3,y:7}],dir={x:1,y:0},nd=dir,apfel={x:12,y:7},timer=null,pkt=0,laeuft=false;
    const male=()=>{g.clearRect(0,0,cv.width,cv.height);g.fillStyle=css("--fill")||"#F1F3F8";g.fillRect(0,0,cv.width,cv.height);
      g.fillStyle="#D24B3E";g.fillRect(apfel.x*Z+4,apfel.y*Z+4,Z-8,Z-8);
      sn.forEach((s,i)=>{g.fillStyle=i?"#2DA44E":"#17683A";g.fillRect(s.x*Z+1,s.y*Z+1,Z-2,Z-2)})};
    const neuApfel=()=>{do{apfel={x:zuf(W),y:zuf(H)}}while(sn.some(s=>s.x===apfel.x&&s.y===apfel.y))};
    const ende=()=>{laeuft=false;clearTimeout(timer);const neu=rekord("schlange",pkt);
      el.querySelector("#inf").innerHTML=`Vorbei! Du hast <b>${pkt}</b> ${pkt===1?"Apfel":"Äpfel"} gefressen.${neu?" <b>Neuer Rekord!</b>":""}`;
      el.querySelector("#rk").innerHTML=rekText("schlange","Äpfel");el.querySelector("#st").textContent="Noch mal";el.querySelector("#st").disabled=false};
    const tick=()=>{dir=nd;const k={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
      if(k.x<0||k.y<0||k.x>=W||k.y>=H||sn.some(s=>s.x===k.x&&s.y===k.y))return ende();
      sn.unshift(k);if(k.x===apfel.x&&k.y===apfel.y){pkt++;el.querySelector("#pk").innerHTML=`Äpfel: <b>${pkt}</b>`;neuApfel()}else sn.pop();male()};
    const lauf=()=>{if(!laeuft)return;tick();if(laeuft)timer=setTimeout(lauf,Math.max(85,170-pkt*4))};
    const start=()=>{sn=[{x:5,y:7},{x:4,y:7},{x:3,y:7}];dir=nd={x:1,y:0};pkt=0;neuApfel();laeuft=true;
      el.querySelector("#pk").innerHTML="Äpfel: <b>0</b>";el.querySelector("#inf").textContent="";el.querySelector("#st").disabled=true;male();clearTimeout(timer);timer=setTimeout(lauf,400)};
    const lenke=(x,y)=>{if(laeuft&&!(dir.x===-x&&dir.y===-y))nd={x,y}};
    const taste=e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];

    el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const [x,y]=b.dataset.d.split(",").map(Number);lenke(x,y)});

station({id:"memory",nr:88,spiel:true,ico:"🃏",titel:"Memory",kurz:"Finde alle Paare mit wenigen Zügen",
  schritte:[{titel:"Memory",punkte:0,zeige(el,ctx){
    const BILDER=["🖱️","⌨️","🖥️","🖨️","💾","🔒","🤖","📶"];let karten,offen,gefunden,zuege,sperre;
    const neu=()=>{karten=mischen([...BILDER,...BILDER]);offen=[];gefunden=new Set();zuege=0;sperre=false;zeichne()};
    const zeichne=()=>{const fertig=gefunden.size===karten.length;
      el.innerHTML=`<p>Deck immer zwei Karten auf. Gleiche Bilder bleiben offen. Schaffst du alle 8 Paare mit wenigen Zügen?</p>
        <div class="sp-kopf"><span>Züge: <b>${zuege}</b></span><span>${(()=>{const r=spielRekord("memory");return r==null?"Noch kein Rekord":`Dein Rekord: <b>${r}</b> Züge`})()}</span></div>
        <div class="sp-memo">${karten.map((b,i)=>{const auf=offen.includes(i)||gefunden.has(i);return`<button class="${auf?"auf":""}${gefunden.has(i)?" ok":""}" data-i="${i}" ${auf?"disabled":""} aria-label="${auf?b:"verdeckte Karte"}">${auf?b:""}</button>`}).join("")}</div>
        ${fertig?`<div class="msg ok" style="margin-top:12px">Alle Paare gefunden in <b>${zuege}</b> Zügen.${el.dataset.neu==="1"?" <b>Neuer Rekord!</b>":""}</div>`:""}
        <div class="row" style="margin-top:12px"><button class="btn ghost" id="nm">Neu mischen</button></div>`;
      el.querySelector("#nm").onclick=()=>{el.dataset.neu="";neu()};
      el.querySelectorAll("[data-i]").forEach(k=>k.onclick=()=>{if(sperre)return;const i=+k.dataset.i;offen.push(i);
        if(offen.length===2){zuege++;const [a,b]=offen;
          if(karten[a]===karten[b]){gefunden.add(a);gefunden.add(b);offen=[];
            if(gefunden.size===karten.length)el.dataset.neu=rekord("memory",zuege,true)?"1":"";zeichne()}
          else{sperre=true;zeichne();setTimeout(()=>{offen=[];sperre=false;if(el.isConnected)zeichne()},900)}}
        else zeichne()});
    };
    neu();
  }}]});

    an=[false,false,false,false,false];soll=0;zeichne();
  }}]});

/* Neue Version holen (wie KT Schule): beim Start und beim Zurückkehren */
async function versionPruefen(){if(!/github\.io$/.test(location.hostname))return;
  try{const r=await fetch("version.txt?"+Date.now(),{cache:"no-store"});const v=(await r.text()).trim();
    if(!v||v===VERSION)return;
    /* höchstens ein Neuladen pro Version (sonst Schleife, solange GitHub noch die alte Seite ausliefert) */
    let schon=null;try{schon=sessionStorage.getItem("if5-neu")}catch(e){}
    if(schon===v)return;try{sessionStorage.setItem("if5-neu",v)}catch(e){}
    await hochladen();location.replace(location.pathname+"?v="+v+location.hash)}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)versionPruefen();else if(sitzung){clearTimeout(pushTimer);hochladen()}});
versionPruefen();
if("serviceWorker"in navigator&&/github\.io$/.test(location.hostname))navigator.serviceWorker.register("sw.js").catch(()=>{});
