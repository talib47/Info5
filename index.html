<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Informatik 5</title>
<meta name="theme-color" content="#4338CA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Informatik 5">
<style>@font-face{font-family:"Newsreader";font-style:normal;font-weight:200 800;font-display:swap;src:url("fonts/newsreader-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Newsreader";font-style:normal;font-weight:200 800;font-display:swap;src:url("fonts/newsreader-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
/* Informatik 5 — ruhige Spalte wie KT Schule, aber kindgerecht: große Flächen, große Knöpfe. Bandfarbe Indigo. */
:root{color-scheme:light;
  --bg:#F2F2F6; --surface:#FFFFFF; --ink:#1B1B1F; --muted:#5F5F69; --line:#E3E3EA;
  --fill:rgba(118,118,140,.10); --fill2:rgba(118,118,140,.18);
  --accent:#4338CA; --accent-ink:#FFFFFF; --plate-top:#5B50E6; --plate-bot:#2E2690;
  --good:#2D7A4E; --bad:#B43A2E; --gold:#8A6400;
  --good-soft:color-mix(in srgb,var(--good) 11%,var(--surface)); --bad-soft:color-mix(in srgb,var(--bad) 9%,var(--surface));
  --tint:color-mix(in srgb,var(--accent) 11%,transparent);
  --serif:"Newsreader","Iowan Old Style",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --r-l:24px; --r-m:18px;
  --lift:0 1px 2px rgba(0,0,0,.04),0 16px 36px -18px rgba(0,0,0,.22);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#000; --surface:#1C1C1E; --ink:#F3F3F5; --muted:#A0A0AA; --line:#2F2F34;
  --fill:rgba(118,118,140,.22); --fill2:rgba(118,118,140,.32);
  --accent:#A5A0FF; --accent-ink:#14123A; --plate-top:#4A41C9; --plate-bot:#211B66;
  --good:#62C48C; --bad:#F2897E; --gold:#DDB35A;
  --tint:color-mix(in srgb,var(--accent) 17%,transparent)}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#000; --surface:#1C1C1E; --ink:#F3F3F5; --muted:#A0A0AA; --line:#2F2F34;
  --fill:rgba(118,118,140,.22); --fill2:rgba(118,118,140,.32);
  --accent:#A5A0FF; --accent-ink:#14123A; --plate-top:#4A41C9; --plate-bot:#211B66;
  --good:#62C48C; --bad:#F2897E; --gold:#DDB35A;
  --tint:color-mix(in srgb,var(--accent) 17%,transparent)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--sans);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 75%,transparent);outline-offset:2px}
#app{max-width:58rem;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 60px max(16px,env(safe-area-inset-right,0px));overflow-wrap:break-word}
h1,h2,h3{font-family:var(--serif);font-optical-sizing:auto;text-wrap:balance;margin:0}
h1{font-size:2.25rem;font-weight:600;line-height:1.1;letter-spacing:-.02em;margin-bottom:12px}
h2{font-size:1.5rem;font-weight:600;line-height:1.2;letter-spacing:-.012em;margin-bottom:10px}
p{margin:0 0 10px;text-wrap:pretty}
.eyebrow{font-size:.8125rem;font-weight:650;color:var(--muted);margin:0 0 6px;letter-spacing:.02em;text-transform:uppercase}
.muted{color:var(--muted)} .small{font-size:.875rem}
.block{background:var(--surface);border-radius:var(--r-m);padding:20px;margin:0 0 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 22px;border:0;border-radius:14px;font-weight:650;background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(0,0,0,.1);transition:transform .15s,filter .15s}
.btn:active:not(:disabled){transform:scale(.97);filter:brightness(.93)}
.btn.ghost{background:var(--tint);color:var(--accent);box-shadow:none}
.btn.wide{width:100%}
.btn:disabled{opacity:.38;cursor:default}
.link{border:0;background:none;padding:6px 0;color:var(--accent);font-weight:600;min-height:44px}
.chip{display:inline-block;border-radius:999px;background:var(--fill);color:var(--muted);padding:3px 10px;font-weight:650;font-size:.78rem;white-space:nowrap}
.chip.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
input[type=text],select{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 14px;font-size:1.125rem}
input[type=text]:focus,select:focus{border-color:var(--accent);outline:none}
label.f{display:block;font-weight:650;margin:0 0 6px}

/* Kopf mit Name */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 14px}
.top .who{font-weight:650}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:600;font-size:1.25rem}
.brand svg{width:34px;height:34px}

/* Platte (Startseite / Ergebnis) */
.plate{position:relative;overflow:hidden;border-radius:var(--r-l);padding:24px 22px;margin:0 0 16px;color:#fff;
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.16),transparent 55%),linear-gradient(165deg,var(--plate-top),var(--plate-bot));box-shadow:0 18px 36px -26px var(--plate-bot)}
.plate .eyebrow{color:rgba(255,255,255,.8)}
.plate h1,.plate h2{color:#fff}
.plate .btn{background:#fff;color:var(--plate-bot)}

/* Stationen-Kacheln */
.grid-st{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.st{display:flex;flex-direction:column;gap:6px;text-align:left;border:0;border-radius:var(--r-m);background:var(--surface);padding:18px;min-height:150px;box-shadow:var(--lift)}
.st .ico{font-size:2rem;line-height:1}
.st h3{font-size:1.25rem}
.st.soon{opacity:.55;box-shadow:none;cursor:default}
.st .meta{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}

/* Schritt-Leiste */
.steps{display:flex;gap:6px;margin:0 0 16px}
.steps i{flex:1;height:8px;border-radius:999px;background:var(--fill2)}
.steps i.ok{background:var(--good)} .steps i.now{background:var(--accent)}
.stephead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 8px}
.pts{font-weight:700;color:var(--gold);white-space:nowrap}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.msg{border-radius:14px;padding:12px 16px;margin:12px 0 0;font-weight:600}
.msg.ok{background:var(--good-soft);color:var(--good)}
.msg.no{background:var(--bad-soft);color:var(--bad)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:600;z-index:9;box-shadow:var(--lift)}

/* Ergebnis */
.result dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:12px 0 0}
.result dt{color:rgba(255,255,255,.75)} .result dd{margin:0;font-weight:700}
.note{font-family:var(--serif);font-size:3.5rem;font-weight:700;line-height:1}
@media print{.noprint{display:none!important}body{background:#fff}}

/* Anmeldung */
.wahl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.gross{min-height:110px;border:0;border-radius:var(--r-m);background:var(--surface);box-shadow:var(--lift);font:600 2.5rem/1 var(--serif);color:var(--accent)}
.gross:active{transform:scale(.97)}
.tiere{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.tiere.klein{grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.tier{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;border-radius:var(--r-m);background:var(--surface);box-shadow:var(--lift);padding:14px 6px 12px;font-weight:650;font-size:.9375rem;min-height:110px}
.tier .e{font-size:2.75rem;line-height:1.1}
.tiere.klein .tier{min-height:92px;padding:10px 4px;font-size:.8125rem}
.tiere.klein .tier .e{font-size:2.25rem}
.tier:active:not(:disabled){transform:scale(.96)}
.tier.zu{opacity:.38;box-shadow:none;cursor:default}
input[type=password]{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 14px;font-size:1.125rem}

/* Lehrer-Ansicht */
.tabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.tabs button{border:0;border-radius:12px;background:var(--surface);padding:10px 18px;font-weight:650;min-height:46px}
.tabs button.an{background:var(--accent);color:var(--accent-ink)}
.tabs button.an .muted{color:inherit;opacity:.75}
.frei-box{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border-left:6px solid var(--bad)}
.frei-box.offen{border-left-color:var(--good)}
table.liste{border-collapse:collapse;width:100%;font-size:.9375rem}
.liste th{text-align:left;font-size:.78rem;color:var(--muted);font-weight:650;padding:6px 10px 8px;white-space:nowrap}
.liste td{border-top:1px solid var(--line);padding:8px 10px;vertical-align:middle;white-space:nowrap}
.liste td.t{font-weight:650}.liste td.t .e{font-size:1.5rem;margin-right:6px;vertical-align:middle}
.liste input.vn{min-height:40px;padding:6px 10px;font-size:1rem;min-width:9rem;border-radius:10px}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
label.btn{cursor:pointer}
.steps.springen i{cursor:pointer;height:14px}
.steps.springen i:hover{filter:brightness(.85)}
.note.zeichen{font-family:var(--sans);font-size:4rem;font-weight:800}
.chip.gross-z{font-size:1rem;min-width:2rem;text-align:center;padding:2px 10px}
.heute{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 18px;margin-top:10px}
.heute div{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:6px 0}
.steps.springen i.zu{cursor:default;opacity:.6}
.btn.pfeil{min-width:9rem;font-size:1.0625rem}
.frage{font-size:1.25rem;font-weight:600;margin:4px 0 14px}
.antworten{display:grid;gap:10px}
.antwort{text-align:left;border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:16px 18px;font-size:1.0625rem;font-weight:600;min-height:58px}
.antwort:hover:not(:disabled){border-color:var(--accent)}
.antwort.falsch{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.antwort.richtig{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.antwort:disabled{cursor:default}
.aha{margin-top:16px;border-radius:16px;padding:16px 18px;background:color-mix(in srgb,var(--gold) 12%,var(--surface));border:2px solid color-mix(in srgb,var(--gold) 35%,transparent);font-size:1.0625rem}
.vorschlag{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:2px solid var(--accent)}
.vorschlag .e{font-size:3rem;line-height:1}
.vorschlag .btn{margin-left:auto}
.gross-tier .e{font-size:4.5rem;line-height:1;display:block;margin-bottom:6px}
.code li{border-radius:6px;transition:background .1s}
.code li.an{background:color-mix(in srgb,var(--accent) 18%,transparent);outline:2px solid var(--accent)}
.pal button.radierer{background:repeating-linear-gradient(45deg,#fff 0 6px,#eee 6px 12px)}
.pal button .rad{background:none;font-size:1.25rem;padding:0}
.konfetti{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.konfetti i{position:absolute;top:-40px;font-style:normal;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.bildchen{font-size:2rem;line-height:1.05;letter-spacing:2px;margin:0 0 14px}
.antworten{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.antwort{font-size:1.25rem;text-align:center;min-height:72px}
.regel{border-radius:14px;padding:12px 16px;background:color-mix(in srgb,var(--gold) 12%,var(--surface));border:2px solid color-mix(in srgb,var(--gold) 35%,transparent);font-size:1.0625rem}
.schluessel{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
.schluessel button{display:flex;align-items:center;gap:10px;border:3px solid var(--line);border-radius:16px;background:var(--surface);padding:8px 16px 8px 10px;font-weight:700;font-size:1.0625rem;min-height:58px}
.schluessel button b{font:800 1.75rem/1 ui-monospace,Menlo,Consolas,monospace;min-width:1.2em;text-align:center}
.schluessel .sw{width:30px;height:30px;border-radius:8px;background:var(--c);border:1px solid rgba(0,0,0,.15)}
.schluessel button.an{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent);transform:scale(1.04)}
.code .z{text-decoration:underline 5px var(--c);text-underline-offset:5px;text-decoration-skip-ink:none}
.code li{align-items:baseline}
.aha.merke{margin:4px 0 14px}
.tipp-code{display:grid;gap:4px}
.tipp-code .tz{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-width:340px}
.tipp-code button{aspect-ratio:1;min-height:34px;border:2px solid var(--line);border-radius:8px;background:var(--surface);font:700 1.125rem ui-monospace,Menlo,Consolas,monospace;padding:0}
.tipp-code button.eins{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tipp-code button.falsch{outline:3px solid var(--bad);outline-offset:-3px}
.kurz{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.kurz li{display:flex;gap:6px;border-radius:8px;padding:2px 4px}
.kurz li.an{background:color-mix(in srgb,var(--accent) 18%,transparent);outline:2px solid var(--accent)}
.lauf{display:inline-flex;align-items:center;gap:3px;border-radius:8px;padding:2px 8px;background:var(--fill);font-size:1.0625rem}
.lauf b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.25rem}
.kurz-ein{display:grid;gap:6px}
.kz{display:flex;gap:6px;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;gap:2px;border-radius:10px;background:var(--fill);padding:2px}
.stepper button{width:32px;height:34px;border:0;border-radius:8px;background:var(--surface);font-weight:800;font-size:1.125rem}
.stepper b{min-width:1.4em;text-align:center;font:700 1.25rem ui-monospace,Menlo,Consolas,monospace}
.stepper i{font-style:normal;padding:0 4px 0 2px}
.stepper.falsch{outline:3px solid var(--bad)}
.zauber{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;max-width:360px;align-items:center}
.zauber button{aspect-ratio:1;border:2px solid var(--line);border-radius:6px;background:#fff;padding:0}
.zauber button.s{background:#1B1B1F;border-color:#1B1B1F}
.zauber button:disabled{cursor:default}
.zauber button.daneben{outline:3px solid var(--bad);outline-offset:-3px}
.zauber button.gefunden{outline:4px solid var(--good);outline-offset:-4px;box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 40%,transparent)}
.zauber .zahl{font:700 1.125rem ui-monospace,Menlo,Consolas,monospace;text-align:center;color:var(--muted)}
.zauber.wackeln{animation:wackeln .6s}
@keyframes wackeln{0%,100%{transform:none}20%{transform:rotate(-3deg)}40%{transform:rotate(3deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(2deg)}}
.bildcode{font:600 .75rem/1.25 ui-monospace,Menlo,Consolas,monospace;background:var(--fill);border-radius:10px;padding:10px;margin:0 0 6px;overflow-x:auto;letter-spacing:1px}
@media (prefers-reduced-motion: reduce){.zauber.wackeln{animation:none}}
.kurz-tabelle{display:grid;gap:10px;margin-top:14px}
.kzeile{display:flex;gap:8px;flex-wrap:nowrap}
.gruppe{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed var(--accent);border-radius:10px;padding:5px}
.kaest{display:flex;gap:2px}
.kaest i{width:30px;height:30px;border-radius:4px;background:#fff;border:1.5px solid #c9c9d2}
.kaest i.s{background:#1B1B1F;border-color:#1B1B1F}
.gruppe input{width:46px;height:42px;text-align:center;font:700 1.375rem ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:10px;background:var(--surface);padding:0}
.gruppe input:focus{border-color:var(--accent);outline:none}
.gruppe input.falsch{border-color:var(--bad);background:var(--bad-soft)}
@media (max-width:520px){.kaest i{width:20px;height:20px}}
.sq{display:inline-block;width:.95em;height:.95em;border-radius:3px;background:#fff;border:1.5px solid #b9b9c4;vertical-align:-.12em;margin:0 1px}
.sq.s{background:#1B1B1F;border-color:#1B1B1F}
/* Dunkelmodus: Schwarz muss sich vom Hintergrund abheben */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sq.s,:root:not([data-theme="light"]) .kaest i.s,:root:not([data-theme="light"]) .zauber button.s{border-color:#8a8a96}
  :root:not([data-theme="light"]) .px{background:#6b6b76;border-color:#6b6b76}}
:root[data-theme="dark"] .sq.s,:root[data-theme="dark"] .kaest i.s,:root[data-theme="dark"] .zauber button.s{border-color:#8a8a96}
:root[data-theme="dark"] .px{background:#6b6b76;border-color:#6b6b76}
/* Pixel-Inhalte immer auf hellem „Papier“, auch im Dunkelmodus */
.lauf{background:#ECECF1;color:#1B1B1F}
.gruppe{background:#F4F4F7}
.gruppe input{background:#fff;color:#1B1B1F;border:2px solid #8b84e8}
.gruppe input::placeholder{color:#b0b0bb}
.nono{display:grid;grid-template-columns:auto minmax(0,min(100%,calc(var(--w)*44px)));gap:6px;margin-top:14px;align-items:end;max-width:100%}
.nono .sh{display:grid;grid-template-columns:repeat(var(--w),1fr);gap:2px;text-align:center;font:700 1rem/1.15 ui-monospace,Menlo,Consolas,monospace;padding:0 2px}
.nono .rh{display:grid;grid-auto-rows:1fr;gap:2px;font:700 1rem ui-monospace,Menlo,Consolas,monospace;text-align:right;align-self:stretch;padding:4px 0}
.nono .rh span{display:flex;align-items:center;justify-content:flex-end;padding-right:4px;white-space:nowrap}
.nono span.ok{color:var(--good)}
.nono .px{max-width:none;width:100%}
.mischer{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:6px;align-items:center}
.felder{display:flex;gap:14px}
.felder>div{flex:1;text-align:center}
.feld{aspect-ratio:1;border-radius:18px;border:2px solid var(--line);margin-bottom:6px;background:#000}
.regler{display:grid;gap:12px}
.regler label{display:grid;grid-template-columns:3.4em 1fr 2.6em;align-items:center;gap:10px;font-weight:700}
.regler input{width:100%;height:34px}
.regler .r0 input{accent-color:#E5383B}.regler .r1 input{accent-color:#2DA44E}.regler .r2 input{accent-color:#2F6FDE}
.regler b{font-family:ui-monospace,Menlo,Consolas,monospace;text-align:right}
.nono{width:fit-content;grid-template-columns:auto min(calc(var(--w)*48px),calc(100vw - 110px))}
.lampen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lampe{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid var(--line);border-radius:18px;background:var(--surface);padding:14px 6px;font-size:1rem}
.lampe .birne{width:56px;height:56px;border-radius:50%;background:#2a2a30;border:3px solid #55555f;transition:all .15s}
.lampe .stufe{font-size:.875rem;color:var(--muted);font-weight:600}
.lampe.l0[data-st="1"] .birne{background:#801c1e;box-shadow:0 0 14px #e5383b80}.lampe.l0[data-st="2"] .birne{background:#ff2b2b;box-shadow:0 0 26px #ff2b2b}
.lampe.l1[data-st="1"] .birne{background:#167030;box-shadow:0 0 14px #2da44e80}.lampe.l1[data-st="2"] .birne{background:#2bff5a;box-shadow:0 0 26px #2bff5a}
.lampe.l2[data-st="1"] .birne{background:#1c3f8a;box-shadow:0 0 14px #2f6fde80}.lampe.l2[data-st="2"] .birne{background:#3b7bff;box-shadow:0 0 26px #3b7bff}

<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   Informatik 5 — eigene Stunden-Seite für Jahrgang 5 (EKG Homberg, GNDO)
   Kinder: Klasse → Tier antippen (beim ersten Mal selbst aussuchen), Station lösen, Ergebniskarte zeigen.
   Anmelden geht nur während der eigenen Stunde (Stundenplan unten) oder wenn die Lehrkraft von Hand öffnet.
   Lehrkraft (#lehrer): Stände sehen, Vornamen zuordnen (nur lokal), Klassen von Hand öffnen/schließen.
   Neue Stunde = neue Datei in src/stationen/ (siehe README).
   ===================================================================== */
const VERSION="7bbfbcef68";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=q=>document.querySelector(q);
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),2400)}

/* Klassen: hier jedes Schuljahr anpassen */
const KLASSEN=["5B","5D","5E"];
/* So lange öffnet „Jetzt öffnen“ von Hand */
const FREIGABE_MIN=90;

/* Stundenplan Informatik (deutsche Zeit). tag: 1=Mo … 5=Fr. Jedes Schuljahr anpassen.
   Anmelden geht PUFFER Minuten vor Beginn bis zum Ende der Stunde. Speichern geht auch danach noch.
   (Kein Puffer nach dem Ende, sonst überschneiden sich Stunden, die direkt aufeinander folgen.) */
const PUFFER=5;
const STUNDENPLAN=[
  {klasse:"5B",tag:1,von:"09:05",min:60},   // 5B-1 Mo
  {klasse:"5B",tag:3,von:"11:25",min:60},   // 5B-2 Mi
  {klasse:"5D",tag:4,von:"13:40",min:60},   // 5D-1 Do
  {klasse:"5D",tag:3,von:"10:20",min:60},   // 5D-2 Mi
  {klasse:"5E",tag:1,von:"08:00",min:60},   // 5E-1 Mo
  {klasse:"5E",tag:5,von:"10:20",min:60},   // 5E-2 Fr
];
/* Ferien NRW 2026/27 (erster und letzter Ferientag). Bewegliche Ferientage der Schule hier ergänzen. */
const FERIEN=[["2026-12-23","2027-01-06"],["2027-03-22","2027-04-03"],["2027-05-18","2027-05-18"],["2027-07-19","2027-08-31"]];

/* =====================================================================
   Datenschicht. Zwei Modi mit denselben Funktionen:
   - ONLINE (talib47.github.io + Schlüssel eingetragen): Supabase, Kinder nur über RPC-Funktionen.
   - VORSCHAU (sonst): alles in diesem Browser – zum Ausprobieren und solange die Schule noch nicht zugestimmt hat.
   In beiden Modi: KEINE Namen in der Datenbank. Vornamen nur im Browser der Lehrkraft („if5-namen“).
   ===================================================================== */

/* Nach dem Okay der Schule hier eintragen (Supabase → Project Settings → API). Nur der anon-Schlüssel! */
const ONLINE={url:"",key:""};

const CLOUD=!!(ONLINE.url&&ONLINE.key&&/github\.io$/.test(location.hostname)&&window.supabase);
const sb=CLOUD?window.supabase.createClient(ONLINE.url,ONLINE.key):null;

/* Tiere: Jedes Kind sucht sich beim ersten Mal ein Tier aus (in der Klasse einmalig) */
const TIERE=[["🦊","Fuchs"],["🐼","Panda"],["🐸","Frosch"],["🦁","Löwe"],["🐯","Tiger"],["🐨","Koala"],["🐧","Pinguin"],["🦉","Eule"],
  ["🐙","Krake"],["🦈","Hai"],["🐢","Schildkröte"],["🦒","Giraffe"],["🦓","Zebra"],["🐘","Elefant"],["🦔","Igel"],["🐝","Biene"],
  ["🦋","Schmetterling"],["🐬","Delfin"],["🦜","Papagei"],["🦩","Flamingo"],["🐊","Krokodil"],["🦘","Känguru"],["🐿️","Eichhörnchen"],["🦦","Otter"],
  ["🐞","Marienkäfer"],["🦄","Einhorn"],["🐉","Drache"],["🐳","Wal"],["🦀","Krabbe"],["🐌","Schnecke"],["🐺","Wolf"],["🐻","Bär"],
  ["🐰","Hase"],["🐴","Pferd"],["🦅","Adler"],["🦖","Dino"]];
const tierInfo=n=>{const t=TIERE.find(x=>x[1]===n);return t?{emoji:t[0],name:t[1]}:{emoji:"❓",name:n}};
const WEIBLICH=new Set(["Eule","Krake","Schildkröte","Giraffe","Biene","Schnecke","Krabbe"]),SAECHLICH=new Set(["Zebra","Känguru","Eichhörnchen","Einhorn","Krokodil","Pferd"]);
const artikel=n=>WEIBLICH.has(n)?"die":SAECHLICH.has(n)?"das":"der";

/* Gerätekennung (für „besetzt“): bleibt auf dem PC, auch nach dem Abmelden */
const GERAET=(()=>{let g=lsGet("if5-geraet");if(!g){g=Math.random().toString(36).slice(2,12);lsSet("if5-geraet",g)}return g})();

/* ---------- Stundenplan: Ist die Klasse gerade offen? (deutsche Zeit, Sommer-/Winterzeit automatisch) ---------- */
function berlin(ms=Date.now()){
  const p=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Berlin",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",weekday:"short",hourCycle:"h23"})
    .formatToParts(new Date(ms)).map(x=>[x.type,x.value]));
  return{datum:`${p.year}-${p.month}-${p.day}`,tag:{Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6,Sun:7}[p.weekday],min:+p.hour*60+ +p.minute};
}
const hm=s=>{const [h,m]=s.split(":").map(Number);return h*60+m};
function planOffen(klasse,ms=Date.now()){
  const b=berlin(ms);
  if(FERIEN.some(([v,z])=>b.datum>=v&&b.datum<=z))return false;
  return STUNDENPLAN.some(s=>s.klasse===klasse&&s.tag===b.tag&&b.min>=hm(s.von)-PUFFER&&b.min<hm(s.von)+s.min);
}
/* Nächste geplante Stunde (für die Anzeige) */
function naechsteStunde(klasse){
  for(let d=0;d<21;d++){const ms=Date.now()+d*864e5,b=berlin(ms);
    if(FERIEN.some(([v,z])=>b.datum>=v&&b.datum<=z))continue;
    const s=STUNDENPLAN.filter(x=>x.klasse===klasse&&x.tag===b.tag&&(d>0||hm(x.von)+x.min>b.min)).sort((a,c)=>hm(a.von)-hm(c.von))[0];
    if(s)return`${d===0?"heute":d===1?"morgen":new Date(ms).toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"2-digit"})} um ${s.von} Uhr`}
  return null;
}
function offenAus(klasse,fg){const n=Date.now();fg=fg||{};
  if((fg.zu_bis||0)>n)return false;if((fg.offen_bis||0)>n)return true;return planOffen(klasse)}

/* ---------- Vorschau-Datenbank im Browser (bildet die Supabase-Funktionen nach) ---------- */
const MIN75=75*60000;
const vdb={
  lesen(){return lsGet("if5-vdb")||{kinder:[],staende:{},freigaben:{}}},
  schreiben(d){lsSet("if5-vdb",d)},
};
const jetztMs=()=>Date.now();
const vBesetzt=k=>!!(k.token&&jetztMs()-k.aktiv<MIN75);

const db={
  online:CLOUD,

  /* --- Kinder --- */
  async offeneKlassen(){
    if(CLOUD){const {data,error}=await sb.rpc("offene_klassen",{p_klassen:KLASSEN});if(error)throw error;return data||[]}
    const d=vdb.lesen();return KLASSEN.filter(k=>offenAus(k,d.freigaben[k]));
  },
  async tiere(klasse){
    if(CLOUD){const {data,error}=await sb.rpc("kind_tiere",{p_klasse:klasse});if(error)throw error;return data}
    const d=vdb.lesen();
    return{offen:offenAus(klasse,d.freigaben[klasse]),
      liste:d.kinder.filter(k=>k.klasse===klasse).map(k=>({tier:k.tier,besetzt:vBesetzt(k)&&k.geraet!==GERAET}))};
  },
  async neu(klasse,tier){
    if(CLOUD){const {data,error}=await sb.rpc("kind_neu",{p_klasse:klasse,p_tier:tier,p_geraet:GERAET});if(error)throw error;return data}
    const d=vdb.lesen();
    if(!offenAus(klasse,d.freigaben[klasse]))return{fehler:"zu"};
    if(d.kinder.some(x=>x.klasse===klasse&&x.tier===tier))return{fehler:"vergeben"};
    const k={id:Math.random().toString(36).slice(2,12),klasse,tier,token:Math.random().toString(36).slice(2),geraet:GERAET,aktiv:jetztMs(),erstellt:jetztMs()};
    d.kinder.push(k);vdb.schreiben(d);return{token:k.token,staende:{}};
  },
  async anmelden(klasse,tier){
    if(CLOUD){const {data,error}=await sb.rpc("kind_anmelden",{p_klasse:klasse,p_tier:tier,p_geraet:GERAET});if(error)throw error;return data}
    const d=vdb.lesen();
    if(!offenAus(klasse,d.freigaben[klasse]))return{fehler:"zu"};
    const k=d.kinder.find(x=>x.klasse===klasse&&x.tier===tier);
    if(!k)return{fehler:"unbekannt"};
    if(vBesetzt(k)&&k.geraet!==GERAET)return{fehler:"besetzt"};
    k.token=Math.random().toString(36).slice(2);k.geraet=GERAET;k.aktiv=jetztMs();vdb.schreiben(d);
    return{token:k.token,staende:d.staende[k.id]||{}};
  },
  async speichern(token,station,prog){
    if(CLOUD){const {data,error}=await sb.rpc("kind_speichern",{p_token:token,p_station:station,p_prog:prog});if(error)throw error;return data}
    const d=vdb.lesen();const k=d.kinder.find(x=>x.token===token);if(!k)return false;
    (d.staende[k.id]=d.staende[k.id]||{})[station]=prog;k.aktiv=jetztMs();vdb.schreiben(d);return true;
  },
  async abmelden(token){
    if(CLOUD){await sb.rpc("kind_abmelden",{p_token:token});return}
    const d=vdb.lesen();const k=d.kinder.find(x=>x.token===token);if(k){k.token=null;k.geraet=null;vdb.schreiben(d)}
  },

  /* --- Lehrkraft --- */
  async lSitzung(){if(!CLOUD)return true;const {data}=await sb.auth.getSession();return!!data.session},
  async lAnmelden(email,pw){const {error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error},
  async lAbmelden(){if(CLOUD)await sb.auth.signOut()},
  /* Stundenplan und Ferien aus src/app.js zum Server bringen (beim Öffnen der Lehrer-Ansicht) */
  async lPlanUebertragen(){
    if(!CLOUD)return;
    const r1=await sb.from("stundenplan").delete().neq("tag",-1);if(r1.error)throw r1.error;
    const r2=await sb.from("stundenplan").insert(STUNDENPLAN.map(s=>({klasse:s.klasse,tag:s.tag,von:s.von,min:s.min,puffer:PUFFER})));if(r2.error)throw r2.error;
    const r3=await sb.from("ferien").delete().gte("von","1900-01-01");if(r3.error)throw r3.error;
    const r4=await sb.from("ferien").insert(FERIEN.map(([von,bis])=>({von,bis})));if(r4.error)throw r4.error;
  },
  async lAlles(){
    if(CLOUD){
      const [k,s,f]=await Promise.all([sb.from("kinder").select("*").order("erstellt"),sb.from("staende").select("kind_id,station,prog"),sb.from("freigaben").select("*")]);
      for(const r of [k,s,f])if(r.error)throw r.error;
      const staende={};s.data.forEach(r=>{(staende[r.kind_id]=staende[r.kind_id]||{})[r.station]=r.prog});
      const freigaben={};f.data.forEach(r=>freigaben[r.klasse]={offen_bis:r.offen_bis?new Date(r.offen_bis).getTime():0,zu_bis:r.zu_bis?new Date(r.zu_bis).getTime():0});
      return{kinder:k.data.map(r=>({id:r.id,klasse:r.klasse,tier:r.tier,
        besetzt:!!(r.token&&Date.now()-new Date(r.aktiv_seit).getTime()<MIN75),aktiv:r.aktiv_seit?new Date(r.aktiv_seit).getTime():0})),staende,freigaben};
    }
    const d=vdb.lesen();
    return{kinder:d.kinder.map(k=>({...k,besetzt:vBesetzt(k)})),staende:d.staende,freigaben:d.freigaben};
  },
  async lAbmeldenKind(id){
    if(CLOUD){const {error}=await sb.from("kinder").update({token:null,geraet:null}).eq("id",id);if(error)throw error;return}
    const d=vdb.lesen();const k=d.kinder.find(x=>x.id===id);if(k){k.token=null;k.geraet=null;vdb.schreiben(d)}
  },
  async lStandLoeschen(id,station){
    if(CLOUD){const {error}=await sb.from("staende").delete().eq("kind_id",id).eq("station",station);if(error)throw error;return}
    const d=vdb.lesen();if(d.staende[id])delete d.staende[id][station];vdb.schreiben(d);
  },
  async lKindLoeschen(id){
    if(CLOUD){const {error}=await sb.from("kinder").delete().eq("id",id);if(error)throw error;return}
    const d=vdb.lesen();d.kinder=d.kinder.filter(x=>x.id!==id);delete d.staende[id];vdb.schreiben(d);
  },
  /* Hand-Steuerung: {offen_bis} öffnet, {zu_bis} schließt, {} = wieder nach Stundenplan */
  async lFreigabe(klasse,f){
    const row={klasse,offen_bis:f.offen_bis?new Date(f.offen_bis).toISOString():null,zu_bis:f.zu_bis?new Date(f.zu_bis).toISOString():null};
    if(CLOUD){const r=await sb.from("freigaben").upsert(row);if(r.error)throw r.error;return}
    const d=vdb.lesen();d.freigaben[klasse]={offen_bis:f.offen_bis||0,zu_bis:f.zu_bis||0};vdb.schreiben(d);
  },
};


/* Alle Stationen tragen sich selbst hier ein (Dateien in src/stationen/) */
const STATIONEN=[];
function station(s){STATIONEN.push(s)}

/* Geplante Stunden, die noch nicht gebaut sind (erscheinen grau) */
const BALD=[
  {ico:"🔐",titel:"Passwort-Werkstatt",kurz:"Starke Passwörter bauen und knacken lassen"},
  {ico:"⌨️",titel:"Tasten-Tricks",kurz:"Kopieren, Einfügen, Rückgängig – wie die Profis"},
  {ico:"🗂️",titel:"Ordnung im Computer",kurz:"Dateien in die richtigen Ordner sortieren"},
  {ico:"💬",titel:"Nett im Netz",kurz:"Welche Nachricht ist okay, welche nicht?"},
  {ico:"⚡",titel:"Tipp-Training",kurz:"Schneller tippen mit allen Fingern"},
  {ico:"🕵️",titel:"Echt oder Betrug?",kurz:"Gefälschte Nachrichten erkennen"},
  {ico:"🤖",titel:"Robo-Labyrinth",kurz:"Einen Roboter mit Befehlen steuern"},
  {ico:"0️⃣",titel:"Geheimsprache 0 und 1",kurz:"Zahlen und Wörter in Binär"}
];

/* Bewertung wie im Notenbuch: + / o / − aus den Prozent der Punkte (Grenzen hier anpassen) */
const PLUS_AB=75,O_AB=40;
const zeichenAus=p=>p>=PLUS_AB?"+":p>=O_AB?"o":"−";
const ZEICHEN_TEXT={"+":"Super gemacht!","o":"Gut, da geht noch mehr.","−":"Das war noch zu wenig."};
const zeichenKlasse=z=>z==="+"?"good":z==="o"?"":"bad";
const zeit=ms=>{const m=Math.round((ms||0)/60000);return m<1?"unter 1 Min.":m+" Min."};
const maxPunkte=st=>st.schritte.reduce((a,s)=>a+(s.punkte||0),0);
const summe=prog=>Object.values(prog?.punkte||{}).reduce((a,b)=>a+b,0);
const prozent=(st,prog)=>{const m=maxPunkte(st);return m?Math.round(summe(prog)/m*100):100};

/* ---------- Sitzung des Kindes ---------- */
let sitzung=lsGet("if5-sitzung");      // {klasse, tier, token}
let staende=lsGet("if5-staende")||{};  // {stationId: prog}
let laufend=null;                      // {st, prog}
/* Lehrer-Vorschau (#v): alle Stationen und Teile frei durchklicken, nichts wird gespeichert */
let VS=false,vStaende={};
const basis=()=>VS?"v/":"",home=()=>VS?"v":"";
const meineStaende=()=>VS?vStaende:staende;

function staendeLokal(){lsSet("if5-staende",staende)}
let pushTimer=null,pushWarte=new Set();
function speichern(sofort){
  if(!laufend)return;
  if(VS){vStaende[laufend.st.id]=laufend.prog;return}
  staende[laufend.st.id]=laufend.prog;staendeLokal();
  pushWarte.add(laufend.st.id);
  clearTimeout(pushTimer);pushTimer=setTimeout(hochladen,sofort?0:1500);
}
async function hochladen(){
  if(!sitzung)return;
  const ids=[...pushWarte];pushWarte.clear();
  for(const id of ids){
    try{const ok=await db.speichern(sitzung.token,id,staende[id]);
      if(ok===false){rauswurf("Du wurdest abgemeldet. Bitte melde dich neu an.");return}}
    catch(e){pushWarte.add(id);clearTimeout(pushTimer);pushTimer=setTimeout(hochladen,8000)}
  }
}
function rauswurf(t){sitzung=null;staende={};laufend=null;lsDel("if5-sitzung");lsDel("if5-staende");toast(t);location.hash="";render()}

/* Automatisch abmelden, wenn die Stunde vorbei ist (10 Minuten Nachlauf für Ergebniskarte und Speichern),
   damit die nächste Gruppe am selben PC nicht im fremden Tier landet. */
const NACHLAUF=10;
async function stundeVorbeiPruefen(){
  if(!sitzung||VS||location.hash.startsWith("#lehrer"))return;
  const k=sitzung.klasse;
  if(planOffen(k)||planOffen(k,Date.now()-NACHLAUF*60000))return;
  let offen=[];try{offen=await db.offeneKlassen()}catch(e){return}
  if(offen.includes(k))return;
  clearTimeout(pushTimer);await hochladen();try{await db.abmelden(sitzung.token)}catch(e){}
  rauswurf("Die Stunde ist vorbei. Du wurdest abgemeldet – dein Stand ist gespeichert.");
}
setInterval(stundeVorbeiPruefen,60000);

/* Aktive Zeit messen (nur wenn die Seite sichtbar ist) */
let tick=Date.now();
setInterval(()=>{const n=Date.now(),d=Math.min(n-tick,15000);tick=n;
  if(laufend&&!document.hidden&&!laufend.prog.fertig){laufend.prog.aktiv=(laufend.prog.aktiv||0)+d;speichern()}},10000);

/* ---------- Seiten ---------- */
function render(){
  let h=location.hash.slice(1);
  if(h==="lehrer"||h.startsWith("lehrer/"))return seiteLehrer();
  const vs=h==="v"||h.startsWith("v/");if(vs!==VS){VS=vs;laufend=null}
  if(VS)h=h.slice(2);
  else if(!sitzung)return seiteKlasse();
  if(h.startsWith("s/")){const st=STATIONEN.find(s=>s.id===h.slice(2));if(st)return seiteStation(st)}
  laufend=null;seiteStart();
}
window.addEventListener("hashchange",render);

/* 2. Tier wählen (oder neu anlegen) */
async function seiteTier(klasse){
  $("#app").innerHTML=kopf()+`<button class="link" id="zur">‹ Andere Klasse</button>
  <div class="plate"><p class="eyebrow">Klasse ${esc(klasse)}</p><h1>Welches Tier bist du?</h1></div><div id="liste"><p class="muted">Einen Moment …</p></div>`;
  $("#zur").onclick=()=>seiteKlasse(false);
  let r;try{r=await db.tiere(klasse)}catch(e){$("#liste").innerHTML=`<div class="msg no">Keine Verbindung. Versuch es gleich noch mal.</div><button class="btn ghost" id="neu" style="margin-top:12px">Noch mal</button>`;$("#neu").onclick=()=>seiteTier(klasse);return}
  if(!r.offen){const n=naechsteStunde(klasse);
    $("#liste").innerHTML=`<div class="block"><h2>Gerade geschlossen 🔒</h2><p>Du kannst dich nur in deiner Informatik-Stunde anmelden.${n?` Nächste Stunde: <b>${esc(n)}</b>.`:""}</p><button class="btn" id="neu">Noch mal schauen</button></div>`;$("#neu").onclick=()=>seiteTier(klasse);return}
  /* Auf diesem PC war zuletzt dieses Tier angemeldet: groß vorschlagen (die meisten sitzen am selben Platz) */
  const zl=lsGet("if5-zuletzt"),zt=zl&&zl.klasse===klasse&&r.liste.find(x=>x.tier===zl.tier&&!x.besetzt);
  $("#liste").innerHTML=(zt?`<div class="block vorschlag"><span class="e">${tierInfo(zt.tier).emoji}</span><div><p class="eyebrow">Letztes Mal an diesem Platz</p><h2 style="margin:0">Bist du ${artikel(zt.tier)} ${esc(zt.tier)}?</h2></div><button class="btn" id="dasbinich">Ja, das bin ich</button></div><p class="muted" style="margin:6px 2px 10px">Nein? Dann tippe auf dein Tier:</p>`:"")+
    (r.liste.length?`<div class="tiere">${r.liste.map(x=>{const t=tierInfo(x.tier);
    return`<button class="tier${x.besetzt?" zu":""}" data-t="${esc(x.tier)}" ${x.besetzt?"disabled":""}><span class="e">${t.emoji}</span><span>${esc(t.name)}</span>${x.besetzt?`<span class="chip">besetzt</span>`:""}</button>`}).join("")}</div>
    <p class="muted small" style="margin-top:12px">Dein Tier ist grau? Dann sag sofort deiner Lehrkraft Bescheid.</p>`:`<p class="muted">Hier ist noch niemand. Sei die oder der Erste!</p>`)+
    `<button class="btn ghost wide" id="ichneu" style="margin-top:16px">Ich bin neu hier – Tier aussuchen</button><div id="m"></div>`;
  const rein=async tier=>{document.querySelectorAll("#app button").forEach(x=>x.disabled=true);
    let r;try{r=await db.anmelden(klasse,tier)}catch(e){r={fehler:"netz"}}
    anmeldeErgebnis(klasse,tier,r,()=>seiteTier(klasse))};
  if(zt)$("#dasbinich").onclick=()=>rein(zt.tier);
  /* Fremdes Tier? Einmal nachfragen – Kinder tippen gern auf das Tier, das ihnen gefällt */
  document.querySelectorAll(".tier[data-t]:not([disabled])").forEach(b=>b.onclick=()=>{
    if(zt&&b.dataset.t===zt.tier)return rein(zt.tier);
    const t=tierInfo(b.dataset.t);
    $("#app").innerHTML=kopf()+`<div class="plate gross-tier"><span class="e">${t.emoji}</span><h1>Bist du ${artikel(t.name)} ${esc(t.name)}?</h1>
      <p>Tippe nur auf „Ja“, wenn das <b>dein</b> Tier ist. Mit einem fremden Tier sammelst du Punkte für jemand anderen.</p></div>
      <div class="row"><button class="btn" id="ja">Ja, das bin ich</button><button class="btn ghost" id="nein">Nein, zurück</button></div><div id="m"></div>`;
    $("#nein").onclick=()=>seiteTier(klasse);$("#ja").onclick=()=>rein(b.dataset.t)});
  $("#ichneu").onclick=()=>seiteNeuTier(klasse,new Set(r.liste.map(x=>x.tier)));
}

/* Neu: eigenes Tier aussuchen (in der Klasse noch frei) */
function seiteNeuTier(klasse,vergeben){

  <div class="plate"><p class="eyebrow">Neu · Klasse ${esc(klasse)}</p><h1>Such dir dein Tier aus</h1><p>Das ist ab jetzt dein Name hier. Graue Tiere sind schon vergeben.</p></div>
  <div class="msg no" style="margin:0 0 14px">⚠️ Nur wenn du <b>zum ersten Mal</b> hier bist! Hast du schon ein Tier? Dann tippe oben auf „‹ Zurück“.</div>
  <div class="tiere klein">${TIERE.map(([e,n])=>`<button class="tier${vergeben.has(n)?" zu":""}" data-w="${esc(n)}" ${vergeben.has(n)?"disabled":""}><span class="e">${e}</span><span>${esc(n)}</span></button>`).join("")}</div><div id="m"></div>`;

      <div class="row"><button class="btn" id="ok">Ja, das bin ich!</button><button class="btn ghost" id="nein">Anderes Tier</button></div><div id="m"></div>`;

    $("#ok").onclick=async()=>{$("#ok").disabled=true;let r;try{r=await db.neu(klasse,b.dataset.w)}catch(e){r={fehler:"netz"}}

function anmeldeErgebnis(klasse,tier,r,nochmal){
  const t=tierInfo(tier);
  if(r.token){sitzung={klasse,tier,token:r.token};lsSet("if5-sitzung",sitzung);lsSet("if5-zuletzt",{klasse,tier});staende=r.staende||{};staendeLokal();toast(`Hallo ${t.name}!`);location.hash="";render();return}
  const T={besetzt:"Dieses Tier ist schon an einem anderen Platz angemeldet. Sag deiner Lehrkraft Bescheid.",zu:"Die Klasse ist gerade geschlossen.",
    unbekannt:"Dieses Tier gibt es nicht mehr.",vergeben:"Dieses Tier hat sich gerade jemand anderes genommen. Such dir ein anderes aus.",voll:"Die Klasse ist voll. Sag deiner Lehrkraft Bescheid.",netz:"Keine Verbindung. Versuch es noch mal."};
  const m=$("#m");m.className="msg no";m.textContent=T[r.fehler]||"Das hat nicht geklappt.";m.scrollIntoView({block:"center",behavior:"smooth"});
  if(r.fehler==="netz")nochmal();else if(r.fehler==="vergeben"||r.fehler==="besetzt")setTimeout(nochmal,2500);
}

function seiteStart(){
  const karten=STATIONEN.map(s=>{const p=meineStaende()[s.id];
    const st=p?.fertig?`<span class="chip good">fertig · ${summe(p)} Punkte</span>`:p?`<span class="chip">angefangen</span>`:"";
    return`<button class="st" data-id="${s.id}"><span class="ico">${s.ico}</span><h3>${esc(s.titel)}</h3><span class="muted small">${esc(s.kurz)}</span><span class="meta"><span class="chip">${s.schritte.length} Teile</span>${st}</span></button>`}).join("");
  const bald=BALD.filter(b=>!STATIONEN.some(s=>s.titel===b.titel)).map(b=>`<div class="st soon"><span class="ico">${b.ico}</span><h3>${esc(b.titel)}</h3><span class="muted small">${esc(b.kurz)}</span><span class="meta"><span class="chip">kommt bald</span></span></div>`).join("");
  $("#app").innerHTML=kopf()+`
  ${VS?`<div class="plate"><p class="eyebrow">👀 Lehrer-Vorschau</p><h1>Alle Stationen ansehen</h1><p>So sehen die Kinder die Stationen. Du kannst jeden Teil frei anklicken, ohne ihn zu lösen. Nichts wird gespeichert.</p><button class="btn" id="vreset">Vorschau zurücksetzen</button></div>`
    :`<div class="plate"><p class="eyebrow">Hallo ${ich()}</p><h1>Welche Station heute?</h1><p>Deine Lehrkraft sagt dir, welche Station dran ist. Löse alle Teile und zeig am Ende deine Ergebniskarte.</p></div>`}
  <div class="grid-st">${karten}${bald}</div>
  <p class="muted small" style="margin-top:22px">Version ${VERSION}</p>`;
  kopfAktiv();
  document.querySelectorAll(".st[data-id]").forEach(b=>b.onclick=()=>location.hash=basis()+"s/"+b.dataset.id);
  if($("#vreset"))$("#vreset").onclick=()=>{vStaende={};laufend=null;seiteStart();toast("Vorschau zurückgesetzt")};
}

function seiteStation(st){
  if(!laufend||laufend.st!==st){
    const prog=meineStaende()[st.id]||{schritt:0,punkte:{},daten:{},start:Date.now(),aktiv:0};
    laufend={st,prog};
  }
  const {prog}=laufend;
  if(prog.fertig)return seiteErgebnis(st,prog);
  const i=Math.min(prog.schritt,st.schritte.length-1),sch=st.schritte[i];
  const geloest=i in prog.punkte;
  $("#app").innerHTML=kopf()+`
  ${VS?`<div class="msg ok noprint" style="margin:0 0 12px">👀 Vorschau: Du kannst jeden Teil anklicken und ohne Lösen weitergehen. Nichts wird gespeichert.</div>`:""}
  <div class="steps noprint springen">${st.schritte.map((_,k)=>{const darf=VS||k in prog.punkte||k<=(prog.weitester||0);
    return`<i class="${k in prog.punkte?"ok":k===i?"now":""}${darf?"":" zu"}"${darf?` data-sp="${k}" title="Zu Teil ${k+1}"`:""}></i>`}).join("")}</div>
  <div class="stephead"><p class="eyebrow">${st.ico} ${esc(st.titel)} · Teil ${i+1} von ${st.schritte.length}</p><span class="pts">⭐ ${summe(prog)} Punkte</span></div>
  <h2>${esc(sch.titel)}</h2>
  ${sch.merke?`<div class="aha merke"><b>💡 Merke:</b> ${sch.merke}</div>`:""}
  <div id="body"></div>
  <div class="nav noprint">
    <button class="btn ghost pfeil" id="zur">${i===0?"🏠 Übersicht":"◀ Zurück"}</button>
    <button class="btn pfeil" id="weiter">${i===st.schritte.length-1?"Fertig 🏁":"Weiter ▶"}</button>
  </div>`;
  prog.weitester=Math.max(prog.weitester||0,i);
  kopfAktiv();
  prog.daten[i]=prog.daten[i]||{};
  const ctx={
    daten:prog.daten[i],
    geloest,
    speichern:()=>speichern(),
    /* Ein falscher Versuch kostet 2 Punkte, aber höchstens die Hälfte der Punkte dieses Teils */
    fehler(){prog.fehler=prog.fehler||{};prog.fehler[i]=(prog.fehler[i]||0)+1;speichern()},
    geschafft(p){if(!(i in prog.punkte)){const f=(prog.fehler||{})[i]||0;p=Math.max(Math.ceil(p/2),p-2*f);prog.punkte[i]=p;speichern(true);
        if(p>0)toast(`Geschafft! +${p} Punkte`);
        $(".pts").textContent=`⭐ ${summe(prog)} Punkte`;
        $(".steps").children[i].className="ok"}
      ctx.geloest=true},
    pruefer:null,
    loesung:null,   // Teil setzt hier eine Funktion, die die Lösung zeigt (nur Lehrer-Vorschau)   // Teil setzt hier eine Prüf-Funktion (true = richtig); „Weiter“ ruft sie auf
  };
  sch.zeige($("#body"),ctx);
  if(VS&&ctx.loesung){$("#body").insertAdjacentHTML("beforebegin",`<button class="btn ghost noprint" id="loesung" style="margin:0 0 12px">🔑 Lösung zeigen</button>`);
    $("#loesung").onclick=()=>{ctx.loesung();$("#loesung").remove()}}
  document.querySelectorAll("[data-sp]").forEach(x=>x.onclick=()=>{prog.schritt=+x.dataset.sp;speichern();seiteStation(st);scrollTo(0,0)});
  $("#zur").onclick=()=>{if(i===0){location.hash=home()}else{prog.schritt=i-1;speichern();seiteStation(st);scrollTo(0,0)}};
  const vor=()=>{if(i===st.schritte.length-1){prog.fertig=Date.now();speichern(true);seiteErgebnis(st,prog)}
    else{prog.schritt=i+1;speichern();seiteStation(st)}
    scrollTo(0,0)};
  /* „Weiter“ prüft automatisch: richtig → kurz Erfolg zeigen, dann weiter; falsch → bleiben, Rückmeldung steht da */
  let sperre=false;
  $("#weiter").onclick=()=>{if(sperre)return;
    if(VS||i in prog.punkte)return vor();
    if(ctx.pruefer){if(ctx.pruefer()){sperre=true;setTimeout(vor,900)}return}
    toast("Löse zuerst diesen Teil.")};
}

function konfetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const box=document.createElement("div");box.className="konfetti";box.setAttribute("aria-hidden","true");
  for(let k=0;k<40;k++){const i=document.createElement("i");i.textContent=["🎉","⭐","✨","🎊"][k%4];
    i.style.left=Math.random()*100+"%";i.style.animationDelay=Math.random()*.8+"s";i.style.fontSize=(16+Math.random()*18)+"px";box.append(i)}
  document.body.append(box);setTimeout(()=>box.remove(),3500);
}
function seiteErgebnis(st,prog){
  if(prog.fertig&&Date.now()-prog.fertig<5000&&zeichenAus(prozent(st,prog))!=="−")konfetti();
  const pz=prozent(st,prog);
  $("#app").innerHTML=kopf()+`
  <div class="plate result">
    <p class="eyebrow">Ergebniskarte · ${st.ico} ${esc(st.titel)}</p>
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div><h1 style="margin:0">${ich()}</h1><p style="margin:2px 0 0">${VS?"Vorschau":"Klasse "+esc(sitzung.klasse)}</p></div>
      <div style="text-align:right"><div class="note zeichen">${zeichenAus(pz)}</div><span class="small">${ZEICHEN_TEXT[zeichenAus(pz)]}</span></div>
    </div>
    <dl><dt>Punkte</dt><dd>${summe(prog)} von ${maxPunkte(st)} (${pz} %)</dd>
    <dt>Gearbeitet</dt><dd>${zeit(prog.aktiv)}</dd>
    <dt>Fertig am</dt><dd>${new Date(prog.fertig).toLocaleString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</dd></dl>
  </div>
  ${st.ergebnis?`<div class="block">${st.ergebnis(prog.daten)}</div>`:""}
  <div class="block"><p style="margin:0"><b>Zeig diese Karte deiner Lehrkraft.</b> ${st.kreativ?"Die Note für Kreativität gibt die Lehrkraft.":""}</p></div>
  <div class="nav noprint"><button class="btn ghost" id="zur">Übersicht</button></div>`;
  kopfAktiv();
  if(st.nachErgebnis)st.nachErgebnis(prog.daten);
  $("#zur").onclick=()=>location.hash=home();
  if(VS)$(".nav").insertAdjacentHTML("beforeend",`<button class="btn ghost" id="vnochmal">Station noch mal</button>`),$("#vnochmal").onclick=()=>{delete vStaende[st.id];laufend=null;seiteStation(st)};
}

function lehrerZeigen(){
  const d=lDaten,kl=lKlasse;

  const fg=d.freigaben[kl]||{},nun=Date.now();
  const offen=offenAus(kl,fg),hand=(fg.zu_bis||0)>nun?"zu":(fg.offen_bis||0)>nun?"offen":null;
  const naechste=naechsteStunde(kl);
  const info=hand==="offen"?`Von Hand geöffnet bis ${new Date(fg.offen_bis).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})} Uhr.`
    :hand==="zu"?`Von Hand geschlossen bis ${new Date(fg.zu_bis).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})} Uhr.`
    :offen?"Nach Stundenplan offen.":`Nach Stundenplan zu.${naechste?" Nächste Stunde: "+naechste+".":""}`;
  const zeile=k=>{const t=tierInfo(k.tier),s=d.staende[k.id]||{};
    const status=k.besetzt?`<span class="chip good">angemeldet</span> <button class="link" data-a="freigeben" data-id="${k.id}">abmelden</button>`:`<span class="muted small">–</span>`;

      return`<td>${p.fertig?`<span class="chip ${zeichenKlasse(zeichenAus(pz))} gross-z">${zeichenAus(pz)}</span>`:"<b>…</b>"} <span class="muted small">${pz} %${p.fertig?"":" · Teil "+((p.schritt||0)+1)}</span></td>`}).join("");
    return`<tr><td class="t"><span class="e">${t.emoji}</span>${esc(t.name)}</td>
      <td><input type="text" class="vn" data-id="${k.id}" value="${esc(namen[k.id]||"")}" placeholder="Wer ist das?" list="dl-${esc(kl)}"></td><td>${status}</td>${zellen}
      <td><button class="link" data-a="mehr" data-id="${k.id}" aria-label="Mehr">⋯</button></td></tr>`};
  $("#lb").innerHTML=`
  <div class="tabs noprint">${KLASSEN.map(k=>`<button class="${k===kl?"an":""}" data-kl="${k}">${k} <span class="muted small">${d.kinder.filter(x=>x.klasse===k).length}</span></button>`).join("")}</div>
  <div class="block frei-box ${offen?"offen":""}">
    <div><h2 style="margin:0">${offen?`${kl} ist offen`:`${kl} ist zu`}</h2><p class="muted small" style="margin:2px 0 0">${esc(info)}</p></div>
    <div class="row">${hand?`<button class="btn ghost" id="plan">Wieder nach Stundenplan</button>`:""}<button class="btn" id="frei">${offen?"Jetzt schließen":`Jetzt öffnen (${FREIGABE_MIN} Min.)`}</button></div>

/* Pixel-Raster: w×h Kästchen, Werte = Index in palette. Malen mit Maus, Finger oder Stift (auch Ziehen). */
function pixelRaster({w,h,werte,palette,malbar=false,farbe=()=>1,klein=false,onAenderung}){
  const el=document.createElement("div");el.className="px"+(malbar?" malbar":"")+(klein?" klein":"");
  el.style.gridTemplateColumns=`repeat(${w},1fr)`;el.style.aspectRatio=`${w}/${h}`;
  if(h<w)el.style.maxWidth=`${Math.round(340*Math.max(h/w,.5))*w/h}px`;
  const v=werte?werte.slice():Array(w*h).fill(0);
  const zellen=v.map((x,k)=>{const c=document.createElement("i");c.style.background=palette[x];c.dataset.k=k;el.append(c);return c});
  const setze=(k,x)=>{if(v[k]===x)return;v[k]=x;zellen[k].style.background=palette[x];zellen[k].classList.remove("falsch");onAenderung&&onAenderung(v)};
  if(malbar){let mal=null;
    const ziel=e=>{const t=document.elementFromPoint(e.clientX,e.clientY);return t&&t.parentNode===el?+t.dataset.k:null};
    el.addEventListener("pointerdown",e=>{const k=ziel(e);if(k==null)return;e.preventDefault();el.setPointerCapture(e.pointerId);
      const f=farbe();mal=v[k]===f?0:f;setze(k,mal)});
    el.addEventListener("pointermove",e=>{if(mal==null)return;const k=ziel(e);if(k!=null)setze(k,mal)});
    const ende=()=>{mal=null};el.addEventListener("pointerup",ende);el.addEventListener("pointercancel",ende);
  }
  return{el,werte:v,setzeAlle(a){a.forEach((x,k)=>setze(k,x))},markiere(falsch){zellen.forEach((c,k)=>c.classList.toggle("falsch",falsch.includes(k)))}};
}

/* Aha-Frage: kurze Frage mit 3 leichten Antworten. Nach der richtigen Antwort erklärt ein „Aha!“-Kasten den Sinn.
   frage("Titel","Frage?",["richtig","falsch"],"Erklärung",punkte,bildHTML)  – die erste Antwort ist die richtige, angezeigt wird gemischt.
   Für Klasse 5: kurze Frage, 2 Antworten mit Emoji, eine davon offensichtlich falsch. */
function frage(titel,text,antworten,aha,punkte=5,bild=""){return{titel,punkte,zeige(el,ctx){
  const reihe=ctx.daten.reihe||(ctx.daten.reihe=antworten.map((_,k)=>k).sort(()=>Math.random()-.5));ctx.speichern();
  el.innerHTML=`<p class="frage">${text}</p>${bild}<div class="antworten">${reihe.map(k=>`<button class="antwort" data-k="${k}">${esc(antworten[k])}</button>`).join("")}</div><div id="aha"></div>`;
  const zeigeAha=()=>{el.querySelector("#aha").innerHTML=`<div class="aha"><b>💡 Aha!</b> ${aha}</div>`;
    el.querySelectorAll(".antwort").forEach(b=>{b.disabled=true;if(b.dataset.k==="0")b.classList.add("richtig")})};
  ctx.pruefer=()=>{toast("Tippe zuerst auf eine Antwort.");return false};
  ctx.loesung=()=>{const b=el.querySelector('.antwort[data-k="0"]');b.classList.add("richtig");el.querySelector("#aha").innerHTML=`<div class="aha"><b>💡 Aha!</b> ${aha}</div>`};
  if(ctx.geloest)return zeigeAha();
  el.querySelectorAll(".antwort").forEach(b=>b.onclick=()=>{
    if(b.dataset.k==="0"){zeigeAha();ctx.geschafft(punkte)}
    else{ctx.fehler();b.classList.add("falsch");b.disabled=true;toast("Nicht ganz – versuch es noch mal!")}});
}}}

/* Farbauswahl für Pixel-Raster */
function farbLeiste(palette,nm,start=1,ohneWeiss=false,mitZahlen=true){
  const el=document.createElement("div");el.className="pal";let wahl=start;
  palette.forEach((f,k)=>{if(ohneWeiss&&k===0)return;const b=document.createElement("button");b.type="button";b.style.setProperty("--c",f);
    const rad=k===0;b.setAttribute("aria-label",rad?"Radierer":nm[k]);b.title=rad?"Radierer (macht weiß)":nm[k];
    b.innerHTML=rad?`<span class="rad">🧽</span>`:mitZahlen?`<span>${k}</span>`:"";b.className=(k===wahl?"an":"")+(rad?" radierer":"");
    b.onclick=()=>{wahl=k;el.querySelectorAll("button").forEach(x=>x.classList.remove("an"));b.classList.add("an")};el.append(b)});
  return{el,farbe:()=>wahl};
}

   Daten vs. Information, binär decodieren und codieren, Farbcodes, Daten verkleinern (Lauflänge),

(()=>{
const SW=["#FFFFFF","#1B1B1F"];
const PAL=["#FFFFFF","#1B1B1F","#E5383B","#2DA44E","#F5C518","#2F6FDE","#8B5A2B","#F28CB8","#F08A24","#8E5BD6"];
const NAMEN=["Weiß","Schwarz","Rot","Grün","Gelb","Blau","Braun","Rosa","Orange","Lila"];
const zahlen=z=>z.join("").split("").map(Number);

const BILDER={
  pfeil:["00011000","00111100","01111110","11111111","00011000","00011000","00011000","00011000"],
  boot:["00010000","00011000","00011100","00011110","00010000","11111111","01111110","00111100"],

  herz:["00000000","01100110","11111111","11111111","01111110","00111100","00011000","00000000"],
  smiley:["00111100","01000010","10100101","10000001","10100101","10011001","01000010","00111100"],
  haus:["00011000","00111100","01111110","11111111","01000010","01011010","01011010","01111110"],
  apfel:["00003200","00003000","01111110","11111111","11111111","11111111","01111110","00111100"],
  sonne:["00111100","01111110","01111110","00111100","00000000","22222222","22222222","22222222"],
  tanne:["00011000","00111100","01111110","00111100","01111110","11111111","00011000","00011000"],
  pilz:["00111100","01111110","11111111","00011000","00011000","00111100"],
  herz5:["01010","11111","11111","01110","00100"],
  pfeil:["00011000","00111100","01111110","11111111","00011000","00011000","00011000","00011000"],
};
/* Farbcodes: In jedem Bild gilt ein eigener Schlüssel (1, 2, 3 …). 0 ist immer weiß. */
const SCHLUESSEL={
  apfel:[["Rot","#E5383B"],["Grün","#2DA44E"],["Braun","#8B5A2B"]],
  sonne:[["Gelb","#F5C518"],["Blau","#2F6FDE"]],
};

/* Wird beim Tippen auf „Weiter“ aufgerufen. true = richtig. Ab dem 3. Fehlversuch werden falsche Kästchen rot umrandet. */
function pruefen(ctx,raster,soll,punkte,box){
  if(raster.werte.every(x=>x===0)){box.className="msg no";box.textContent="Mal zuerst das Bild, dann tippe auf „Weiter“.";return false} // aus Versehen getippt: kein Abzug
  const stand=raster.werte.join("");
  const falsch=[];soll.forEach((x,k)=>{if(raster.werte[k]!==x)falsch.push(k)});
  if(falsch.length&&stand===ctx.daten.letzterFehler){box.className="msg no";box.textContent=`Du hast noch nichts geändert. Noch ${falsch.length===1?"1 Kästchen ist":falsch.length+" Kästchen sind"} falsch.`;return false}
  ctx.daten.versuche=(ctx.daten.versuche||0)+1;ctx.speichern();
  if(!falsch.length){raster.markiere([]);box.className="msg ok";box.textContent="Richtig! Alle Kästchen stimmen.";ctx.geschafft(punkte);return true}
  ctx.fehler();ctx.daten.letzterFehler=stand;ctx.speichern();
  box.className="msg no";
  box.textContent=falsch.length===1?"Fast! Noch 1 Kästchen ist falsch.":`Noch ${falsch.length} Kästchen sind falsch.`;
  if(ctx.daten.versuche>=3){raster.markiere(falsch);box.textContent+=" Sie sind jetzt rot umrandet."}
  box.scrollIntoView({block:"nearest",behavior:"smooth"});
  return false;
}

function abmalen(name,titel,punkte,merke){return{titel,punkte,merke,zeige(el,ctx){
  const soll=zahlen(BILDER[name]);
  el.innerHTML=`<p>Mal das Bild links genau ab. Tippe auf ein Kästchen, dann wird es schwarz. Nochmal tippen macht es wieder weiß. Du kannst auch ziehen.</p>
    <div class="paar"><div><p class="eyebrow">Vorlage</p><div id="a"></div></div><div><p class="eyebrow">Dein Bild</p><div id="b"></div></div></div>
    <div class="row noprint" style="margin-top:14px"><button class="btn ghost" id="l">Alles löschen</button><span class="muted small">Fertig? Tippe unten auf „Weiter“ – dann wird geprüft.</span></div><div id="m"></div>`;
  el.querySelector("#a").append(pixelRaster({w:8,h:8,werte:soll,palette:SW}).el);
  const r=pixelRaster({w:8,h:8,werte:ctx.daten.bild,palette:SW,malbar:true,onAenderung:v=>{ctx.daten.bild=v.slice();ctx.speichern()}});
  el.querySelector("#b").append(r.el);
  ctx.pruefer=()=>pruefen(ctx,r,soll,punkte,el.querySelector("#m"));
  ctx.loesung=()=>r.setzeAlle(soll);
  el.querySelector("#l").onclick=()=>{if(confirm("Wirklich alles löschen?"))r.setzeAlle(Array(64).fill(0))};
  if(ctx.geloest){const m=el.querySelector("#m");m.className="msg ok";m.textContent="Schon gelöst. Weiter geht's!"}
}}}

function codeBild(name,titel,punkte,farbig,merke){return{titel,punkte,merke,zeige(el,ctx){
  const roh=BILDER[name],soll=zahlen(roh);
  const key=farbig?SCHLUESSEL[name]:null;
  const pal=farbig?["#FFFFFF",...key.map(x=>x[1])]:SW;
  const ziffer=c=>farbig&&c!=="0"?`<span class="z" style="--c:${pal[+c]}">${c}</span>`:`<span>${c}</span>`;
  el.innerHTML=(farbig
    ?`<div class="regel"><b>Neue Regel:</b> Jetzt ist jede Zahl eine <b>Farbe</b>. Schau in den Schlüssel: Welche Zahl ist welche Farbe?</div>
      <p class="eyebrow" style="margin-top:12px">🔑 Schlüssel – tippe auf eine Farbe, dann auf die Kästchen</p><div class="schluessel" id="key">${key.map(([n,c],k)=>`<button data-f="${k+1}" style="--c:${c}"><b>${k+1}</b><span class="sw"></span>${n}</button>`).join("")}<button data-f="0" class="rad" style="--c:#fff"><b>0</b><span class="sw"></span>Weiß 🧽</button></div>`
    :`<p>Das ist ein Geheimcode. <b>1</b> heißt schwarz, <b>0</b> heißt weiß. Mal jede Zeile so, wie der Code es sagt. Was kommt heraus?</p>`)+
    `<div class="paar"><div><p class="eyebrow">Code</p><ol class="code">${roh.map(z=>`<li>${z.split("").map(ziffer).join("")}</li>`).join("")}</ol></div>
    <div><p class="eyebrow">Dein Bild</p><div id="b"></div></div></div>
    <div class="row noprint" style="margin-top:14px"><button class="btn ghost" id="l">Alles löschen</button><span class="muted small">Fertig? Tippe unten auf „Weiter“ – dann wird geprüft.</span></div><div id="m"></div>`;
  let wahl=1;
  if(farbig){const knoepfe=el.querySelectorAll("#key button");
    const setze=f=>{wahl=f;knoepfe.forEach(b=>b.classList.toggle("an",+b.dataset.f===f))};
    knoepfe.forEach(b=>b.onclick=()=>setze(+b.dataset.f));setze(1)}
  const r=pixelRaster({w:8,h:8,werte:ctx.daten.bild,palette:pal,malbar:true,farbe:()=>wahl,onAenderung:v=>{ctx.daten.bild=v.slice();ctx.speichern()}});
  el.querySelector("#b").append(r.el);
  const zeilen=el.querySelectorAll(".code li");
  const leuchte=z=>zeilen.forEach((li,k)=>li.classList.toggle("an",k===z));
  r.el.addEventListener("pointerover",e=>{const k=e.target.dataset?.k;if(k!=null)leuchte(Math.floor(k/8))});
  r.el.addEventListener("pointermove",e=>{const t=document.elementFromPoint(e.clientX,e.clientY);if(t&&t.dataset?.k!=null&&t.parentNode===r.el)leuchte(Math.floor(t.dataset.k/8))});
  r.el.addEventListener("pointerleave",()=>leuchte(-1));
  ctx.pruefer=()=>pruefen(ctx,r,soll,punkte,el.querySelector("#m"));
  ctx.loesung=()=>r.setzeAlle(soll);
  el.querySelector("#l").onclick=()=>{if(confirm("Wirklich alles löschen?"))r.setzeAlle(Array(64).fill(0))};
  if(ctx.geloest){const m=el.querySelector("#m");m.className="msg ok";m.textContent="Schon gelöst. Weiter geht's!"}
}}}

/* ---------- Codieren: Das Kind schreibt selbst den Code zu einem Bild (0/1-Knöpfe antippen) ---------- */
function codieren(name,titel,punkte,merke){return{titel,punkte,merke,zeige(el,ctx){
  const roh=BILDER[name],soll=zahlen(roh),h=roh.length;
  const code=ctx.daten.code||(ctx.daten.code=Array(8*h).fill(0));
  el.innerHTML=`<div class="regel"><b>Jetzt andersrum!</b> Du siehst das Bild und schreibst den Code. Tippe auf eine Zahl, dann wird aus 0 eine 1. Schwarz = 1, weiß = 0.</div>
    <div class="paar" style="margin-top:12px"><div><p class="eyebrow">Bild</p><div id="a"></div></div>
    <div><p class="eyebrow">Dein Code</p><div class="tipp-code" id="c">${roh.map((_,z)=>`<div class="tz">${Array.from({length:8},(_,s)=>`<button data-i="${z*8+s}">${code[z*8+s]}</button>`).join("")}</div>`).join("")}</div></div></div>
    <div id="m"></div>`;
  el.querySelector("#a").append(pixelRaster({w:8,h,werte:soll,palette:SW}).el);
  const knoepfe=[...el.querySelectorAll("#c button")];
  const zeig=()=>knoepfe.forEach((b,k)=>{b.textContent=code[k];b.classList.toggle("eins",code[k]===1)});zeig();
  knoepfe.forEach(b=>b.onclick=()=>{const k=+b.dataset.i;code[k]=code[k]?0:1;b.classList.remove("falsch");zeig();ctx.speichern()});
  ctx.pruefer=()=>{const m=el.querySelector("#m");
    if(code.every(x=>x===0)){m.className="msg no";m.textContent="Tippe zuerst die Zahlen an, dann auf „Weiter“.";return false}
    const falsch=[];soll.forEach((x,k)=>{if(code[k]!==x)falsch.push(k)});
    if(!falsch.length){m.className="msg ok";m.textContent="Richtig! Du hast das Bild codiert – wie ein Computer.";ctx.geschafft(punkte);return true}
    const stand=code.join("");if(stand!==ctx.daten.letzterFehler){ctx.fehler();ctx.daten.letzterFehler=stand;ctx.daten.versuche=(ctx.daten.versuche||0)+1;ctx.speichern()}
    m.className="msg no";m.textContent=falsch.length===1?"Fast! Noch 1 Zahl ist falsch.":`Noch ${falsch.length} Zahlen sind falsch.`;
    if((ctx.daten.versuche||0)>=3){knoepfe.forEach((b,k)=>b.classList.toggle("falsch",falsch.includes(k)));m.textContent+=" Sie sind jetzt rot."}
    return false};
  ctx.loesung=()=>{soll.forEach((x,k)=>code[k]=x);zeig()};
  if(ctx.geloest){const m=el.querySelector("#m");m.className="msg ok";m.textContent="Schon gelöst. Weiter geht's!"}
}}}

/* ---------- Kurzschrift: lange Codes kürzer schreiben (immer: erst weiß, dann schwarz, dann weiß …) ---------- */
/* Läufe einer Zeile: [{c:"0"|"1", n}] – gleiche Farben hintereinander zusammengefasst */
const laeufe=z=>{const r=[];for(const c of z){if(r.length&&r[r.length-1].c===c)r[r.length-1].n++;else r.push({c,n:1})}return r};
const SQ_W=`<i class="sq"></i>`,SQ_S=`<i class="sq s"></i>`;
const kurzText=z=>laeufe(z).map(l=>`<span class="lauf"><b>${l.n}</b>${l.c==="1"?SQ_S:SQ_W}</span>`).join("");

function kurzLesen(name,titel,punkte,merke){return{titel,punkte,merke,zeige(el,ctx){
  const roh=BILDER[name],soll=zahlen(roh);
  el.innerHTML=`<div class="regel"><b>Kurzschrift:</b> Statt ${SQ_W.repeat(3)+SQ_S.repeat(2)+SQ_W.repeat(3)} schreibt der Computer kurz: <b>3${SQ_W} 2${SQ_S} 3${SQ_W}</b>. Das spart Platz! Lies jede Zeile und mal das Bild.</div>
    <div class="paar" style="margin-top:12px"><div><p class="eyebrow">Kurzschrift</p><ol class="kurz">${roh.map(z=>`<li>${kurzText(z)}</li>`).join("")}</ol></div>
    <div><p class="eyebrow">Dein Bild</p><div id="b"></div></div></div>
    <div class="row noprint" style="margin-top:14px"><button class="btn ghost" id="l">Alles löschen</button><span class="muted small">Fertig? Tippe unten auf „Weiter“ – dann wird geprüft.</span></div><div id="m"></div>`;
  const r=pixelRaster({w:8,h:roh.length,werte:ctx.daten.bild,palette:SW,malbar:true,onAenderung:v=>{ctx.daten.bild=v.slice();ctx.speichern()}});
  el.querySelector("#b").append(r.el);
  const zeilen=el.querySelectorAll(".kurz li"),leuchte=z=>zeilen.forEach((li,k)=>li.classList.toggle("an",k===z));
  r.el.addEventListener("pointermove",e=>{const t=document.elementFromPoint(e.clientX,e.clientY);if(t&&t.dataset?.k!=null&&t.parentNode===r.el)leuchte(Math.floor(t.dataset.k/8))});
  r.el.addEventListener("pointerleave",()=>leuchte(-1));
  ctx.pruefer=()=>pruefen(ctx,r,soll,punkte,el.querySelector("#m"));
  ctx.loesung=()=>r.setzeAlle(soll);
  el.querySelector("#l").onclick=()=>{if(confirm("Wirklich alles löschen?"))r.setzeAlle(Array(soll.length).fill(0))};
  if(ctx.geloest){const m=el.querySelector("#m");m.className="msg ok";m.textContent="Schon gelöst. Weiter geht's!"}
}}}

function kurzSchreiben(name,titel,punkte,merke){return{titel,punkte,merke,zeige(el,ctx){
  const roh=BILDER[name],soll=roh.map(laeufe);
  const ein=ctx.daten.ein||(ctx.daten.ein=soll.map(l=>l.map(()=>"")));
  const lang=roh.length*8,kurz=soll.flat().length;
  el.innerHTML=`<div class="regel"><b>Jetzt du!</b> Jede Zeile ist in Kästen aufgeteilt. <b>Zähl die Kästchen in jedem Kasten</b> und schreib die Zahl darunter.</div>
    <div class="kurz-tabelle">${soll.map((l,z)=>`<div class="kzeile">${l.map((x,k)=>`<div class="gruppe"><div class="kaest">${`<i class="${x.c==="1"?"s":""}"></i>`.repeat(x.n)}</div><input inputmode="numeric" maxlength="1" placeholder="?" data-z="${z}" data-k="${k}" value="${esc(ein[z][k])}" aria-label="Anzahl"></div>`).join("")}</div>`).join("")}</div>
    <p class="muted" style="margin-top:12px">📦 Normal braucht das Bild <b>${lang} Zahlen</b>. In Kurzschrift nur <b>${kurz} Zahlen</b>!</p><div id="m"></div>`;
  const felder=[...el.querySelectorAll(".kurz-tabelle input")];
  felder.forEach((f,i)=>f.oninput=()=>{f.value=f.value.replace(/\D/g,"").slice(-1);ein[+f.dataset.z][+f.dataset.k]=f.value;f.classList.remove("falsch");ctx.speichern();
    if(f.value&&felder[i+1])felder[i+1].focus()});
  ctx.pruefer=()=>{const m=el.querySelector("#m");
    if(ein.flat().every(x=>x==="")){m.className="msg no";m.textContent="Schreib zuerst die Zahlen in die Felder, dann tippe auf „Weiter“.";return false}
    const falsch=[];soll.forEach((l,z)=>l.forEach((x,k)=>{if(+ein[z][k]!==x.n||ein[z][k]==="")falsch.push(`${z}_${k}`)}));
    if(!falsch.length){m.className="msg ok";m.textContent="Richtig! Du hast die Daten kleiner gemacht.";ctx.geschafft(punkte);return true}
    const stand=JSON.stringify(ein);if(stand!==ctx.daten.letzterFehler){ctx.fehler();ctx.daten.letzterFehler=stand;ctx.daten.versuche=(ctx.daten.versuche||0)+1;ctx.speichern()}
    m.className="msg no";m.textContent=falsch.length===1?"Fast! Noch 1 Zahl stimmt nicht.":`Noch ${falsch.length} Zahlen stimmen nicht.`;
    if((ctx.daten.versuche||0)>=2){felder.forEach(f=>f.classList.toggle("falsch",falsch.includes(`${f.dataset.z}_${f.dataset.k}`)));m.textContent+=" Sie sind jetzt rot."}
    return false};
  ctx.loesung=()=>felder.forEach(f=>{const n=soll[+f.dataset.z][+f.dataset.k].n;f.value=n;ein[+f.dataset.z][+f.dataset.k]=String(n)});
  if(ctx.geloest){const m=el.querySelector("#m");m.className="msg ok";m.textContent="Schon gelöst. Weiter geht's!"}
}}}

/* ---------- Zaubertrick (Prüfbit): In jeder Reihe und Spalte ist die Zahl der schwarzen Kästchen gerade.
   Der Zauberer dreht heimlich ein Kästchen um – das Kind findet es. So erkennt der Computer Übertragungsfehler. ---------- */
const N=6;
function neueRunde(){const g=Array(N*N).fill(0);
  for(let z=0;z<N-1;z++)for(let s=0;s<N-1;s++)g[z*N+s]=Math.random()<.45?1:0;
  for(let z=0;z<N-1;z++)g[z*N+N-1]=g.slice(z*N,z*N+N-1).reduce((a,b)=>a+b,0)%2;
  for(let s=0;s<N;s++){let n=0;for(let z=0;z<N-1;z++)n+=g[z*N+s];g[(N-1)*N+s]=n%2}
  return{g,dreh:null}}
function zauber(titel,punkte,runden,hilfe,merke){return{titel,punkte,merke,zeige(el,ctx){
  const d=ctx.daten;d.geschafft=d.geschafft||0;if(!d.runde)d.runde=neueRunde();ctx.speichern();
  const zeichne=()=>{const {g,dreh}=d.runde;
    const zs=z=>g.slice(z*N,z*N+N).reduce((a,b)=>a+b,0),ss=s=>{let n=0;for(let z=0;z<N;z++)n+=g[z*N+s];return n};
    el.innerHTML=`<div class="regel">🎩 <b>Der Trick:</b> In jeder Reihe und jeder Spalte sind <b>gerade viele</b> schwarze Kästchen (0, 2, 4 oder 6). Der Zauberer dreht heimlich <b>ein</b> Kästchen um. Wo ist jetzt eine Reihe <b>und</b> eine Spalte ungerade? Da ist es!</div>
      <p class="eyebrow" style="margin-top:12px">Runde ${Math.min(d.geschafft+1,runden)} von ${runden} · ✔️ ${d.geschafft} geschafft</p>
      <div class="zauber${hilfe?" hilfe":""}">${Array.from({length:N},(_,z)=>Array.from({length:N},(_,s)=>`<button data-i="${z*N+s}" class="${g[z*N+s]?"s":""}" ${dreh==null?"disabled":""}></button>`).join("")+(hilfe?`<span class="zahl">${zs(z)}</span>`:"")).join("")}
        ${hilfe?Array.from({length:N},(_,s)=>`<span class="zahl">${ss(s)}</span>`).join("")+"<span></span>":""}</div>
      <div class="row" style="margin-top:14px">${d.geschafft>=runden?"":dreh==null?`<button class="btn" id="zaub">🎩 Zaubern! Ein Kästchen umdrehen</button>`:`<span class="msg" style="margin:0">👆 Tippe auf das umgedrehte Kästchen!</span>`}</div><div id="m"></div>`;
    if(hilfe)el.querySelector(".zauber").style.gridTemplateColumns=`repeat(${N},1fr) 2.2em`;
    const z=el.querySelector("#zaub");if(z)z.onclick=()=>{const g2=d.runde.g;el.querySelector(".zauber").classList.add("wackeln");
      setTimeout(()=>{const i=Math.floor(Math.random()*N*N);g2[i]=g2[i]?0:1;d.runde.dreh=i;ctx.speichern();zeichne()},600)};
    el.querySelectorAll(".zauber button:not([disabled])").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
      if(i===d.runde.dreh){b.classList.add("gefunden");d.geschafft++;d.runde=neueRunde();ctx.speichern();
        if(d.geschafft>=runden){ctx.geschafft(punkte);setTimeout(()=>{zeichne();const m=el.querySelector("#m");m.className="msg ok";m.textContent="🎉 Super! Du hast den Trick durchschaut. Tippe auf „Weiter“."},500)}
        else{toast("Gefunden! 🎉");setTimeout(zeichne,700)}}
      else{ctx.fehler();b.classList.add("daneben");toast("Nicht das – zähl die schwarzen Kästchen in jeder Reihe!")}});
  };
  zeichne();
  ctx.pruefer=()=>{const m=el.querySelector("#m");m.className="msg no";m.textContent=`Noch ${runden-d.geschafft} ${runden-d.geschafft===1?"Runde":"Runden"}!`;return false};
  ctx.loesung=()=>{if(d.runde.dreh!=null){const b=el.querySelector(`.zauber button[data-i="${d.runde.dreh}"]`);if(b)b.classList.add("gefunden")}else toast("Erst „Zaubern“ tippen")};
}}}

/* ---------- Pixel-Rätsel (Nonogramm): Die Zahlen am Rand sagen, wie viele schwarze Kästchen nebeneinander liegen ---------- */
const hinweise=zeile=>{const r=[];let n=0;for(const c of zeile){if(c===1)n++;else if(n){r.push(n);n=0}}if(n)r.push(n);return r.length?r:[0]};
function nonogramm(name,titel,punkte,merke){return{titel,punkte,merke,zeige(el,ctx){
  const roh=BILDER[name],h=roh.length,w=roh[0].length,soll=zahlen(roh);
  const reihe=z=>soll.slice(z*w,z*w+w),spalte=sp=>Array.from({length:h},(_,z)=>soll[z*w+sp]);
  const rh=Array.from({length:h},(_,z)=>hinweise(reihe(z))),sh=Array.from({length:w},(_,sp)=>hinweise(spalte(sp)));
  el.innerHTML=`<div class="regel">🧩 <b>Pixel-Rätsel:</b> Die Zahlen sagen dir, wie viele <b>schwarze Kästchen nebeneinander</b> liegen. „2 1“ heißt: erst 2 schwarze, dann Lücke, dann 1 schwarzes. Eine Zahl wird <b style="color:var(--good)">grün</b>, wenn die Reihe passt.</div>
    <div class="nono" style="--w:${w}"><div></div><div class="sh">${sh.map((x,sp)=>`<span data-s="${sp}">${x.join("<br>")}</span>`).join("")}</div>
      <div class="rh">${rh.map((x,z)=>`<span data-r="${z}">${x.join(" ")}</span>`).join("")}</div><div id="b"></div></div>
    <div class="row noprint" style="margin-top:14px"><button class="btn ghost" id="l">Alles löschen</button><span class="muted small">Fertig? Tippe unten auf „Weiter“.</span></div><div id="m"></div>`;
  const pruefeZeilen=v=>{
    for(let z=0;z<h;z++)el.querySelector(`[data-r="${z}"]`).classList.toggle("ok",hinweise(v.slice(z*w,z*w+w)).join()===rh[z].join());
    for(let sp=0;sp<w;sp++)el.querySelector(`[data-s="${sp}"]`).classList.toggle("ok",hinweise(Array.from({length:h},(_,z)=>v[z*w+sp])).join()===sh[sp].join())};
  const r=pixelRaster({w,h,werte:ctx.daten.bild,palette:SW,malbar:true,onAenderung:v=>{ctx.daten.bild=v.slice();ctx.speichern();pruefeZeilen(v)}});
  el.querySelector("#b").append(r.el);r.el.style.maxWidth="none";pruefeZeilen(r.werte);
  ctx.pruefer=()=>pruefen(ctx,r,soll,punkte,el.querySelector("#m"));
  ctx.loesung=()=>r.setzeAlle(soll);
  el.querySelector("#l").onclick=()=>{if(confirm("Wirklich alles löschen?"))r.setzeAlle(Array(w*h).fill(0))};
  if(ctx.geloest){const m=el.querySelector("#m");m.className="msg ok";m.textContent="Schon gelöst. Weiter geht's!"}
}}}

/* ---------- Farbmischer: Bildschirm-Farben entstehen aus 3 Lampen (Rot, Grün, Blau). Jede Lampe: aus / halb / an.
   Für den Computer ist jede Farbe 3 Zahlen (0, 128 oder 255). ---------- */
const STUFEN=[0,128,255],STUFE_TEXT=["aus","halb","an"];
const ZIELE=[
  {n:"Rot",s:[2,0,0],tipp:"Mach nur die rote Lampe an."},
  {n:"Gelb",s:[2,2,0],tipp:"Komisch, aber wahr: <b>Rot + Grün</b> ergibt bei Licht <b>Gelb</b>!"},
  {n:"Weiß",s:[2,2,2],tipp:"Was passiert, wenn <b>alle drei</b> Lampen an sind?"},
  {n:"Lila",s:[1,0,2],tipp:"<b>Halb Rot</b> und <b>ganz Blau</b>."},
];
const rgb=st=>st.map(x=>STUFEN[x]).join(",");
function farbmischer(titel,punkte,merke){return{titel,punkte,merke,zeige(el,ctx){
  const d=ctx.daten;d.runde=d.runde||0;d.s=d.s||[0,0,0];
  const zeichne=()=>{
    if(d.runde>=ZIELE.length){el.innerHTML=`<div class="msg ok">🎨 Alle Farben gemischt! Tippe auf „Weiter“.</div>`;return}
    const ziel=ZIELE[d.runde];
    el.innerHTML=`<div class="regel">🔦 Jeder Bildschirm hat winzige <b>Lampen</b> in Rot, Grün und Blau. Tippe auf die Lampen, bis deine Farbe aussieht wie das Ziel. Jede Lampe: <b>aus → halb → an</b>.</div>
      <p class="eyebrow" style="margin-top:12px">Farbe ${d.runde+1} von ${ZIELE.length}</p><p class="tipp">💡 Tipp: ${ziel.tipp}</p>
      <div class="mischer"><div class="felder"><div><div class="feld" style="background:rgb(${rgb(ziel.s)})"></div><b>Ziel: ${ziel.n}</b></div>
        <div><div class="feld" id="du"></div><b>Deine Farbe</b></div></div>
        <div><div class="lampen">${["Rot","Grün","Blau"].map((n,k)=>`<button class="lampe l${k}" data-k="${k}"><span class="birne"></span><b>${n}</b><span class="stufe"></span></button>`).join("")}</div>
        <p class="muted" style="margin-top:10px">Für den Computer ist deine Farbe: <b id="code"></b></p></div></div><div id="m"></div>`;
    const male=()=>{el.querySelector("#du").style.background=`rgb(${rgb(d.s)})`;
      el.querySelectorAll(".lampe").forEach(b=>{const k=+b.dataset.k;b.dataset.st=d.s[k];b.querySelector(".stufe").textContent=`${STUFE_TEXT[d.s[k]]} (${STUFEN[d.s[k]]})`});
      el.querySelector("#code").textContent=d.s.map(x=>STUFEN[x]).join(", ")};male();
    el.querySelectorAll(".lampe").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;d.s[k]=(d.s[k]+1)%3;male();ctx.speichern();
      if(d.s.join()===ZIELE[d.runde].s.join()){const m=el.querySelector("#m");m.className="msg ok";m.textContent="✔️ Genau richtig! Tippe auf „Weiter“."}});
  };
  zeichne();
  ctx.pruefer=()=>{const m=el.querySelector("#m");
    if(d.runde>=ZIELE.length){ctx.geschafft(punkte);return true}
    if(d.s.join()===ZIELE[d.runde].s.join()){d.runde++;d.s=[0,0,0];ctx.speichern();
      if(d.runde>=ZIELE.length){ctx.geschafft(punkte);return true}
      toast("Perfekt gemischt! 🎨 Nächste Farbe");zeichne();return false}
    m.className="msg no";m.textContent="Noch nicht gleich – schau dir den Tipp oben an.";return false};
  ctx.loesung=()=>{if(d.runde<ZIELE.length){d.s=ZIELE[d.runde].s.slice();zeichne()}};
}}}

/* Neue Version holen (wie KT Schule): beim Start und beim Zurückkehren */
async function versionPruefen(){if(!/github\.io$/.test(location.hostname))return;
  try{const r=await fetch("version.txt?"+Date.now(),{cache:"no-store"});const v=(await r.text()).trim();
    if(!v||v===VERSION)return;
    /* höchstens ein Neuladen pro Version (sonst Schleife, solange GitHub noch die alte Seite ausliefert) */
    let schon=null;try{schon=sessionStorage.getItem("if5-neu")}catch(e){}
    if(schon===v)return;try{sessionStorage.setItem("if5-neu",v)}catch(e){}
    await hochladen();location.replace(location.pathname+"?v="+v+location.hash)}catch(e){}}
